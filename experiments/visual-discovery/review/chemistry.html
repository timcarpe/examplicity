/* Packet travel and collision evidence share a compact marker vocabulary. */
.csma-wave{position:absolute;inset:0;pointer-events:none}
.csma-wave .csma-trail{position:absolute;top:293px;height:5px;border-radius:999px;background:color-mix(in srgb,var(--signal) 26%,transparent);transition:left .6s linear,width .6s linear}
.csma-packet{--packet:var(--signal);position:absolute;top:296px;transform:translate(-50%,-50%);transition:left .6s linear,margin-left .6s linear,background-color .12s,border-color .12s;z-index:3}
.csma-packet svg{width:13px;height:15px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
.csma-owner{font:400 12px/1 var(--lab-font-sans,sans-serif)}
.csma-colliding-frame .csma-packet{margin-left:var(--collision-offset)}
.csma-packet.is-damaged{--packet:var(--lab-bad);background:var(--lab-bad);border-color:white;color:var(--lab-bad)}
.csma-packet.is-damaged svg{opacity:.45}
.csma-collision{z-index:5;--signal:var(--lab-bad,#b42318)}
.csma-collision .csma-trail{top:291px;height:9px;background:color-mix(in srgb,var(--lab-bad,#b42318) 24%,transparent)}
.csma-impact{position:absolute;left:50%;top:296px;width:26px;height:26px;display:grid;place-items:center;transform:translate(-50%,-50%);border:1px solid var(--lab-bad,#b42318);border-radius:50%;background:white;color:var(--lab-bad,#b42318);font:400 24px/1 var(--lab-font-sans,sans-serif);z-index:6}
.csma-impact::after{content:'';position:absolute;inset:-3px;border:1px solid var(--lab-bad,#b42318);border-radius:50%;animation:lab-collision-impact .8s ease-out 2}
.csma-impact-label{position:absolute;left:50%;top:317px;transform:translateX(-50%);font:400 12px/1.4 var(--lab-font-sans,sans-serif);color:var(--lab-bad,#b42318);white-space:nowrap}
.csma-damage-front{position:absolute;top:296px;transform:translate(-50%,-50%);color:var(--lab-bad,#b42318);font:400 25px/1 var(--lab-font-sans,sans-serif);transition:left .6s linear}
.csma-collision.is-arriving :is(.csma-impact,.csma-impact-label,.csma-damage-front,.csma-trail){visibility:hidden}

html[data-theme="dark"] .lab-programming .lab-action[data-priority="primary"]{background:var(--lab-accent);color:#fff}
html[data-theme="dark"] .lab-programming .lab-action:disabled{background:var(--lab-surface-strong);color:var(--lab-muted);border-color:var(--lab-line);box-shadow:none}

/* Fixed bit budget and compensated storage shifts are different manipulatives. */

.cs-binary-floating-point .trade-card{padding:12px;border:0;border-radius:9px;background:color-mix(in srgb,var(--lab-accent) 12%,white)}
.cs-binary-floating-point .trade-card:last-child{background:color-mix(in srgb,var(--lab-concept-violet) 16%,white)}
.cs-binary-floating-point .trade-card p{margin:5px 0 0}
.cs-binary-floating-point .fit.good{background:var(--lab-good-soft);border-color:var(--lab-good);color:var(--lab-good-ink)}
.cs-binary-floating-point .fit.good strong{font-size:14px;text-transform:none}
.cs-binary-floating-point .fit.good strong::before{content:'✓ ';color:var(--lab-good)}
.cs-binary-floating-point .auth-impact.good{background:var(--lab-good-soft);border-color:var(--lab-good-line)}

.cs-binary-floating-point .divider{width:36px;transform:translateX(-18px);border:1px solid var(--lab-accent-line);border-radius:9px;background:var(--lab-surface);color:var(--lab-accent-ink);height:48px;top:-4px}

.cs-binary-floating-point .divider::after{content:'↔';left:2px;top:11px;bottom:auto;width:30px;height:23px;border:0;background:var(--lab-surface);transform:none;font:400 24px/23px var(--lab-font-sans);text-align:center}
.cs-binary-floating-point .mantissa-drag:not(.locked){padding:8px 10px 20px;border:1px solid var(--lab-accent-line);border-radius:8px;position:relative;cursor:ew-resize}
.cs-binary-floating-point .mantissa-drag:not(.locked)::after{content:'↔';position:absolute;bottom:1px;left:0;right:0;text-align:center;font:400 16px/16px var(--lab-font-sans);color:var(--lab-accent-ink)}
.cs-binary-floating-point .rep-side.good{background:var(--lab-good-soft);border-color:var(--lab-good-line)}
/* A compact context strip retains milestone meaning without covering the circuit. */
.cs-logic-circuit-flip-flop main{max-width:1200px}
.cs-logic-circuit-flip-flop .visual-head{display:none}
.cs-logic-circuit-flip-flop .phase-modal.lab-working-context{position:static;width:auto;max-width:none;margin:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 16px;background:var(--lab-surface-muted);border:0;box-shadow:none}
.cs-logic-circuit-flip-flop .phase-modal>strong{font-size:15px;grid-column:1}
.cs-logic-circuit-flip-flop .phase-modal>p{margin:0;grid-column:1}
.cs-logic-circuit-flip-flop .phase-actions{grid-column:2;grid-row:1/3;align-items:center;padding:0}
.cs-logic-circuit-flip-flop #phase-content{display:none}
.cs-logic-circuit-flip-flop .stage{max-height:430px;aspect-ratio:900/520;object-fit:contain}
.cs-logic-circuit-flip-flop .stage-shell{background:#fff}
.cs-logic-circuit-flip-flop .stage-caption{background:var(--lab-surface);padding:10px 14px}
/* Recursion: active execution is blue; learner work and checked outcomes stay distinct. */
.cs-recursive-call-stack{--code-bg:var(--lab-surface);--code-ink:var(--lab-ink);--code-muted:var(--lab-muted);--code-active:var(--lab-accent-soft);--code-keyword:var(--lab-accent-ink);--code-number:var(--lab-concept-violet);--code-name:var(--lab-ink);--return:var(--lab-accent);--return-soft:var(--lab-accent-soft);--base:var(--lab-good);--base-soft:var(--lab-good-soft)}
.cs-recursive-call-stack .recursion-rules:has(#ruleControls[hidden]){display:none}
.cs-recursive-call-stack .stack-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.cs-recursive-call-stack .stack-toolbar .mission-actions{margin:0;gap:6px}
.cs-recursive-call-stack .stack-toolbar #outputBox{margin-left:auto}
.cs-recursive-call-stack .stack-title>span{display:none}
.cs-recursive-call-stack .code-panel{border:1px solid var(--lab-line);box-shadow:none;background:var(--lab-surface);border-radius:10px}
.cs-recursive-call-stack .code-titlebar{background:var(--lab-surface-muted);color:var(--lab-muted);border-bottom:1px solid var(--lab-line);font:400 11px/1.4 var(--lab-font-sans)}
.cs-recursive-call-stack .code-lights{display:none}
.cs-recursive-call-stack .code-line.active{box-shadow:none;background:var(--lab-accent-soft)}
.cs-recursive-call-stack .code-line.active::before{color:var(--lab-accent-ink)}
.cs-recursive-call-stack :is(.working-row,.working-row.blocked,.working-row.returned){background:var(--lab-surface-muted);border-color:var(--lab-line);opacity:1;box-shadow:none}
.cs-recursive-call-stack .working-row.current{border-color:var(--lab-accent-line);background:var(--lab-accent-soft)}
.cs-recursive-call-stack .working-row.needs-work{border-color:var(--lab-needed-line);background:var(--lab-needed-surface)}
.cs-recursive-call-stack .working-row.correct{border-color:var(--lab-good-line);background:var(--lab-good-soft)}
.cs-recursive-call-stack .working-row.wrong{border-color:var(--lab-bad-line);background:var(--lab-bad-soft)}
.cs-recursive-call-stack .working-frame{background:var(--lab-surface-strong);color:var(--lab-ink-secondary)}
.cs-recursive-call-stack .working-row.current .working-frame{background:var(--lab-accent);color:#fff}
.cs-recursive-call-stack .working-row.correct .working-frame{background:var(--lab-good);color:#fff}
.cs-recursive-call-stack .working-row.wrong .working-frame{background:var(--lab-bad);color:#fff}
.cs-recursive-call-stack :is(.eq-term,.eq-term.child-ready,.eq-result,.state-cell){background:color-mix(in srgb,var(--lab-concept-violet) 12%,white);color:var(--lab-ink);border:0;box-shadow:none}
.cs-recursive-call-stack .eq-result:has(input){background:transparent;padding:0}
.cs-recursive-call-stack .eq-result input{border:1px solid var(--lab-needed-line);background:#fff;color:var(--lab-ink)}
.cs-recursive-call-stack .working-row.correct input{border-color:var(--lab-good);color:var(--lab-good-ink)}
.cs-recursive-call-stack .working-row.wrong input{border-color:var(--lab-bad);color:var(--lab-bad-ink)}
.cs-recursive-call-stack .stack-frame.sequence-processing{border-color:var(--lab-accent-line);background:var(--lab-accent-soft);box-shadow:none}
.cs-recursive-call-stack .stack-frame.sequence-processing .frame-status{color:var(--lab-accent-ink)}
.cs-recursive-call-stack .stack-frame .state-cell:is(.sequence-focus,.sequence-held,.sequence-result){box-shadow:none;transform:none;border:0}
/* Direct boundary grips: generous hit area, clear action and persistent parameter readouts. */
.lab-boundary-grip{cursor:grab;touch-action:none;outline:none}
.lab-is-dragging .lab-boundary-grip{cursor:grabbing}
.lab-boundary-hit{fill:transparent;stroke:none}
.lab-boundary-knob{fill:var(--lab-surface);stroke:var(--lab-accent);stroke-width:2}
.lab-boundary-grip:hover .lab-boundary-knob,.lab-boundary-grip:focus .lab-boundary-knob{stroke:var(--lab-accent-ink);stroke-width:3}
.lab-boundary-grip.is-locked{opacity:.4;cursor:default}
.lab-boundary-icon{font:400 22px/1 var(--lab-font-sans);fill:var(--lab-accent-ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.lab-boundary-arrow{fill:none;stroke:var(--lab-accent-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.lab-boundary-label{font:400 14px/1 var(--lab-font-sans);fill:var(--lab-ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.cs-single-neuron-threshold .lab-parameter-readouts{padding:12px 16px;border:0}
.cs-single-neuron-threshold .lab-parameter-readouts :is(.side-heading,.param-track,#paramNote){display:none}
.cs-single-neuron-threshold .lab-parameter-readouts .param-stack{display:flex;gap:10px;flex-wrap:wrap}
.cs-single-neuron-threshold .lab-parameter-readouts .param-control{flex:1;min-width:120px;padding:8px 12px;border:0;background:color-mix(in srgb,var(--lab-concept-violet) 14%,white);animation:none;box-shadow:none}
.cs-single-neuron-threshold .lab-parameter-readouts .param-meta{margin:0}
.cs-single-neuron-threshold .lab-parameter-readouts .param-control.locked{opacity:1}
.cs-single-neuron-threshold .stage{touch-action:none}
.cs-single-neuron-threshold .stage text.lab-boundary-icon{font-size:22px}
.cs-single-neuron-threshold .stage text.lab-boundary-label{font-size:14px}
.cs-single-neuron-threshold #relationshipWorkAction{padding-top:10px}
@media(max-width:750px){.cs-logic-circuit-flip-flop .phase-modal.lab-working-context{display:block}.cs-logic-circuit-flip-flop .phase-actions{padding-top:10px;justify-content:flex-start}.cs-recursive-call-stack .stack-toolbar #outputBox{margin-left:0}}

.cs-recursive-call-stack .code-test{font:400 11px/1.4 var(--lab-font-sans);color:var(--lab-muted);background:var(--lab-surface-strong)}
.cs-recursive-call-stack .code-test.false{color:var(--lab-ink-secondary);background:var(--lab-surface-strong)}
.cs-recursive-call-stack .code-test.true{color:var(--lab-good-ink);background:var(--lab-good-soft)}

.cs-recursive-call-stack .return-equation-ribbon small{font:400 11px/1.4 var(--lab-font-sans);color:var(--lab-accent-ink);text-transform:none;letter-spacing:normal}
.cs-recursive-call-stack .return-equation-ribbon strong{font:400 16px/1.4 var(--lab-font-mono,monospace);color:var(--lab-ink)}
.cs-recursive-call-stack .stack-frame.sequence-resumed{background:var(--lab-accent-soft);border-color:var(--lab-accent-line);box-shadow:none}
.cs-recursive-call-stack .stack-frame:is(.sequence-resumed,.sequence-processing) .state-cell{opacity:1}
.cs-recursive-call-stack .stack-frame:is(.sequence-resumed,.sequence-processing) .state-cell:is(.sequence-focus,.sequence-held,.sequence-ready-input,.sequence-arrival,.sequence-next){background:var(--lab-accent-soft);box-shadow:none}
.cs-recursive-call-stack .fly-token{background:var(--lab-accent);font-weight:400}
.cs-recursive-call-stack .fly-token::before{font:400 11px/1.4 var(--lab-font-sans);text-transform:none;letter-spacing:normal}
.cs-recursive-call-stack .mission.lab-activity-bar{border-radius:12px}
html[data-theme="dark"] .lab-programming .lab-syllabus-chip{--syllabus-chip-bg:var(--lab-accent-soft)!important;--syllabus-chip-text:var(--lab-accent-ink)!important;--syllabus-chip-border:var(--lab-accent-line)!important}
html[data-theme="dark"] .lab-programming select::picker(select){border-color:var(--lab-line)}
.cs-recursive-call-stack .stack-frame .frame-call strong{font-size:14px;font-weight:400}
.cs-recursive-call-stack .stack-frame .frame-id{font-size:12px;font-weight:400}
.cs-recursive-call-stack .stack-frame .frame-status{font-size:11px;font-weight:400;letter-spacing:normal;text-transform:none}
.cs-recursive-call-stack .stack-frame .state-cell{padding:5px 7px}
.cs-recursive-call-stack .stack-frame .state-cell small{font:400 11px/1.35 var(--lab-font-sans);letter-spacing:normal;text-transform:none}
.cs-recursive-call-stack .stack-frame .state-cell strong{font:400 14px/1.35 var(--lab-font-mono,ui-monospace,Consolas,monospace);color:var(--lab-ink)}

/* Header settings: minimal centered captions; exam and working use neutral ink. */
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar:has([data-lab-setting]){display:flex;align-items:center;flex-wrap:wrap;gap:16px}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar .lab-settings-path{display:contents!important}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-setting-old-label{display:none!important}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar [data-lab-setting]{flex:none;margin:0;align-self:center}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar [data-lab-setting="working"]{order:30;position:relative;overflow:visible}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar [data-lab-setting="exam"]{order:40;position:relative;overflow:visible}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar [data-lab-setting="checkpoints"]{order:50}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar [data-lab-setting-lead]{margin-left:auto}
:is(.lab-adopt-v3,.lab-settings-adopt) :is([data-lab-setting="working"],[data-lab-setting="exam"])::before{position:absolute;left:50%;top:-18px;transform:translateX(-50%);padding:0;border:0;background:none;color:var(--lab-ink-secondary);font:400 11px/1.2 var(--lab-font-sans,sans-serif);white-space:nowrap;pointer-events:none}
:is(.lab-adopt-v3,.lab-settings-adopt) [data-lab-setting="working"]::before{content:'Working'}
:is(.lab-adopt-v3,.lab-settings-adopt) [data-lab-setting="exam"]::before{content:'Exam'}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar :is([data-lab-setting="working"],[data-lab-setting="exam"])>button:is([aria-pressed="true"],[aria-checked="true"]){background:var(--lab-ink,#1d1d1f);color:var(--lab-surface,#fff);font-weight:400;border-color:transparent;box-shadow:none}
:is(.lab-adopt-v3,.lab-settings-adopt) .lab-activity-bar :is([data-lab-setting="working"],[data-lab-setting="exam"])>button:disabled{cursor:default}
/* Flat helper material keeps values aligned with their register columns. */
.lab-binary .place-values{height:auto;min-height:30px;gap:2px;align-items:stretch;margin-bottom:7px;font-weight:400;letter-spacing:normal}
.lab-binary .place-values>span{display:grid;place-items:center;padding:5px 1px;border-radius:5px;background:color-mix(in srgb,var(--lab-concept-violet) 16%,white);color:var(--lab-ink);font-weight:400;min-width:0}
.lab-binary .help-tip{border:0;background:var(--lab-accent-soft);padding:12px 16px;border-radius:8px;box-shadow:none}
.lab-binary :is(.scalar-value,.scalar-base,.bit-cell,.bit-input,.operator,.feedback strong,.help-tip strong,#prompt strong){font-weight:400;letter-spacing:normal}
.lab-binary .scalar-base{font-size:12px;text-transform:none}
.lab-binary .range-select{margin-left:auto;max-width:100%;min-width:170px}
.lab-binary .topbar [data-lab-setting="exam"]{margin-left:0}

.lab-binary #prompt{font:400 16px/1.5 var(--lab-font-sans);color:var(--lab-accent-ink)}
.lab-binary :is(button,.answer-label,.help-button){font-weight:400}

.lab-menu-select:focus-visible{outline:none;box-shadow:none;border-color:var(--lab-line-strong)}

.lab-binary .card.help-active .place-values{opacity:1;transition:none}

/* Compact frame identities are labels, not tall state indicators. */
.cs-recursive-call-stack .stack-frame .frame-id,.cs-recursive-call-stack :is(.working-row,.working-row.current,.working-row.correct,.working-row.wrong) .working-frame{position:static;transform:none;align-self:start;justify-self:start;display:grid;place-items:center;width:32px;height:28px;min-height:28px;min-width:0;padding:4px;border:0;border-radius:6px;background:color-mix(in srgb,var(--lab-concept-violet) 16%,white);color:var(--lab-ink);font:400 12px/1.4 var(--lab-font-sans);box-shadow:none}
/* Consoles follow the workbench theme, with padded output and input surfaces. */
.lab-programming .console-pane{background:var(--lab-surface);color:var(--lab-ink);border-color:var(--lab-line)}
.lab-programming .console-head{background:var(--lab-surface-muted);color:var(--lab-ink);border-color:var(--lab-line-subtle);font-weight:400}
.lab-programming .console-head button{min-height:36px;height:auto;padding:7px 12px;border:1px solid var(--lab-accent-line);background:var(--lab-surface);color:var(--lab-accent-ink);font:400 12px/1.4 var(--lab-font-sans)}
.lab-programming .console-body{padding:14px 16px;color:var(--lab-ink)}
.lab-programming .console-message{color:var(--lab-muted);font-weight:400}
.lab-programming .console-message.good{color:var(--lab-good-ink)}
.lab-programming .console-message.bad{color:var(--lab-bad-ink)}
.lab-programming .console-message.info{color:var(--lab-accent-ink)}
.lab-programming .console-input-row{padding:12px 14px;gap:8px;border-color:var(--lab-line-subtle);background:var(--lab-accent-soft)}
.lab-programming .console-input-row label{color:var(--lab-ink-secondary);font:400 12px/1.4 var(--lab-font-sans);white-space:normal;overflow:visible}
.lab-programming .console-input-row input{min-height:38px;height:auto;padding:8px 10px;background:var(--lab-surface);color:var(--lab-ink);border:1px solid var(--lab-accent-line);font:400 14px/1.4 var(--lab-font-mono,monospace)}
.lab-programming .console-input-row input:focus-visible{outline:none;box-shadow:none;border-color:var(--lab-accent-ink)}
.lab-programming .console-input-row button{height:auto;min-height:38px;padding:8px 12px;font:400 12px/1.4 var(--lab-font-sans)}
/* Readouts remain usable when a geometric parameter has no visible handle. */
.lab-value-grip{display:inline-flex;align-items:center;gap:6px;min-width:66px;min-height:32px;padding:4px 7px;border:1px solid transparent;border-radius:6px;touch-action:none;user-select:none;cursor:ew-resize}
.lab-value-grip[aria-disabled="false"]{background:var(--lab-surface);border-color:var(--lab-accent-line);color:var(--lab-accent-ink)}
.lab-value-grip[aria-disabled="false"]::after{content:'↔';font:400 14px/1 var(--lab-font-sans)}
.lab-value-grip[aria-disabled="true"]{cursor:default;color:var(--lab-muted)}
.lab-value-grip:focus-visible{outline:none;border-color:var(--lab-accent-ink)}
.cs-binary-floating-point .storage-comparison{display:block;padding:6px 0;font-size:12px}
.cs-binary-floating-point .normalizer-head span{max-width:760px;font-size:12px;line-height:1.45}

/* Hidden challenge numbers must not leave an empty fixed grid column. */
.cs-python-programming-practice .challenge-brief{grid-template-columns:minmax(0,1fr) auto;align-items:start;background:var(--lab-accent-soft)}
.cs-python-programming-practice .challenge-brief-actions{position:static;align-self:start}
.cs-python-programming-practice .challenge-prompt .semantic-call{font-weight:400}
/* Shared model tool rows keep reset actions below mission/settings. */
.lab-model-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 20px;border-bottom:1px solid var(--lab-line-subtle);background:var(--lab-surface)}
.lab-similarity .relationship-dock>:is(.relationship-placeholder,.relationship-result){border:0;box-shadow:none;background:transparent;padding:0}
/* Attention is owned by the current task and ends when that target is used. */
button[data-lab-attention="true"]:not(:disabled){animation:lab-run-attention 1.8s ease-in-out infinite}
svg [data-lab-attention="true"]>.card{animation:lab-card-attention 1.8s ease-in-out infinite;stroke:var(--lab-accent);stroke-width:2}

 el('rect',{x:px,y:mid-9,width:width+x+46-px,height:18,rx:5,fill:'url(#metal)',stroke:'var(--lab-concept-slate)','stroke-width':1});el('rect',{x:px-7,y:y-3,width:17,height:height+6,rx:4,fill:'var(--lab-concept-slate)',stroke:'var(--lab-concept-slate-ink)','stroke-width':1.5});line(px-3,y+8,px-3,y+height-8,{stroke:'var(--lab-concept-slate-line)','stroke-width':2});
