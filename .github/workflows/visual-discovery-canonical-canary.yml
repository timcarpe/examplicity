name: Canonical visual discovery canary
on:
  push:
    branches: [codex/visual-discovery-refinements-20260910]
    paths:
      - .github/workflows/visual-discovery-canonical-canary.yml
permissions:
  contents: write
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-discovery-refinements-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate the straight-line canary into its production slug
        run: |
          node scripts/rectify-visual-discovery-canary.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('labs-src/mathematics/straight-line-coordinates-equations/lab.html')
          s=p.read_text()
          for attr in [' data-lab-role="control"',' data-lab-action="back"',' data-lab-action="forward"',' data-lab-action="advance"']:
              s=s.replace(attr,'')
          p.write_text(s)
          PY
      - name: Remove duplicate pilot implementation sources
        run: |
          rm -f \
            experiments/visual-discovery/src/straight-lines-model.js \
            experiments/visual-discovery/src/straight-lines-svg.js \
            experiments/visual-discovery/src/straight-lines.js \
            experiments/visual-discovery/src/straight-lines.css
      - name: Build with the real publication pipeline
        run: |
          npm run lab -- build straight-line-coordinates-equations
          npm run lab -- validate straight-line-coordinates-equations
      - name: Verify canonical architecture and repository publication state
        run: |
          node --test --experimental-strip-types tests/visual-discovery-canonical.test.ts
          npm run labs:sync:check
          npm run developer:check
      - name: Install isolated browser verification tools
        run: |
          mkdir -p /tmp/vd-browser
          npm install --prefix /tmp/vd-browser playwright@1.57.0
          /tmp/vd-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise the canonical published rail lab
        env:
          PLAYWRIGHT_MODULE: /tmp/vd-browser/node_modules/playwright/index.js
        run: node --experimental-strip-types experiments/visual-discovery/verify-straight-lines.mjs
      - name: Remove one-shot migration script and commit canonical result
        run: |
          rm scripts/rectify-visual-discovery-canary.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate straight-line discovery lab to canonical publication path'
          git push origin HEAD:codex/visual-discovery-refinements-20260910
