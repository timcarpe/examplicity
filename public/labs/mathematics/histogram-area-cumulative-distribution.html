function positionGuideCard(host,card,nodes){if(!nodes.length)return;const hr=host.getBoundingClientRect(),rs=nodes.map(n=>n.getBoundingClientRect()),left=Math.min(...rs.map(r=>r.left))-hr.left,right=Math.max(...rs.map(r=>r.right))-hr.left,top=Math.min(...rs.map(r=>r.top))-hr.top,bottom=Math.max(...rs.map(r=>r.bottom))-hr.top,m=8,g=12,narrow=matchMedia('(max-width:650px)').matches,cw=Math.min(narrow?200:220,Math.max(narrow?150:180,hr.width*(narrow?.5:.27)));card.style.width=`${cw}px`;card.style.left='0px';card.style.top='0px';const cr=card.getBoundingClientRect(),w=cr.width,h=cr.height,candidates=[{x:right+g,y:(top+bottom-h)/2},{x:left-w-g,y:(top+bottom-h)/2},{x:(left+right-w)/2,y:top-h-g},{x:(left+right-w)/2,y:bottom+g},{x:m,y:m},{x:hr.width-w-m,y:m},{x:m,y:hr.height-h-m},{x:hr.width-w-m,y:hr.height-h-m}],target={left:left-g,right:right+g,top:top-g,bottom:bottom+g};let best=candidates[0],bestScore=Infinity;for(const c0 of candidates){const c={x:Math.max(m,Math.min(hr.width-w-m,c0.x)),y:Math.max(m,Math.min(hr.height-h-m,c0.y))},box={left:c.x,right:c.x+w,top:c.y,bottom:c.y+h},outside=(c0.x<c.x||c0.y<c.y||c0.x>c.x+.1||c0.y>c.y+.1)?1:0,score=overlapArea(box,target)*1000+outside*250+Math.hypot((box.left+box.right)/2-(target.left+target.right)/2,(box.top+box.bottom)/2-(target.top+target.bottom)/2)*.02;if(score<bestScore){bestScore=score;best=c}}card.style.left=`${best.x+host.scrollLeft}px`;card.style.top=`${best.y+host.scrollTop}px`}

function completionContent(){if(!state.guide)return null;const g=state.guide;if(g.type==='classComplete'){const i=g.index,last=i===sample().frequencies.length-1;return{title:last?'Distribution built':'Interval linked',text:last?'Every bar area now matches the corresponding cumulative rise.':'The same frequency is encoded by histogram area and cumulative growth.',primary:last?'Estimate quartiles':'Continue'}}if(g.type==='quartileComplete'){const i=g.index,v=state.quartiles[QKEYS[i]];return{title:`${QLABELS[i]} ≈ ${fmt(v,1)} min`,text:i===2?'Q1 and Q3 bound the middle 50%.':'The horizontal read-off is estimated within a grouped interval.',primary:i===0?'Continue':i===1?'Continue':state.workLevel===0?'See IQR':'Calculate IQR'}}if(g.type==='final')return{title:'Problem complete',text:`IQR ≈ ${fmt(iqrTarget(),1)} min. The grouped read-offs remain estimates.`,primary:'Next problem',secondary:'Experiment'};return null}
function positionCompletion(){const layer=$('completionLayer'),card=$('nextCard');if(layer.hidden)return;const lr=layer.getBoundingClientRect(),m=8;card.style.left=`${m}px`;card.style.top=`${m}px`;const cr=card.getBoundingClientRect(),w=cr.width,h=cr.height,candidates=[{x:m,y:m},{x:lr.width-w-m,y:m},{x:m,y:lr.height-h-m},{x:lr.width-w-m,y:lr.height-h-m},{x:m,y:(lr.height-h)/2},{x:lr.width-w-m,y:(lr.height-h)/2}],busy=[...stage.querySelectorAll('.bar-handle,.point-ring,.read-handle,.quartile-line,.iqr-bracket')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0||r.height>0}).map(e=>{const r=e.getBoundingClientRect();return{left:r.left-lr.left-8,right:r.right-lr.left+8,top:r.top-lr.top-8,bottom:r.bottom-lr.top+8}});let best=candidates[0],score=Infinity;for(const c0 of candidates){const c={x:Math.max(m,Math.min(lr.width-w-m,c0.x)),y:Math.max(m,Math.min(lr.height-h-m,c0.y))},box={left:c.x,right:c.x+w,top:c.y,bottom:c.y+h};let sc=busy.reduce((n,r)=>n+overlapArea(box,r),0);if(sc<score){score=sc;best=c}}const shell=$('stageShell');card.style.left=`${best.x+shell.scrollLeft}px`;card.style.top=`${best.y+shell.scrollTop}px`}
function renderCompletion(){const c=completionContent(),layer=$('completionLayer');layer.hidden=!c;if(!c)return;$('nextCardTitle').textContent=c.title;$('nextCardText').textContent=c.text;$('nextPrimary').textContent=c.primary;$('nextSecondary').hidden=!c.secondary;$('nextSecondary').textContent=c.secondary||'';requestAnimationFrame(()=>{positionCompletion();$('nextPrimary').focus()})}
function advanceCompletion(){if(!state.guide)return;const g=state.guide;if(g.type==='classComplete'){if(g.index===sample().frequencies.length-1){state.stage='quartile';state.quartileIndex=0;initQuartile(0);state.guide=null;renderAll();return}state.classIndex++;initClass(state.classIndex);state.guide=null;renderAll();return}if(g.type==='quartileComplete'){if(g.index<2){state.quartileIndex++;initQuartile(state.quartileIndex);state.guide=null}else{state.stage='iqr';state.guide=state.workLevel===0?{type:'final'}:null}renderAll();return}if(g.type==='final'){newProblem()}}
function nextGuide(){advanceCompletion()}
function guideSecondary(){if(state.guide?.type!=='final')return;state.stage='experiment';state.guide=null;state.barDensities=targetDensities().slice();state.experimentSelected=0;state.experimentBaseMedian=targetModel().invert(totalN()/2);renderAll()}
function ownedWorkReady(i){const o=ownership(),densityReady=o.density==='drag'||Math.abs((parseNumber(state.densityInputs[i])??-999)-targetDensities()[i])<=.025,totalReady=o.total==='drag'||Math.abs((parseNumber(state.totalInputs[i])??-999)-targetCumulative()[i+1])<=.12;return densityReady&&totalReady}
function maybeCompleteClass(){const i=state.classIndex;if(state.stage!=='class'||state.guide||state.classComplete[i]||!barOK(i)||!riseOK(i)||!ownedWorkReady(i))return;state.barDensities[i]=targetDensities()[i];state.pointTotals[i+1]=targetCumulative()[i+1];if(ownership().density==='input')state.densityInputs[i]=fmt(targetDensities()[i],2);if(ownership().total==='input')state.totalInputs[i]=fmt(targetCumulative()[i+1],0);state.classComplete[i]=true;state.guide={type:'classComplete',index:i};renderAll()}
function initQuartile(i){state.rankInputs[i]='';const expected=expectedQuartile(i),b=sample().boundaries,offset=[-4.2,4.5,-5.2][i],alt=clamp(expected+offset,b[0]+.4,b[b.length-1]-.4);state.readX=Math.abs(targetModel().evalAt(alt)-qTargets()[i])>.8?alt:clamp(expected-offset,b[0]+.4,b[b.length-1]-.4)}
function maybeCompleteQuartile(){if(state.stage!=='quartile'||state.guide||!quartileRankReady())return;const i=state.quartileIndex,model=targetModel(),target=qTargets()[i];if(Math.abs(model.evalAt(state.readX)-target)>.6)return;const x=expectedQuartile(i);state.readX=x;state.quartiles[QKEYS[i]]=x;state.guide={type:'quartileComplete',index:i};renderAll()}
function maybeCompleteIqr(){if(state.stage!=='iqr'||state.guide)return;const n=parseNumber(state.iqrInput);if(n==null||Math.abs(n-iqrTarget())>.11)return;state.iqrInput=fmt(iqrTarget(),1);state.guide={type:'final'};renderAll()}
function eventPoint(e){const r=stage.getBoundingClientRect(),vb=stage.viewBox.baseVal;return{x:(e.clientX-r.left)*vb.width/r.width,y:(e.clientY-r.top)*vb.height/r.height}}
function startDrag(e){if(state.guide)return;const bar=e.target.closest('[data-bar-handle]'),pt=e.target.closest('[data-point-handle]'),read=e.target.closest('[data-read-handle]');if(bar){const i=Number(bar.dataset.barHandle);if(state.stage==='class'&&i===state.classIndex&&ownership(i).density==='input')return;state.drag={type:'bar',i};if(state.stage==='experiment')state.experimentSelected=i;e.preventDefault();renderAll();return}if(pt&&state.stage==='class'){const i=Number(pt.dataset.pointHandle);if(!barOK(i)||ownership().total==='input')return;state.drag={type:'point',i};e.preventDefault();return}if(read&&state.stage==='quartile'&&quartileRankReady()){state.drag={type:'read'};e.preventDefault()}}
function moveDrag(e){if(!state.drag)return;const p=eventPoint(e);if(state.drag.type==='bar'){const i=state.drag.i,w=widths()[i],dmax=densityMax(),raw=clamp((cfg.histBottom-p.y)/(cfg.histBottom-cfg.histTop)*dmax,0,dmax),target=sample().frequencies[i],freq=Math.abs(raw*w-target)<=.7?target:Math.round(raw*w);state.barDensities[i]=Math.max(0,freq/w)}else if(state.drag.type==='point'){const i=state.drag.i,raw=(cfg.cfBottom-p.y)/(cfg.cfBottom-cfg.cfTop)*totalN(),target=targetCumulative()[i+1],val=Math.abs(raw-target)<=1?target:Math.round(clamp(raw,0,totalN()));state.pointTotals[i+1]=val}else if(state.drag.type==='read'){const x=clamp(xValue(p.x),sample().boundaries[0],sample().boundaries.at(-1)),model=targetModel(),target=qTargets()[state.quartileIndex],expected=expectedQuartile(state.quartileIndex);state.readX=Math.abs(model.evalAt(x)-target)<=.65?expected:x}renderAll();e.preventDefault()}
function endDrag(){if(!state.drag)return;const t=state.drag.type;state.drag=null;renderAll();if(t==='bar'||t==='point')maybeCompleteClass();else if(t==='read')maybeCompleteQuartile()}
function keyboardStage(e){if(state.guide)return;const bar=e.target.closest('[data-bar-handle]'),pt=e.target.closest('[data-point-handle]'),read=e.target.closest('[data-read-handle]');if(bar&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const i=Number(bar.dataset.barHandle),dir=e.key==='ArrowUp'?1:-1;if(state.stage==='class'&&ownership(i).density==='input')return;state.barDensities[i]=Math.max(0,(Math.round(state.barDensities[i]*widths()[i])+dir)/widths()[i]);if(state.stage==='experiment')state.experimentSelected=i;renderAll();maybeCompleteClass()}else if(pt&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const i=Number(pt.dataset.pointHandle);if(!barOK(i)||ownership().total==='input')return;state.pointTotals[i+1]=clamp((state.pointTotals[i+1]??0)+(e.key==='ArrowUp'?1:-1),0,totalN());renderAll();maybeCompleteClass()}else if(read&&quartileRankReady()&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();state.readX=clamp(state.readX+(e.key==='ArrowRight' ? .2 : -.2),sample().boundaries[0],sample().boundaries.at(-1));renderAll();maybeCompleteQuartile()}}
function handleWorkInput(e){const field=e.target.dataset.field;if(!field)return;const value=e.target.value;if(field.startsWith('density-')){const i=Number(field.split('-')[1]);state.densityInputs[i]=value;const n=parseNumber(value);if(n!=null)state.barDensities[i]=clamp(n,0,densityMax())}else if(field.startsWith('total-')){const i=Number(field.split('-')[1]);state.totalInputs[i]=value;const n=parseNumber(value);if(n!=null)state.pointTotals[i+1]=clamp(n,0,totalN())}else if(field.startsWith('rank-')){const i=Number(field.split('-')[1]);state.rankInputs[i]=value}else if(field==='iqr')state.iqrInput=value;renderAll()}
function commitWorkInput(e){const field=e.target.dataset.field;if(!field)return;if(field.startsWith('density-')){const i=Number(field.split('-')[1]),n=parseNumber(state.densityInputs[i]);if(n!=null&&Math.abs(n-targetDensities()[i])<=.025){state.densityInputs[i]=fmt(targetDensities()[i],2);state.barDensities[i]=targetDensities()[i]}renderAll();maybeCompleteClass()}else if(field.startsWith('total-')){const i=Number(field.split('-')[1]),n=parseNumber(state.totalInputs[i]);if(n!=null&&Math.abs(n-targetCumulative()[i+1])<=.12){state.totalInputs[i]=fmt(targetCumulative()[i+1],0);state.pointTotals[i+1]=targetCumulative()[i+1]}renderAll();maybeCompleteClass()}else if(field.startsWith('rank-')){const i=Number(field.split('-')[1]),n=parseNumber(state.rankInputs[i]);if(n!=null&&Math.abs(n-qTargets()[i])<=.12)state.rankInputs[i]=fmt(qTargets()[i],0);renderAll()}else if(field==='iqr'){const n=parseNumber(state.iqrInput);if(n!=null&&Math.abs(n-iqrTarget())<=.11)state.iqrInput=fmt(iqrTarget(),1);renderAll();maybeCompleteIqr()}}
stage.addEventListener('pointerdown',startDrag);window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag);stage.addEventListener('keydown',keyboardStage);
$('workingPanel').addEventListener('input',handleWorkInput);$('workingPanel').addEventListener('change',commitWorkInput);$('workingPanel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.field){e.preventDefault();e.target.blur()}});
$('nextPrimary').addEventListener('click',nextGuide);$('nextSecondary').addEventListener('click',guideSecondary);$('resetCurrentBtn').addEventListener('click',resetCurrent);$('newProblemBtn').addEventListener('click',newProblem);document.querySelectorAll('[data-work-level]').forEach(button=>button.addEventListener('click',()=>{state.workLevel=clamp(Number(button.dataset.workLevel)||0,0,2);state.guide=state.stage==='iqr'&&state.workLevel===0?{type:'final'}:null;renderAll();maybeCompleteClass()}));window.addEventListener('resize',()=>{updateGuide();positionCompletion()});
window.labTest={
 getState:()=>JSON.parse(JSON.stringify({...state,sample:sample(),targetDensities:targetDensities(),targetCumulative:targetCumulative(),iqrTarget:state.quartiles.q1!=null&&state.quartiles.q3!=null?iqrTarget():null})),
 closeGuide:()=>{state.guide=null;renderAll()},
 setWorkLevel:l=>{state.workLevel=clamp(Number(l)||0,0,2);state.guide=state.stage==='iqr'&&state.workLevel===0?{type:'final'}:null;renderAll()},
 newProblem,
 completeClass:()=>{const i=state.classIndex;state.barDensities[i]=targetDensities()[i];state.pointTotals[i+1]=targetCumulative()[i+1];state.densityInputs[i]=fmt(targetDensities()[i],2);state.totalInputs[i]=fmt(targetCumulative()[i+1],0);maybeCompleteClass()},
 nextGuide,
 enterQuartiles:()=>{for(let i=0;i<sample().frequencies.length;i++){state.barDensities[i]=targetDensities()[i];state.pointTotals[i+1]=targetCumulative()[i+1];state.classComplete[i]=true}state.stage='quartile';state.classIndex=sample().frequencies.length-1;state.guide=null;state.quartileIndex=0;initQuartile(0);renderAll()},
 completeQuartile:()=>{state.readX=expectedQuartile(state.quartileIndex);maybeCompleteQuartile()},
 enterIqr:()=>{state.stage='iqr';state.guide=null;for(let i=0;i<3;i++)state.quartiles[QKEYS[i]]=expectedQuartile(i);state.iqrInput='';renderAll()},
 completeIqr:()=>{state.iqrInput=fmt(iqrTarget(),1);maybeCompleteIqr()},
 experiment:()=>{state.stage='experiment';state.guide=null;state.barDensities=targetDensities().slice();renderAll()},
 setDensity:(i,v)=>{state.barDensities[i]=Number(v);renderAll()},setTotal:(i,v)=>{state.pointTotals[i+1]=Number(v);renderAll()},render:renderAll
};
startFirstProblem();
})();
