<script>
(() => {

const BASE={distance:{report:100,step:1,unit:'m',digits:1},time:{report:12.4,step:.1,unit:'s',digits:2},threshold:8.05};

  {name:'1 · Find the range',tag:'Core',goal:()=>{const dDone=state.discover.dLow&&state.discover.dHigh,tDone=state.discover.tLow&&state.discover.tHigh;if(!dDone)return 'Find the interval of true distances hidden by the rounded 100 m display.';if(!tDone)return 'Now find the interval of true times hidden by the rounded 12.4 s display.';return 'You now know every distance and time a valid certificate must allow for.'}},

  {name:'3 · Prove the decision',tag:'Extended',goal:()=>state.proof.success?'Proof complete: the rounded readings do not guarantee 8.05 m/s.':'Prove or disprove the certificate: lower distance bound ÷ upper time bound. Is the result still at least 8.05 m/s?'},
  {name:'4 · Test better evidence',tag:'Extended',goal:()=>state.fine.success?'Proof complete: the finer readings now guarantee 8.05 m/s.':!state.fine.boundsSuccess?'Can better precision change the decision? Build the tighter distance and time intervals first.':'Repeat the same worst-case proof: lower distance bound ÷ upper time bound, then compare with 8.05 m/s.'}

function resetStep(){
  const c=cfg();state.d=c.distance.report;state.t=c.time.report;state.drag=null;state.pointerId=null;
  if(state.step===0){state.discover={dLow:false,dHigh:false,tLow:false,tHigh:false};state.complete[0]=false}
  if(state.step===1){state.upperSpeed=false;state.lowerSpeed=false;state.complete[1]=false}
  if(state.step===2){state.d=low(BASE.distance);state.t=safeHigh(BASE.time);state.observedFail=false;state.proof=blankProof();state.complete[2]=false}
  if(state.step===3){state.fine=blankFine();state.complete[3]=false}
  renderAll();
}
function selectStep(i){if(i>0&&!state.complete[i-1])return;state.step=i;const c=cfg();if(i===2){state.d=low(BASE.distance);state.t=safeHigh(BASE.time)}else{state.d=c.distance.report;state.t=c.time.report}state.drag=null;state.pointerId=null;renderAll()}
function renderSteps(){
  const host=$('steps');host.replaceChildren();
  steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className=`step${i===state.step?' active':''}${state.complete[i]?' done':''}`;b.textContent=s.name;b.disabled=i>0&&!state.complete[i-1];b.addEventListener('click',()=>selectStep(i));host.appendChild(b)});

}
function renderMission(){$('goalKicker').textContent=`Step ${state.step+1} of ${steps.length} · ${steps[state.step].tag}`;$('goalText').textContent=steps[state.step].goal();renderSteps()}

const geom={distance:{x:235,y:180,w:690},time:{x:235,y:335,w:690}};
function scanDomain(kind){return kind==='distance'?[99.2,100.8]:[12.30,12.50]}
function domain(kind){return scanDomain(kind)}
function valueToX(kind,v){const [a,b]=domain(kind),g=geom[kind];return g.x+(v-a)/(b-a)*g.w}
function xToValue(kind,x){const [a,b]=domain(kind),g=geom[kind];let v=a+clamp((x-g.x)/g.w,0,1)*(b-a);if(state.step>0)v=Math.min(v,safeHigh(cfg()[kind]));return v}
function stagePoint(evt){const s=$('stage'),p=s.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(s.getScreenCTM().inverse())}

function ticks(root,kind,y){
  const [a,b]=domain(kind),g=geom[kind],count=10;
  add(root,'rect',{x:g.x,y:y-24,width:g.w,height:48,rx:8,class:'ruler'});add(root,'line',{x1:g.x+10,x2:g.x+g.w-10,y1:y,y2:y,class:'ruler-line'});

}
function screenCard(root,kind,y){
  const c=cfg()[kind],stage0=state.step===0,val=kind==='distance'?state.d:state.t,display=stage0?roundTo(val,c.step):c.report;

  add(root,'rect',{x:34,y:y-43,width:160,height:86,rx:10,class:'screen'});add(root,'text',{x:49,y:y-20,class:'screen-label'},stage0?'Rounded display':'Recorded reading');add(root,'text',{x:49,y:y+10,class:'screen-value'},shown);
  const actual=kind==='distance'?`${fmt(state.d,2)} m`:`${fmt(state.t,3)} s`;
  if(stage0)add(root,'text',{x:49,y:y+29,class:'screen-target'},`${kind==='distance'?'target 100 m':'target 12.4 s'} · actual ${actual}`);
  else{const accuracy=kind==='distance'?(state.step===3?'nearest 0.1 m':'nearest 1 m'):(state.step===3?'nearest 0.01 s':'nearest 0.1 s');add(root,'text',{x:49,y:y+29,class:'screen-target'},`${accuracy} · actual ${actual}`)}

function car(root,x,y,draggable=true){
  const g=add(root,'g',{transform:`translate(${x} ${y})`,class:draggable?'car-drag':'','data-drag':draggable?'distance':null,tabindex:draggable?0:null,role:draggable?'slider':null,'aria-label':draggable?'Possible actual distance. Drag left or right.':null});
  add(g,'ellipse',{cx:0,cy:14,rx:35,ry:5,fill:'#1d252b',opacity:.14});add(g,'path',{d:'M-32 3L-24 -9H10L28 0L32 11H-33Z',class:'car'});add(g,'path',{d:'M-17 -6H8L20 0H-23Z',class:'car-window'});add(g,'rect',{x:-31,y:5,width:62,height:5,rx:2.5,class:'car-accent'});add(g,'circle',{cx:-20,cy:11,r:6,class:'wheel'});add(g,'circle',{cx:19,cy:11,r:6,class:'wheel'});
}
function watch(root,x,y){const g=add(root,'g',{transform:`translate(${x} ${y})`});add(g,'rect',{x:-12,y:-50,width:24,height:14,rx:4,class:'stopwatch'});add(g,'circle',{cx:0,cy:0,r:35,class:'stopwatch'});add(g,'circle',{cx:0,cy:0,r:27,class:'watch-face'});for(let i=0;i<12;i++){const a=i*Math.PI/6;add(g,'line',{x1:Math.sin(a)*20,y1:-Math.cos(a)*20,x2:Math.sin(a)*24,y2:-Math.cos(a)*24,stroke:'#96a2aa','stroke-width':1.2})}add(g,'line',{x1:0,y1:0,x2:13,y2:-17,class:'watch-hand'});add(g,'circle',{cx:0,cy:0,r:4,class:'watch-dot'})}
function discovered(kind){return kind==='distance'?(state.discover.dLow&&state.discover.dHigh):(state.discover.tLow&&state.discover.tHigh)}
function provisionalPair(kind){if(state.step!==3||state.fine.boundsSuccess)return null;const f=state.fine;return kind==='distance'?[num(f.dLow),num(f.dHigh)]:[num(f.tLow),num(f.tHigh)]}
function renderBounds(root,kind,y){
  const c=cfg()[kind],g=geom[kind],a=low(c),b=high(c),isD=kind==='distance';
  if(state.step===0){
    const lowSeen=isD?state.discover.dLow:state.discover.tLow,highSeen=isD?state.discover.dHigh:state.discover.tHigh;
    if(lowSeen){const x=valueToX(kind,a);add(root,'line',{x1:x,x2:x,y1:y-35,y2:y+35,class:'bound'});add(root,'text',{x,y:y+56,'text-anchor':'middle',class:'bound-label'},'lower bound');add(root,'text',{x,y:y+69,'text-anchor':'middle',class:'bound-value'},fmt(a,isD?1:2))}

    if(pa!==null&&pb!==null&&pb>pa&&pa>=da&&pb<=db){const x1=valueToX(kind,pa),x2=valueToX(kind,pb);add(root,'rect',{x:x1,y:y-10,width:x2-x1,height:20,rx:7,class:'provisional'});add(root,'text',{x:(x1+x2)/2,y:y-40,'text-anchor':'middle',class:'smallmono'},'your proposed interval')}
    return;
  }
  const x1=valueToX(kind,a),x2=valueToX(kind,b);add(root,'rect',{x:x1,y:y-12,width:x2-x1,height:24,rx:8,class:isD?'allowed-d':'allowed-t'});add(root,'line',{x1:x1,x2:x1,y1:y-33,y2:y+33,class:'bound'});add(root,'line',{x1:x2,x2:x2,y1:y-33,y2:y+33,class:'bound upper'});
  const fine=state.step===3,loX=fine?x1-10:x1,hiX=fine?x2+10:x2,loAnchor=fine?'end':'middle',hiAnchor=fine?'start':'middle';
  add(root,'text',{x:loX,y:y+53,'text-anchor':loAnchor,class:'bound-label'},'lower bound');add(root,'text',{x:loX,y:y+66,'text-anchor':loAnchor,class:'bound-value'},fmt(a,isD?(fine?2:1):(fine?3:2)));

}
function distanceEnabled(){return state.step===1}
function renderDistance(root){
  const g=geom.distance,x=valueToX('distance',state.d),enabled=distanceEnabled();screenCard(root,'distance',g.y);
  add(root,'text',{x:g.x,y:118,class:'kicker'},state.step===0?'SCRUB THE TRUE VALUE':state.step===3&&!state.fine.boundsSuccess?'NEW ROUNDING INTERVAL · DISTANCE':state.step===2?'WORST-CASE EVIDENCE · DISTANCE':state.step===3?'NEW WORST-CASE EVIDENCE · DISTANCE':'POSSIBLE ACTUAL DISTANCE');
  add(root,'text',{x:g.x,y:139,class:'title'},state.step===0?'Where does the display change?':state.step===3&&!state.fine.boundsSuccess?'Your bounds entered above appear on this ruler.':state.step===2?'Shortest allowed distance from the interval you found.':state.step===3?'New lower distance bound used in the proof.':'Drag the car inside the rounding interval.');

  add(root,'line',{x1:x,x2:x,y1:g.y-31,y2:g.y+24,class:'handle-line-d'});add(root,'circle',{cx:x,cy:g.y-31,r:6,class:'position-pin'});car(root,x,g.y+1,enabled);
}
function timeEnabled(){return state.step===0||state.step===1}
function renderTime(root){
  const g=geom.time,x=valueToX('time',state.t),enabled=timeEnabled();screenCard(root,'time',g.y);
  add(root,'text',{x:g.x,y:273,class:'kicker'},state.step===0?'SCRUB THE TRUE VALUE':state.step===3&&!state.fine.boundsSuccess?'NEW ROUNDING INTERVAL · TIME':state.step===2?'WORST-CASE EVIDENCE · TIME':state.step===3?'NEW WORST-CASE EVIDENCE · TIME':'POSSIBLE ACTUAL TIME');
  add(root,'text',{x:g.x,y:294,class:'title'},state.step===0?'Where does the display change?':state.step===3&&!state.fine.boundsSuccess?'Your bounds entered above appear on this ruler.':state.step===2?'Longest allowed time from the interval you found.':state.step===3?'New upper time bound used in the proof.':'Drag the actual stop time inside the rounding interval.');
  ticks(root,'time',g.y);renderBounds(root,'time',g.y);watch(root,995,g.y);

  if(enabled){
    const control=add(root,'g',{class:'time-drag-control','data-drag':'time',tabindex:0,role:'slider','aria-label':'Actual stop time. Drag left or right.'});
    add(control,'rect',{x:x-20,y:g.y-43,width:40,height:86,rx:12,class:'drag-hit','data-drag':'time'});
    add(control,'line',{x1:x,x2:x,y1:g.y-34,y2:g.y+34,class:'handle-line-t','data-drag':'time'});
    add(control,'circle',{cx:x,cy:g.y,r:12,class:'time-handle','data-drag':'time'});
  }else{

function speedDomain(){const [a,b]=speedBounds(BASE),t=BASE.threshold;let lo=a-(b-a)*.18,hi=b+(b-a)*.18;lo=Math.min(lo,t-(b-a)*.12);hi=Math.max(hi,t+(b-a)*.12);return[lo,hi]}
function speedX(v){const [a,b]=speedDomain(),x=238,w=610;return x+(v-a)/(b-a)*w}

  const c=cfg(),rep=reportSpeed(c);add(root,'rect',{x:875,y:452,width:205,height:132,rx:10,class:'certificate'});add(root,'text',{x:892,y:475,class:'cert-head'},'CLAIM · DEFINITELY ≥ 8.05 m/s');add(root,'text',{x:892,y:505,class:'cert-main'},`${fmt(rep,3)} m/s`);add(root,'text',{x:892,y:522,class:'cert-small'},'printed-value calculation');add(root,'text',{x:892,y:544,class:'cert-small'},`certify only if every possible speed ≥ ${fmt(c.threshold,2)}`);
  const finished=state.step===2?state.proof.success:state.step===3?state.fine.success:false;if(finished){const good=state.step===3;const g=add(root,'g',{transform:'translate(978 552) rotate(-8)'});add(g,'rect',{x:-83,y:-19,width:166,height:38,rx:7,class:good?'stamp-good':'stamp-bad'});add(g,'text',{x:0,y:6,'text-anchor':'middle',class:good?'stamp-text-good':'stamp-text-bad'},good?'CERTIFIED':'CANNOT CERTIFY')}else add(root,'text',{x:892,y:566,class:'cert-pending'},'PENDING · printed value alone is not proof');
}
function renderProofSelection(root){
  if(state.step!==2)return;const d=num(state.proof.distance),t=num(state.proof.time),dg=geom.distance,tg=geom.time,[dd0,dd1]=domain('distance'),[tt0,tt1]=domain('time');
  if(d!==null&&d>=dd0&&d<=dd1){const x=valueToX('distance',d);add(root,'circle',{cx:x,cy:dg.y-15,r:6,fill:'#416fa9',stroke:'#fff','stroke-width':2});add(root,'text',{x,y:dg.y-12,'text-anchor':'middle',fill:'#fff','font-size':6,'font-weight':900},'d')}
  if(t!==null&&t>=tt0&&t<=tt1){const x=valueToX('time',t);add(root,'circle',{cx:x,cy:tg.y-15,r:6,fill:'#755c9f',stroke:'#fff','stroke-width':2});add(root,'text',{x,y:tg.y-12,'text-anchor':'middle',fill:'#fff','font-size':6,'font-weight':900},'t')}
  if(d!==null&&t!==null&&t>0){const v=d/t,[a,b]=speedDomain();if(v>=a&&v<=b){const x=speedX(v),y=523;add(root,'path',{d:`M${x} ${y-15}l7 7-7 7-7-7Z`,class:'your-choice'});add(root,'text',{x,y:y-22,'text-anchor':'middle',class:'your-choice-label'},'your calculation')}}
}
function renderSpeed(root){
  if(state.step===0)return;const c=cfg(),v=speed(state.d,state.t),[vLo,vHi]=speedBounds(c),rep=reportSpeed(c),x=238,y=515,w=610;
  add(root,'rect',{x:214,y:438,width:646,height:162,rx:10,class:'speed-box'});add(root,'text',{x:238,y:462,class:'kicker'},'DERIVED RESULT · SPEED = DISTANCE ÷ TIME');
  const f=add(root,'text',{x:238,y:486,class:'formula'}),hideProofResult=state.step===2&&!state.proof.success,parts=[[`${fmt(state.d,state.step===3?2:2)} m`,'#315d8e'],[' ÷ ','#7d8991'],[`${fmt(state.t,state.step===3?3:3)} s`,'#644d88'],[' = ','#7d8991'],[hideProofResult?'? m/s':`${fmt(v,3)} m/s`,'#9d5c17']];parts.forEach(([txt,col])=>f.appendChild(svg('tspan',{fill:col},txt)));
  add(root,'rect',{x,y,width:w,height:16,rx:8,class:'speed-track'});const bandVisible=(state.step===1&&state.complete[1])||state.step===2||(state.step===3&&state.fine.boundsSuccess);if(bandVisible)add(root,'rect',{x:speedX(vLo),y,width:Math.max(3,speedX(vHi)-speedX(vLo)),height:16,rx:8,class:'speed-range'});
  if(state.step>=1){const tx=speedX(c.threshold);add(root,'line',{x1:tx,x2:tx,y1:y-22,y2:y+35,class:'speed-threshold'});add(root,'text',{x:tx,y:y-7,'text-anchor':'middle',class:'speed-caption'},'8.05 required')}
  const rx=speedX(rep);add(root,'path',{d:`M${rx} ${y-5}l7 7-7 7-7-7Z`,class:'speed-report'});add(root,'text',{x:rx,y:y+42,'text-anchor':'middle',class:'speed-caption'},'printed-value calc');add(root,'circle',{cx:speedX(v),cy:y+8,r:10,class:'speed-current'});

  if(showExtremes&&(state.lowerSpeed||state.complete[1])){const ex=speedX(vLo),fine=state.step===3,tx=fine?ex-14:ex,anchor=fine?'end':'middle',hideLower=(state.step===2&&!state.proof.success)||(state.step===3&&state.fine.boundsSuccess&&!state.fine.success);add(root,'circle',{cx:ex,cy:y+8,r:5,class:'speed-extreme'});add(root,'text',{x:tx,y:y+86,'text-anchor':anchor,class:'speed-label'},hideLower?'?':fmt(vLo,3));add(root,'text',{x:tx,y:y+99,'text-anchor':anchor,class:'speed-caption'},'lower d ÷ upper t')}
  if(state.step>=1)certificate(root);renderProofSelection(root);
}
function renderStage(){
  const root=$('stage');root.replaceChildren();const stageH=state.step===0?440:665;root.setAttribute('viewBox',`0 0 1120 ${stageH}`);add(root,'title',{id:'stageTitle'},'Rounded measurement and bounds lab');add(root,'desc',{id:'stageDesc'},'Use rounded measurement intervals to decide whether a claimed minimum speed is guaranteed.');add(root,'rect',{x:0,y:0,width:1120,height:stageH,rx:10,fill:'#fbfcfd'});
  const stagePrompt=state.step===0?'What true values can hide behind these rounded displays?':state.step===1?'Which allowed values make the derived speed largest and smallest?':state.step===2?'Evidence for your proof: slowest speed uses lower distance and upper time.':!state.fine.boundsSuccess?'Build tighter intervals from the finer rounded readings above.':'Evidence for the same proof with tighter measurement intervals.';
  add(root,'text',{x:34,y:28,class:'kicker'},'ONE TEST-TRACK RUN · CERTIFICATE CLAIM ≥ 8.05 m/s');add(root,'text',{x:34,y:50,class:'title'},stagePrompt);
  const p=add(root,'g',{});add(p,'rect',{x:902,y:20,width:178,height:28,rx:14,class:'phase-chip'});add(p,'text',{x:991,y:38,'text-anchor':'middle',class:'phase-text'},steps[state.step].name.replace(/^\d · /,''));renderDistance(root);renderTime(root);renderSpeed(root);
}

function observe(kind){
  if(state.step===0){const c=BASE[kind],v=kind==='distance'?state.d:state.t,a=low(c),b=high(c);if(v<a-1e-9)state.discover[kind==='distance'?'dLow':'tLow']=true;if(v>=b-1e-9)state.discover[kind==='distance'?'dHigh':'tHigh']=true;state.complete[0]=state.discover.dLow&&state.discover.dHigh&&state.discover.tLow&&state.discover.tHigh}
  else if(state.step===1){const c=BASE,[da,db]=[low(c.distance),high(c.distance)],[ta,tb]=[low(c.time),high(c.time)],dq=(state.d-da)/(db-da),tq=(state.t-ta)/(tb-ta);if(dq>.975&&tq<.025)state.upperSpeed=true;if(dq<.025&&tq>.975)state.lowerSpeed=true;state.complete[1]=state.upperSpeed&&state.lowerSpeed}
  else if(state.step===2){if(speed(state.d,state.t)<BASE.threshold)state.observedFail=true}
}
function setValue(kind,v){const c=cfg()[kind];if(state.step===3&&!state.fine.boundsSuccess)return;if(state.step===0){const [a,b]=scanDomain(kind);v=clamp(v,a,b)}else v=clamp(v,low(c),safeHigh(c));if(kind==='distance')state.d=v;else state.t=v;observe(kind);renderVisuals()}
function renderVisuals(){renderMission();renderStage()}
function renderAll(){renderVisuals();renderProofDock()}

function proofEquation(fields){
  const dClass=fields.bad?.includes('distance')?' bad':'',tClass=fields.bad?.includes('time')?' bad':'',sClass=fields.bad?.includes('speed')?' bad':'';
  return `<div class="equation-work"><div class="eq-label">lower speed bound =</div><label class="num-field distance${dClass}"><span>lower distance bound</span><input data-field="proof.distance" inputmode="decimal" value="${fields.distance||''}" placeholder="m"></label><div class="eq-label">÷</div><label class="num-field time${tClass}"><span>upper time bound</span><input data-field="proof.time" inputmode="decimal" value="${fields.time||''}" placeholder="s"></label><div class="eq-label">=</div><label class="num-field speed${sClass}"><span>lower speed bound</span><input data-field="proof.speed" inputmode="decimal" value="${fields.speed||''}" placeholder="m/s"></label></div>`
}
function verdictHtml(current,prefix){return `<div class="verdict-group"><button type="button" class="verdict" data-verdict="yes" data-prefix="${prefix}" aria-pressed="${current==='yes'}">Certify</button><button type="button" class="verdict" data-verdict="no" data-prefix="${prefix}" aria-pressed="${current==='no'}">Cannot certify</button></div>`}
function renderProofDock(){

  }

  const sBad=f.bad.includes('speed')?' bad':'';dock.innerHTML=`<div class="proof-head"><div><strong>Repeat the exact same worst-case proof</strong><span>The only thing that changed is measurement precision. The certificate rule is still every possible run ≥ 8.05 m/s.</span></div></div><div class="proof-body"><div class="proof-rule"><strong>Same calculation</strong><code>lower speed bound = lower distance bound ÷ upper time bound</code></div><div class="equation-work"><div class="eq-label">lower speed bound =</div><div class="locked-field"><span>lower distance bound</span><div class="locked-value distance">${fmt(low(FINE.distance),2)} m</div></div><div class="eq-label">÷</div><div class="locked-field"><span>upper time bound</span><div class="locked-value time">${fmt(high(FINE.time),3)} s</div></div><div class="eq-label">=</div><label class="num-field speed${sBad}"><span>lower speed bound</span><input data-field="fine.speed" inputmode="decimal" value="${f.speed}" placeholder="m/s"></label></div><div class="compare-rule">Final test: is the new lower speed bound ≥ 8.05 m/s?</div><div class="proof-actions"><span class="decision-label">Certificate decision</span>${verdictHtml(f.verdict,'fine')}<button type="button" class="proof-check" data-check="fine-proof">Check proof</button></div><div class="proof-message ${f.success?'good':f.checked?'bad':''}">${f.message||'Calculate the new lower speed bound, compare it with 8.05 m/s, then decide.'}</div>${f.success?'<div class="method-reveal"><code>99.95 ÷ 12.405 ≈ 8.057 m/s</code><br>The new lower speed bound is above 8.05 m/s, so every possible true run passes.</div>':''}</div>`

function setByPath(path,value){const [a,b]=path.split('.');state[a][b]=value;state[a].checked=false;if(a==='proof')state[a].bad=[];if(a==='fine'){state[a].bad=[];if(['dLow','dHigh','tLow','tHigh'].includes(b))state.fine.boundsChecked=false}renderStage()}
function checkProof(){

function checkFineBounds(){

  renderAll();
}
function checkFineProof(){
  const f=state.fine,s=num(f.speed),expected=low(FINE.distance)/high(FINE.time);f.checked=true;f.bad=[];if(!close(s,expected,.005))f.bad.push('speed');
  if(f.bad.length)f.message=`Recalculate ${fmt(low(FINE.distance),2)} ÷ ${fmt(high(FINE.time),3)}.`;
  else if(!f.verdict)f.message='Your calculation is complete. Compare it with 8.05 m/s and choose Certify or Cannot certify.';
  else if(f.verdict!=='yes')f.message='The lower speed bound is above 8.05 m/s, so every allowed run passes. This claim can be certified.';
  else{f.success=true;f.message=`${fmt(expected,3)} m/s is above 8.05 m/s: the claim is certified.`;state.complete[3]=true;state.d=low(FINE.distance);state.t=safeHigh(FINE.time)}
  renderAll();
}

const dock=$('proofDock');dock.addEventListener('input',evt=>{const path=evt.target.dataset.field;if(path)setByPath(path,evt.target.value)});dock.addEventListener('click',evt=>{const verdict=evt.target.closest?.('[data-verdict]');if(verdict){const obj=verdict.dataset.prefix==='fine'?state.fine:state.proof;obj.verdict=verdict.dataset.verdict;obj.checked=false;obj.bad=[];renderProofDock();return}const check=evt.target.closest?.('[data-check]')?.dataset.check;if(check==='proof')checkProof();if(check==='fine-bounds')checkFineBounds();if(check==='fine-proof')checkFineProof()});

const stage=$('stage');stage.addEventListener('pointerdown',evt=>{const p=stagePoint(evt),drag=evt.target.closest?.('[data-drag]'),lane=evt.target.closest?.('[data-lane]'),kind=drag?.dataset.drag||lane?.dataset.lane;if(!kind)return;state.drag=kind;state.pointerId=evt.pointerId;stage.setPointerCapture?.(evt.pointerId);evt.preventDefault();setValue(kind,xToValue(kind,p.x))});stage.addEventListener('pointermove',evt=>{if(!state.drag)return;setValue(state.drag,xToValue(state.drag,stagePoint(evt).x))});function endPointer(){if(state.pointerId!==null)try{stage.releasePointerCapture?.(state.pointerId)}catch{}state.drag=null;state.pointerId=null}stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);stage.addEventListener('keydown',evt=>{const handle=evt.target.closest?.('[data-drag]');if(handle&&(evt.key==='ArrowLeft'||evt.key==='ArrowRight')){evt.preventDefault();const kind=handle.dataset.drag,[a,b]=domain(kind),delta=(b-a)/80*(evt.key==='ArrowLeft'?-1:1);setValue(kind,(kind==='distance'?state.d:state.t)+delta)}});

window.__ROUNDED_BOUNDS_LAB__={
  getState:()=>JSON.parse(JSON.stringify({step:state.step,complete:state.complete,d:state.d,t:state.t,discover:state.discover,upperSpeed:state.upperSpeed,lowerSpeed:state.lowerSpeed,observedFail:state.observedFail,proof:state.proof,fine:state.fine,speed:speed(state.d,state.t),bounds:speedBounds(cfg())})),
  selectStep,reset:resetStep,setDistance:v=>setValue('distance',v),setTime:v=>setValue('time',v),
  proof:(d,t,s,verdict='no')=>{state.proof.distance=String(d);state.proof.time=String(t);state.proof.speed=String(s);state.proof.verdict=verdict;checkProof()},
  fineBounds:(dl,dh,tl,th)=>{Object.assign(state.fine,{dLow:String(dl),dHigh:String(dh),tLow:String(tl),tHigh:String(th)});checkFineBounds()},
  fineProof:(s,verdict='yes')=>{state.fine.speed=String(s);state.fine.verdict=verdict;checkFineProof()}
};
renderAll();
})();
