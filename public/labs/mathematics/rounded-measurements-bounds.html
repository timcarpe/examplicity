.lab-activity-bar .run-actions>button.active{background:var(--lab-accent-hover,#4569aa);border-color:var(--lab-accent-hover,#4569aa);color:#fff}
.lab-activity-bar .run-actions>button.algorithm-button{border-color:var(--lab-accent-pressed,#3a5d99);background:var(--lab-accent-hover,#4569aa);color:#fff}
.lab-activity-bar .run-actions>button.algorithm-button:hover{background:var(--lab-accent-pressed,#3a5d99)}

/* action-hierarchy */
/* Action hierarchy: blue primary, white/blue secondary, muted disabled. */
.lab-activity-bar .lab-activity-task>button,.lab-activity-bar .run-actions>button,.lab-activity-bar .activity-actions>button,.lab-activity-bar>button{min-height:40px;padding:8px 14px;border:1px solid var(--lab-accent-line,#9fb4d6);border-radius:var(--lab-control-radius,8px);background:#fff;color:var(--lab-accent-ink,#315b91);font-size:12px;font-weight:400;box-shadow:0 1px 3px rgba(29,29,31,.08)}

.lab-activity-bar #newButton,.lab-activity-bar #newProblemBtn{border-color:var(--lab-accent-pressed,#3a5d99);background:var(--lab-accent-hover,#4569aa);color:#fff}
.lab-activity-bar #newButton:hover,.lab-activity-bar #newProblemBtn:hover{background:var(--lab-accent-pressed,#3a5d99)}
.lab-activity-bar button:disabled:not([aria-pressed]):not([aria-checked]){border-color:var(--lab-line,#d2d2d7);background:var(--lab-surface-strong,#eef1f3);color:var(--lab-muted,#6e6e73);box-shadow:none;opacity:1;cursor:not-allowed}
.lab-mode-toggle{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--lab-line,#d2d2d7);border-radius:999px;background:var(--lab-surface-muted,#f7f8fa);box-shadow:0 1px 3px rgba(29,29,31,.08)}
.lab-activity-bar .lab-mode-toggle>button.algorithm-button{display:inline-flex;align-items:center;justify-content:center;min-width:80px;min-height:34px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--lab-accent-ink,#315b91);font-size:12px;font-weight:400;box-shadow:none}
.lab-activity-bar .lab-mode-toggle>button.algorithm-button[aria-pressed="true"]{background:var(--lab-accent-hover,#4569aa);color:#fff}
.lab-activity-bar .lab-mode-toggle>button:disabled{opacity:.55;cursor:not-allowed}

/* disabled-actions */
/* Disabled actions override primary colours and hover without resembling an active secondary action. */
.lab-activity-bar button:disabled:not([aria-pressed]):not([aria-checked]),
.lab-activity-bar #newButton:disabled,.lab-activity-bar #newProblemBtn:disabled,
.lab-activity-bar .lab-mode-toggle>button.algorithm-button:disabled{
  border-color:var(--lab-line,#d2d2d7);background:var(--lab-surface-strong,#eef1f3);color:var(--lab-muted,#6e6e73);box-shadow:none;opacity:1;cursor:not-allowed;transform:none;
}

/* task-heading */
/* Task headings are quiet, readable anchors above the model. */
.lab-activity-bar .lab-activity-task>strong,.lab-activity-bar .lab-activity-task h2,.lab-activity-bar .lab-activity-task h3,.lab-activity-bar .mission-copy>strong,.lab-activity-bar #goalTitle{margin:0;color:var(--lab-ink,#1d1d1f);font-family:var(--lab-font-sans,inherit);font-size:14px;font-weight:500;line-height:1.45;letter-spacing:normal;text-transform:none;text-wrap:balance}

/* flat-mathematics */
/* Compact concept-tinted backing distinguishes displayed mathematics. */
.calc-panel .term-chip,.calc-panel .worked-value,.calc-panel .flat-expression{padding:3px 7px;border:0;border-radius:4px;background:color-mix(in srgb,var(--lab-concept-violet,#7563a7) 20%,white);color:var(--lab-ink,#1d1d1f);box-shadow:none}
.calc-panel .flat-expression{width:fit-content}
.calc-panel .flat-expression .worked-value{padding:0;background:transparent}

/* working-attention */
/* Unattempted working draws attention through its border, never moving the content. */
.calc-panel .calc-step.pending:not([data-interacted="true"]),.calc-panel .work-progress:not([data-complete="true"]):not([data-interacted="true"]){animation:workingBorderPulse 2s ease-in-out infinite}
@keyframes workingBorderPulse{0%,100%{border-color:var(--lab-needed-line,#d8c36a);box-shadow:0 0 0 0 rgba(216,195,106,0)}50%{border-color:var(--lab-needed,#946200);box-shadow:0 0 0 3px rgba(216,195,106,.18)}}
@media(prefers-reduced-motion:reduce){.calc-panel .calc-step,.calc-panel .work-progress{animation:none!important}}

/* working-refinements */
#answerForm[data-work-state="current"]:not([data-attention-used="true"]){animation:workingAttention 2s ease-in-out infinite}
@keyframes workingAttention{0%,100%{border-color:var(--lab-needed-line,#d8c36a);box-shadow:none}50%{border-color:var(--lab-needed,#946200);box-shadow:0 0 0 3px rgba(216,195,106,.18)}}
@media(prefers-reduced-motion:reduce){#answerForm[data-work-state="current"]{animation:none!important}}
.decision-card.needed:not([data-attention-used="true"]){animation:workingAttention 2s ease-in-out infinite}
@keyframes workingAttention{0%,100%{border-color:var(--lab-needed-line,#d8c36a);box-shadow:none}50%{border-color:var(--lab-needed,#946200);box-shadow:0 0 0 3px rgba(216,195,106,.18)}}
@media(prefers-reduced-motion:reduce){.decision-card.needed{animation:none!important}}
#relax-equation{padding:3px 7px;border:0;border-radius:4px;background:color-mix(in srgb,var(--lab-concept-violet,#7563a7) 20%,white);box-shadow:none}
.readout-line.owned:not(.correct):not(.incorrect):not([data-attention-used="true"]),.work-progress:not([data-complete="true"]):not([data-attention-used="true"]){animation:workingAttention 2s ease-in-out infinite}
@keyframes workingAttention{0%,100%{border-color:var(--lab-needed-line,#d8c36a);box-shadow:none}50%{border-color:var(--lab-needed,#946200);box-shadow:0 0 0 3px rgba(216,195,106,.18)}}
@media(prefers-reduced-motion:reduce){.readout-line.owned:not(.correct):not(.incorrect),.work-progress:not([data-complete="true"]){animation:none!important}}
.auto-value{padding:3px 7px;border:0;border-radius:4px;background:color-mix(in srgb,var(--lab-concept-violet,#7563a7) 20%,white);box-shadow:none}
.output-card.working-required.in-progress:not([data-attention-used="true"]),.work-progress:not([data-complete="true"]):not([data-attention-used="true"]){animation:workingAttention 2s ease-in-out infinite}
@keyframes workingAttention{0%,100%{border-color:var(--lab-needed-line,#d8c36a);box-shadow:none}50%{border-color:var(--lab-needed,#946200);box-shadow:0 0 0 3px rgba(216,195,106,.18)}}
@media(prefers-reduced-motion:reduce){.output-card.working-required.in-progress,.work-progress:not([data-complete="true"]){animation:none!important}}

.working-panel .step-value{width:fit-content;padding:3px 7px;border:0;border-radius:4px;background:color-mix(in srgb,var(--lab-concept-violet,#7563a7) 20%,white);box-shadow:none}
@media(prefers-reduced-motion:reduce){.working-panel .work-step{animation:none!important}}

/* field-feedback-only */
.evidence .output-card:has(.answer-entry)::after{content:none}
.evidence .output-card:has(.answer-entry) .output-head{padding-right:0}
.calc-panel .calc-step:has(.work-entry)::after{content:none}
.calc-panel .calc-step:has(.work-entry) .step-head{padding-right:0}
.working-panel .work-step:has(input) .step-head>.step-status{display:none}

/* Public component API for new labs. */
.lab-toggle{display:inline-flex;align-items:center;gap:2px;height:42px;padding:3px;border:1px solid var(--lab-line,#d2d2d7);border-radius:999px;background:var(--lab-surface-muted,#f7f8fa);box-shadow:0 1px 3px rgba(29,29,31,.08)}
.lab-toggle>button{min-width:40px;min-height:34px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--lab-ink-secondary,#424245);font:400 12px/1.2 var(--lab-font-sans,sans-serif);box-shadow:none}
.lab-toggle>button:is([aria-pressed="true"],[aria-checked="true"]){background:var(--lab-ink-secondary,#424245);color:#fff}
.lab-toggle[data-kind="exam"]>button:is([aria-pressed="true"],[aria-checked="true"]),.lab-toggle[data-kind="mode"]>button:is([aria-pressed="true"],[aria-checked="true"]){background:var(--lab-accent-hover,#4569aa);color:#fff}
.lab-action{min-height:40px;padding:8px 14px;border:1px solid var(--lab-accent-line,#9fb4d6);border-radius:8px;background:#fff;color:var(--lab-accent-ink,#315b91);font:400 12px/1.3 var(--lab-font-sans,sans-serif);box-shadow:0 1px 3px rgba(29,29,31,.08)}
.lab-action:hover{background:var(--lab-accent-soft,#eef2fa)}

.lab-action:disabled,.lab-action[data-priority="primary"]:disabled{background:var(--lab-surface-strong,#eef1f3);color:var(--lab-muted,#6e6e73);border-color:var(--lab-line,#d2d2d7);box-shadow:none;opacity:1;cursor:not-allowed}
.lab-math-surface{display:inline-block;padding:3px 7px;border:0;border-radius:4px;background:color-mix(in srgb,var(--lab-concept-violet,#7563a7) 20%,white);color:var(--lab-ink,#1d1d1f);box-shadow:none}

/* Field focus follows the existing border's colour family, without a second outline. */
:is(input,textarea,select):focus{outline:none!important;box-shadow:none!important;border-color:var(--lab-field-focus,var(--lab-line-strong,#a7a7ad))!important}
:is(.work-entry,.answer-entry,.working-input,.calc-input,.lab-work-card input){--lab-field-focus:var(--lab-needed,#946200)}
:is(input.good,input.correct){--lab-field-focus:var(--lab-good-ink,#225f43)}
:is(input.bad,input.incorrect,[aria-invalid="true"]){--lab-field-focus:var(--lab-bad-ink,#853b34)}

 dock.innerHTML='<div class="proof-head"><strong>'+ (state.step===0?'Discover the intervals':'Explore the speed extremes')+'</strong></div><div class="proof-body">'+items.map(([label,done,result])=>`<section class="lab-work-card" data-work-state="${done?'good':'needed'}" data-interacted="${state.drag!==null}"><strong>${label}</strong><p>${done?result:'—'}</p></section>`).join('')+'<p>'+(state.step===0?'A rounded reading represents an interval. Crossing its edges changes the display.':'Greater distance and less time increase speed; reverse both to find the lower bound.')+'</p></div>';return;}
 supplyWorking();const fine=state.step===3,f=fine?state.fine:state.proof,c=cfg(),prefix=fine?'fine':'proof';
 if(fine&&!f.boundsSuccess){dock.innerHTML=`<div class="proof-head"><strong>Build the finer intervals</strong></div><div class="proof-body"><p>Distance is rounded to 0.1 m; time to 0.01 s.</p>${[['dLow','Distance lower','m'],['dHigh','Distance upper','m'],['tLow','Time lower','s'],['tHigh','Time upper','s']].map(([key,label,unit])=>workField('fine.'+key,label,f[key],unit,true,f.bad.includes(key))).join('')}<button class="lab-action" data-priority="primary" data-check="fine-bounds">Check intervals</button><p>${f.message}</p></div>`;return;}
 const predictionState=f.success?'good':f.checked&&f.verdict&&f.verdict!==(fine?'yes':'no')?'bad':'needed';
 dock.innerHTML=`<div class="proof-head"><strong>${fine?'Same proof, finer readings':'Worst-case proof'}</strong></div><div class="proof-body"><div class="proof-rule"><code>lower distance ÷ upper time</code></div><div class="equation-work">${workField('proof.distance','Lower distance',fine?fmt(low(c.distance),4):f.distance,'m',!fine&&state.workingLevel===2,f.bad.includes('distance'),f.checked&&!f.bad.includes('distance'))}<div class="eq-label">÷</div>${workField('proof.time','Upper time',fine?fmt(high(c.time),4):f.time,'s',!fine&&state.workingLevel===2,f.bad.includes('time'),f.checked&&!f.bad.includes('time'))}<div class="eq-label">=</div>${workField(prefix+'.speed','Lower speed',state.workingLevel===0?fmt(Number(f.speed),3):f.speed,'m/s',state.workingLevel>0,f.bad.includes('speed'),f.checked&&!f.bad.includes('speed'))}</div><section class="lab-work-card lab-prediction" data-work-state="${predictionState}" data-interacted="${Boolean(f.verdict)}"><strong>Does every allowed run reach 8.05 m/s?</strong><div class="lab-prediction-options" data-lab-intro="bounds-prediction" data-lab-intro-title="Test every allowed run" data-lab-intro-copy="Choose whether the lowest possible speed meets 8.05 m/s, then check your prediction.">${verdictHtml(f.verdict,prefix)}</div><button class="lab-action" data-priority="primary" data-check="${fine?'fine-proof':'proof'}" ${f.verdict?'':'disabled'}>Check prediction</button><p>${f.message}</p></section></div>`;
}

function setByPath(path,value){const [a,b]=path.split('.');state[a][b]=value;state[a].success=false;state[a].message='';state.complete[state.step]=false;renderCompletion();state[a].checked=false;if(a==='proof')state[a].bad=[];if(a==='fine'){state[a].bad=[];if(['dLow','dHigh','tLow','tHigh'].includes(b))state.fine.boundsChecked=false}renderStage()}
function checkProof(){
  const p=state.proof,d=num(p.distance),t=num(p.time),s=num(p.speed),expected=low(BASE.distance)/high(BASE.time);p.checked=true;p.bad=[];
  if(!close(d,low(BASE.distance),.006))p.bad.push('distance');if(!close(t,high(BASE.time),.0006))p.bad.push('time');if(!close(s,expected,.004))p.bad.push('speed');
  if(p.bad.includes('distance')||p.bad.includes('time'))p.message='Those inputs do not make speed as small as possible. Compare your markers with the interval endpoints.';
  else if(p.bad.includes('speed'))p.message=`Recalculate ${fmt(d,3)} ÷ ${fmt(t,3)}.`;
  else if(!p.verdict)p.message='Your calculation is complete. Now compare it with 8.05 m/s and choose Certify or Cannot certify.';
  else if(p.verdict!=='no')p.message='This lower speed bound is below 8.05 m/s, so at least one allowed run fails. The claim cannot be certified.';
  else{p.success=true;p.message=`${fmt(expected,3)} m/s is below 8.05 m/s: the claim cannot be certified.`;state.complete[2]=true;state.d=low(BASE.distance);state.t=safeHigh(BASE.time)}
  renderAll();
}
function checkFineBounds(){
  const f=state.fine,vals={dLow:num(f.dLow),dHigh:num(f.dHigh),tLow:num(f.tLow),tHigh:num(f.tHigh)},exp={dLow:low(FINE.distance),dHigh:high(FINE.distance),tLow:low(FINE.time),tHigh:high(FINE.time)};f.boundsChecked=true;f.bad=[];
  for(const k of Object.keys(vals)){const tol=k.startsWith('d')?.0006:.00006;if(!close(vals[k],exp[k],tol))f.bad.push(k)}
  if(f.bad.length)f.message='At least one limit does not match the stated rounding accuracy. The dashed interval shows what your entries imply.';
  else{f.boundsSuccess=true;f.message='Intervals fixed. Now use lower distance ÷ upper time to calculate the new slowest possible speed.';state.d=FINE.distance.report;state.t=FINE.time.report}
  renderAll();
}
function checkFineProof(){
  const f=state.fine,s=num(f.speed),expected=low(FINE.distance)/high(FINE.time);f.checked=true;f.bad=[];if(!close(s,expected,.005))f.bad.push('speed');
  if(f.bad.length)f.message=`Recalculate ${fmt(low(FINE.distance),2)} ÷ ${fmt(high(FINE.time),3)}.`;
  else if(!f.verdict)f.message='Your calculation is complete. Compare it with 8.05 m/s and choose Certify or Cannot certify.';
  else if(f.verdict!=='yes')f.message='The lower speed bound is above 8.05 m/s, so every allowed run passes. This claim can be certified.';
  else{f.success=true;f.message=`${fmt(expected,3)} m/s is above 8.05 m/s: the claim is certified.`;state.complete[3]=true;state.d=low(FINE.distance);state.t=safeHigh(FINE.time)}
  renderAll();
}

const dock=$('proofDock');dock.addEventListener('input',evt=>{const path=evt.target.dataset.field;if(path){setByPath(path,evt.target.value);const field=evt.target.closest('.num-field');field?.classList.remove('good','bad');const mark=field?.querySelector('.field-status');if(mark)mark.textContent='';const prediction=dock.querySelector('.lab-prediction');if(prediction){prediction.dataset.workState='needed';prediction.querySelector('p').textContent='';}}});dock.addEventListener('click',evt=>{const verdict=evt.target.closest?.('[data-verdict]');if(verdict){const obj=verdict.dataset.prefix==='fine'?state.fine:state.proof;obj.verdict=verdict.dataset.verdict;obj.success=false;obj.message='';state.complete[state.step]=false;renderCompletion();obj.checked=false;obj.bad=[];renderProofDock();return}const check=evt.target.closest?.('[data-check]')?.dataset.check;if(check==='proof')checkProof();if(check==='fine-bounds')checkFineBounds();if(check==='fine-proof')checkFineProof()});

const stage=$('stage');stage.addEventListener('pointerdown',evt=>{const p=stagePoint(evt),drag=evt.target.closest?.('[data-drag]'),lane=evt.target.closest?.('[data-lane]'),kind=drag?.dataset.drag||lane?.dataset.lane;if(!kind)return;state.drag=kind;state.pointerId=evt.pointerId;stage.setPointerCapture?.(evt.pointerId);evt.preventDefault();setValue(kind,xToValue(kind,p.x))});stage.addEventListener('pointermove',evt=>{if(!state.drag)return;setValue(state.drag,xToValue(state.drag,stagePoint(evt).x))});function endPointer(){if(state.pointerId!==null)try{stage.releasePointerCapture?.(state.pointerId)}catch{}state.drag=null;state.pointerId=null;renderCompletion()}stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);stage.addEventListener('keydown',evt=>{const handle=evt.target.closest?.('[data-drag]');if(handle&&(evt.key==='ArrowLeft'||evt.key==='ArrowRight')){evt.preventDefault();const kind=handle.dataset.drag,[a,b]=domain(kind),delta=(b-a)/80*(evt.key==='ArrowLeft'?-1:1);setValue(kind,(kind==='distance'?state.d:state.t)+delta);requestAnimationFrame(()=>stage.querySelector(`[data-drag="${kind}"][tabindex]`)?.focus({preventScroll:true}))}});


function renderCompletion(){
 const card=$('nextCard');card.hidden=Boolean(state.drag)||!state.complete[state.step];if(card.hidden)return;
 const content=[['Rounding intervals found','Each displayed reading represents a range of true values. Combine values from these intervals to explore the possible speeds.','Explore speeds'],['Speed extremes found','Lower distance with upper time gives the slowest run. Use that worst case to test the certificate claim.','Prove the claim'],['The claim is not guaranteed','99.5 ÷ 12.45 ≈ 7.992 m/s falls below 8.05 m/s. Can finer measurements change the decision?','Test finer readings'],['Finer readings guarantee the claim','99.95 ÷ 12.405 ≈ 8.057 m/s. The same worst-case test now meets the required speed.','Start again']][state.step];
 if(card.dataset.step===String(state.step))return;card.dataset.step=state.step;
 card.innerHTML=`<strong>${content[0]}</strong><span>${content[1]}</span><div class="next-actions"><button class="lab-action" data-priority="primary" data-continue>${content[2]}</button></div>`;
}
$('nextCard').addEventListener('click',e=>{if(!e.target.closest('[data-continue]'))return;if(state.step<3)selectStep(state.step+1);else{state.step=0;state.complete.fill(false);state.upperSpeed=false;state.lowerSpeed=false;state.proof=blankProof();state.fine=blankFine();resetStep();}});
$('reset').addEventListener('click',resetStep);
$('complexity').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(!b)return;state.workingLevel=Number(b.dataset.level);if(state.step===2){state.proof=blankProof();state.complete[2]=false;}if(state.step===3){state.fine=blankFine();state.complete[3]=false;}renderAll();});

window.__ROUNDED_BOUNDS_LAB__={
  getState:()=>JSON.parse(JSON.stringify({workingLevel:state.workingLevel,step:state.step,complete:state.complete,d:state.d,t:state.t,discover:state.discover,upperSpeed:state.upperSpeed,lowerSpeed:state.lowerSpeed,observedFail:state.observedFail,proof:state.proof,fine:state.fine,speed:speed(state.d,state.t),bounds:speedBounds(cfg())})),
  selectStep,reset:resetStep,setDistance:v=>setValue('distance',v),setTime:v=>setValue('time',v),
  proof:(d,t,s,verdict='no')=>{state.proof.distance=String(d);state.proof.time=String(t);state.proof.speed=String(s);state.proof.verdict=verdict;checkProof()},
  fineBounds:(dl,dh,tl,th)=>{Object.assign(state.fine,{dLow:String(dl),dHigh:String(dh),tLow:String(tl),tHigh:String(th)});checkFineBounds()},
  fineProof:(s,verdict='yes')=>{state.fine.speed=String(s);state.fine.verdict=verdict;checkFineProof()}
};
renderAll();
})();
</script>
