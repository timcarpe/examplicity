<!-- LAB_FRAME_STYLES_START -->
<style data-lab-frame>
:root {
  --lab-canvas: #f3f5f7;
  --lab-paper: #fbfbfd;
  --lab-surface: #ffffff;
  --lab-control: #ffffff;
  --lab-ink: #1d1d1f;
  --lab-muted: #6e6e73;
  --lab-line: #d2d2d7;
  --lab-line-strong: #a7a7ad;
  --lab-accent: #5277b8;
  --lab-accent-soft: #eef2fa;
  --lab-good: #18794e;
  --lab-good-soft: #edf8f1;
  --lab-warn: #946200;
  --lab-warn-soft: #fff6e7;
  --lab-bad: #b42318;
  --lab-bad-soft: #fff0ee;
  --lab-focus: #1d1d1f;
  --lab-focus-soft: rgba(29, 29, 31, 0.18);
  --lab-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --lab-panel-radius: 12px;
  --lab-control-radius: 8px;
  --lab-pill-radius: 999px;
  --lab-control-height: 35px;
  --lab-panel-shadow: 0 1px 2px rgba(29, 29, 31, 0.04);
  --lab-header-max-width: 1200px;
  --lab-header-gutter: max(28px, calc((100vw - var(--lab-header-max-width)) / 2));
  --lab-page-gutter: var(--lab-header-gutter);
  --lab-compact-workspace-max: 820px;

  /* Readability and learner-state roles for the design update. */
  --lab-ink-secondary: #424245;
  --lab-surface-muted: #f7f8fa;
  --lab-line-subtle: #e7e8eb;
  --lab-accent-hover: #4569aa;
  --lab-accent-pressed: #3a5d99;
  --lab-accent-surface: #f8fbff;
  --lab-accent-line: #9fb4d6;
  --lab-accent-ink: #315b91;
  --lab-on-accent: #ffffff;
  --lab-needed: #946200;
  --lab-needed-ink: #735100;
  --lab-needed-line: #d8c36a;
  --lab-needed-soft: #fff9db;
  --lab-needed-surface: #fffdf4;
  --lab-good-ink: #225f43;
  --lab-good-line: #9cc7aa;
  --lab-good-surface: #f7fcf8;
  --lab-bad-ink: #8f2f27;
  --lab-bad-line: #d99b93;
  --lab-bad-surface: #fff8f7;
  --lab-type-body: 14px;
  --lab-type-label: 12px;
  --lab-type-annotation: 11px;
  --lab-leading-body: 1.5;
  --lab-action-height: 40px;
  --lab-target-min: 44px;
  --lab-concept-rose: #b85f52;
  --lab-concept-rose-soft: #fff1ef;
  --lab-concept-rose-ink: #8f4439;
  --lab-concept-slate-ink: #34454f;
  --lab-concept-violet: #7563a7;
  --lab-concept-amber: #c9782c;
  --lab-concept-amber-soft: #fff2e6;
  --lab-concept-amber-line: #e0b383;
  --lab-concept-amber-ink: #95571f;
  --lab-drag-halo: drop-shadow(0 0 5px rgba(82, 119, 184, 0.90)) drop-shadow(0 0 10px rgba(82, 119, 184, 0.35));
  --lab-cue-surface: rgba(250, 252, 255, 0.98);
  --lab-cue-copy: #5f7184;
  --lab-shadow-cue: 0 10px 24px rgba(29, 29, 31, 0.16);
  --lab-shadow-phase: 0 12px 30px rgba(29, 29, 31, 0.16);
  --lab-phase-good-surface: rgba(247, 252, 248, 0.99);
}

html,
body {
  background: var(--lab-canvas);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  align-content: start !important;
  font-family: var(--lab-font-sans);
  margin: 0;
  padding-bottom: 0;
  padding-top: 0 !important;
  text-rendering: optimizeLegibility;
}

.lab-manifest-header {
  align-items: start;
  border-bottom: 0 !important;
  display: grid;
  gap: 18px 28px;
  grid-template-columns: minmax(0, 1fr) auto;
  margin-left: calc(50% - 50vw + var(--lab-header-gutter));
  margin-bottom: 26px;
  max-width: var(--lab-header-max-width);
  padding-bottom: 22px;
  width: calc(100vw - var(--lab-header-gutter) - var(--lab-header-gutter));
}

.lab-manifest-heading {
  min-width: 0;
}

.lab-manifest-header h1 {
  color: var(--ink, var(--lab-ink));
  font-family: var(--lab-font-sans);
  font-size: clamp(25px, 3.2vw, 40px);
  font-weight: 650;
  letter-spacing: -0.045em;
  line-height: 1.02;
  margin: 0;
  max-width: 24ch;
  padding: 0;
  text-align: left;
}

.lab-manifest-subtitle {
  color: var(--muted, var(--lab-muted));
  font-family: var(--lab-font-sans);
  font-size: 13px;
  letter-spacing: 0;
  line-height: 1.5;
  margin: 10px 0 0;
  max-width: 72ch;
  padding: 0;
  text-align: left;
}

.lab-authored-title-slot {
  min-width: 0;
}

.lab-syllabus-chips {
  align-items: center;
  display: flex !important;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
  margin: 0 0 0 auto;
  max-width: 100%;
}

.lab-syllabus-chip {
  align-items: center;
  background: var(--syllabus-chip-bg) !important;
  border: 1px solid var(--syllabus-chip-border) !important;
  border-radius: var(--lab-pill-radius);
  color: var(--syllabus-chip-text) !important;
  display: inline-flex;
  font-size: 11px;
  font-weight: 650;
  gap: 4px;
  line-height: 1;
  min-height: 29px;
  padding: 8px 10px;
  position: relative;
  transition: background-color 140ms ease, border-color 140ms ease;
  white-space: nowrap;
}

.lab-syllabus-chip:hover {
  background: var(--syllabus-chip-hover) !important;
}

.lab-syllabus-primary-link {
  border-radius: inherit;
  inset: 0;
  position: absolute;
  z-index: 0;
}

.lab-syllabus-primary-link:focus-visible {
  outline: 2px solid var(--syllabus-chip-text);
  outline-offset: 2px;
}

.lab-syllabus-name,
.lab-syllabus-divider,
.lab-syllabus-sections {
  pointer-events: none;
  position: relative;
  z-index: 1;
}

.lab-syllabus-section {
  border-radius: 4px;
  color: inherit;
  padding: 2px;
  text-decoration: none;
}

a.lab-syllabus-section {
  pointer-events: auto;
}

a.lab-syllabus-section:hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

a.lab-syllabus-section:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 1px;
}

.lab-syllabus-name {
  color: var(--syllabus-chip-text) !important;
}

.lab-syllabus-divider,
.lab-syllabus-separator {
  color: var(--muted, var(--lab-muted));
}

.lab-syllabus-prefix {
  opacity: 0.72;
  padding-left: 5px;
}

.lab-syllabus-sections {
  align-items: center;
  display: inline-flex;
}

.lab-syllabus-separator {
  margin-inline: 0 2px;
}

html[data-theme="dark"] .lab-syllabus-name {
  color: var(--syllabus-chip-border) !important;
}

html[data-theme="dark"] .lab-syllabus-chip:hover {
  background: rgba(255, 255, 255, 0.08);
}

html[data-theme="dark"],
html[data-theme="dark"] body {
  background: var(--bg);
}

body > main {
  container-name: lab-canvas;
  container-type: inline-size;
  margin-left: var(--lab-page-gutter);
  margin-right: auto;
  margin-top: 18px;
  max-width: var(--lab-header-max-width);
  width: calc(100vw - var(--lab-page-gutter) - var(--lab-page-gutter));
}

body[data-lab-layout="compact"] .lab-manifest-header {
  margin-bottom: 17px;
  padding-bottom: 13px;
}

body[data-lab-layout="compact"] [data-lab-workspace] {
  margin-left: auto;
  margin-right: auto;
  width: min(var(--lab-compact-workspace-max), 100%);
}

:where(button, input, select, textarea, summary):focus-visible {
  outline: 3px solid var(--lab-focus);
  outline-offset: 4px;
}

/* Site feedback treatment also wins when a lab loads Kit CSS after the frame. */
:root .lab-kit-status {
  background: var(--lab-surface-muted);
  border: 1px solid var(--lab-line);
  border-radius: var(--lab-control-radius);
  color: var(--lab-ink-secondary);
  font-size: var(--lab-type-body);
  line-height: var(--lab-leading-body);
}

:root .lab-kit-status[data-state="warn"] {
  background: var(--lab-needed-soft);
  border-color: var(--lab-needed-line);
  color: var(--lab-needed-ink);
}

:root .lab-kit-status[data-state="good"] {
  background: var(--lab-good-soft);
  border-color: var(--lab-good-line);
  color: var(--lab-good-ink);
}

:root .lab-kit-status[data-state="bad"] {
  background: var(--lab-bad-soft);
  border-color: var(--lab-bad-line);
  color: var(--lab-bad-ink);
}

@media (max-width: 620px) {
  :root {
    --lab-header-gutter: 18px;
    --lab-page-gutter: 18px;
  }

  body {
    padding-bottom: 0;
    padding-top: 0 !important;
  }

  .lab-manifest-header {
    gap: 14px;
    grid-template-columns: minmax(0, 1fr) !important;
    margin-left: 0;
    margin-bottom: 20px;
    padding-bottom: 18px;
    width: 100%;
  }

  body[data-lab-layout="compact"] .lab-manifest-header {
    margin-bottom: 16px;
    padding-bottom: 14px;
  }

  .lab-manifest-header h1 {
    font-size: clamp(24px, 8vw, 34px);
  }

  .lab-syllabus-chips {
    gap: 4px;
    justify-content: flex-start !important;
    margin: 0 !important;
  }

  .lab-syllabus-chip {
    font-size: 10px;
    max-width: 100%;
    min-height: 27px;
    padding: 7px 8px;
    white-space: normal;
  }

  .lab-syllabus-sections {
    flex-wrap: wrap;
  }

  body > main {
    margin-top: 8px;
    width: calc(100% - var(--lab-page-gutter) - var(--lab-page-gutter));
  }
}

/* Opt-in working and learning-sequence controls; lab logic owns their state. */
.lab-working-toggle {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--lab-line-subtle);
  border-radius: var(--lab-control-radius);
  background: var(--lab-surface-muted);
}
.lab-working-toggle button {
  min-width: 40px;
  min-height: 34px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--lab-ink-secondary);
  font-size: var(--lab-type-label);
  font-weight: 400;
  box-shadow: none;
}
.lab-working-toggle button:hover { background: var(--lab-line-subtle); }
.lab-working-toggle button[aria-pressed="true"] {
  border-color: var(--lab-line);
  background: var(--lab-surface);
  color: var(--lab-ink);
  box-shadow: var(--lab-panel-shadow);
}
.lab-stage-progress { position: relative; display: flex; flex-shrink: 0; }
.lab-stage-progress .stage-marker {
  display: grid;
  place-items: center;
  width: 24px;
  min-height: 40px;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  box-shadow: none;
}
.lab-stage-progress .stage-marker > span {
  display: grid;
  place-items: center;
  width: 12px;
  height: 12px;
  border: 1px solid var(--lab-line-strong);
  border-radius: 50%;
  color: var(--lab-good-ink);
  font-size: 11px;
  line-height: 1;
}
.lab-stage-progress .stage-marker[aria-current="step"] > span {
  border-color: var(--lab-accent);
  background: var(--lab-accent);
  box-shadow: inset 0 0 0 3px var(--lab-surface);
}
.lab-stage-progress .stage-marker.is-complete > span {
  border-color: var(--lab-good-line);
  background: var(--lab-good-soft);
  box-shadow: none;
}
.lab-stage-progress .stage-detail {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 20;
  display: none;
  width: min(300px, calc(100vw - 84px));
  padding: 16px;
  border: 1px solid var(--lab-line);
  border-radius: var(--lab-control-radius);
  background: var(--lab-surface);
  box-shadow: var(--lab-shadow-cue);
  color: var(--lab-ink);
  font-size: var(--lab-type-body);
  line-height: var(--lab-leading-body);
  text-align: left;
}
.lab-stage-progress .stage-detail strong { display: block; font-size: var(--lab-type-body); font-weight: 600; }
.lab-stage-progress .stage-detail p { margin: 6px 0 0; color: var(--lab-ink-secondary); font-size: inherit; }
.lab-stage-progress .stage-detail .stage-work { margin-top: 12px; white-space: pre-line; overflow-wrap: anywhere; }
.lab-stage-progress .stage-detail .stage-work:empty { display: none; }
.lab-stage-progress .stage-item:not(.is-dismissed):is(:hover, :focus-within, .is-open) .stage-detail { display: block; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}
</style>

<script data-lab-design-runtime>
/* Shared model dragging: retain the point grabbed while the model rerenders. */
window.LabDesign = {
  checkpoints(host, labels, current, completed = index => index < current, detail = '') {
    host.classList.add('lab-checkpoints'); host.removeAttribute('aria-hidden');
    host.replaceChildren(...labels.map((label, index) => {
      const dot = document.createElement('span'); dot.className = 'lab-checkpoint'; dot.tabIndex = 0;

      const status = completed(index) ? 'Completed' : index === current ? 'In progress' : 'Upcoming';

      const tooltip = document.createElement('span'); tooltip.className = 'lab-checkpoint-detail'; tooltip.setAttribute('role', 'tooltip');
      const title = document.createElement('strong'); title.textContent = label;
      const copy = document.createElement('span'); copy.textContent = status + (index === current && detail ? '. ' + detail : '');
      tooltip.append(title, copy); dot.append(tooltip); return dot;
    }));
  },
  digitalReadout(root, value, { x, y, label }) {
    const ns = 'http://www.w3.org/2000/svg';
    const append = (parent, tag, attributes) => {
      const node = document.createElementNS(ns, tag);
      Object.entries(attributes).forEach(([key, val]) => node.setAttribute(key, val));
      parent.appendChild(node); return node;
    };
    const group = append(root, 'g', { class: 'lab-digital-readout', transform: `translate(${x} ${y})`, role: 'img', 'aria-label': label });
    const segments = [[3,0,14,3],[17,3,3,12],[17,19,3,12],[3,31,14,3],[0,19,3,12],[0,3,3,12],[3,15,14,3]];
    const digits = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
    let offset = 0;
    for (const digit of String(value)) {
      if (digit === '.') {
        append(group, 'circle', { cx: offset + 2, cy: 32, r: 2, class: 'lab-digital-segment is-on' }); offset += 8; continue;
      }
      segments.forEach(([sx, sy, width, height], index) => append(group, 'rect', {
        x: offset + sx, y: sy, width, height, rx: 1,
        class: `lab-digital-segment${digits[Number(digit)].includes('abcdefg'[index]) ? ' is-on' : ''}`,
      }));
      offset += 26;
    }
    return group;
  },
  // State-owned attention: call after rendering each required step; [] clears it.
  attention(scope, targets) {
    const active = new Set(targets.filter(target => target && !target.disabled && target.getClientRects().length));
    scope.querySelectorAll('.lab-sequence-target').forEach(target => {
      if (!active.has(target)) target.classList.remove('lab-sequence-target');
    });
    active.forEach(target => target.classList.add('lab-sequence-target'));
  },
  introduce(scope, targets, key, title, copy) {
    scope.querySelectorAll('[data-lab-intro]').forEach(target => {
      delete target.dataset.labIntro; delete target.dataset.labIntroTitle; delete target.dataset.labIntroCopy;
    });
    targets.filter(Boolean).forEach(target => {
      target.dataset.labIntro = key; target.dataset.labIntroTitle = title; target.dataset.labIntroCopy = copy;
    });
    document.dispatchEvent(new Event('lab-introduction-change'));
  },
  svgPoint(stage, event) {
    const point = stage.createSVGPoint(); point.x = event.clientX; point.y = event.clientY;
    return point.matrixTransform(stage.getScreenCTM().inverse());
  },
  bindSvgDrag(stage, { start, move, end }) {
    let active = null;
    stage.addEventListener('pointerdown', event => {
      if (active || !event.isPrimary || event.button !== 0) return;
      const point = LabDesign.svgPoint(stage, event), grip = start(event, point);

      if (!active || active.id !== event.pointerId) return;
      const point = LabDesign.svgPoint(stage, event);
      move({ x: point.x - active.x, y: point.y - active.y }, event); event.preventDefault();
    });

      if (!active || active.id !== event.pointerId) return;
      active = null; stage.classList.remove('lab-is-dragging');
      if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
      end(event);
    };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => stage.addEventListener(type, finish));
  }

function renderMission(){const p=current(),level=state.workingLevel;$('problemKicker').textContent=p.type==='extrude'?'Extrusion':'Reshape';$('complexityHelp').textContent=['Off · calculations revealed','Some · key result','All · full chain'][level];document.querySelectorAll('[data-work-level]').forEach(b=>{const active=Number(b.dataset.workLevel)===level;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});if(p.type==='extrude'){$('missionTitle').textContent=`Build a ${fmt(p.targetV,0)} cm³ case from a ${fmt(p.w)} cm × ${fmt(p.h)} cm cross-section without using more than ${fmt(p.budgetSA,0)} cm² of material.`;if(level===0)$('missionHint').textContent='Drag the length. Watch the green calculation chain show which terms change and which stay fixed.';else if(level===1)$('missionHint').textContent='Complete the yellow L box so your calculation controls the extrusion; the later worked steps will update from it.';else $('missionHint').textContent='Complete the yellow boxes left to right. Correct cross-section results unlock length, side strip and surface-area working.';$('solidHeadNote').textContent=level===0?'length is learner-controlled':'length is controlled by the calculation'}else{$('missionTitle').textContent=`Keep the ${fmt(p.targetV,0)} cm³ capacity fixed while reshaping the rectangular cross-section to use no more than ${fmt(p.budgetSA,0)} cm² of material.`;if(level===0)$('missionHint').textContent='Drag the width. Height compensates automatically; use the green working to compare A, P, V, side strip and total surface.';else if(level===1)$('missionHint').textContent='Choose a shape, then complete its yellow surface-area box. Change the shape again to test the relationship.';else $('missionHint').textContent='Choose a shape, then complete the yellow chain. Change shape again: correct A and V should stay valid while P, side strip and SA need updating.';$('solidHeadNote').textContent='A and L are invariant; perimeter changes'}}
function renderNextCard(){const card=$('nextCard');if(!state.solved){card.hidden=true;card.classList.remove('has-upgrade');return}card.hidden=false;const s=state.solvedSnapshot,p=current();$('nextCardText').textContent=p.type==='extrude'?`The same length gives ${fmt(s.V,0)} cm³ inside and ${fmt(s.SA,0)} cm² outside.`:`A and L stayed fixed, so V stayed ${fmt(s.V,0)} cm³ while lower P reduced the surface to ${fmt(s.SA,1)} cm².`;const next=suggestedWorkLevel(),up=$('nextUpgrade');card.classList.toggle('has-upgrade',next>0);up.hidden=next<0;if(next===1){$('nextUpgradeTitle').textContent='Ready to write some working?';$('nextUpgradeText').textContent=p.type==='extrude'?'Next problems will hand you the length calculation.':'Next problems will hand you the final surface-area calculation.';$('upgradeWorking').textContent='Try some working'}else if(next===2){$('nextUpgradeTitle').textContent='Ready to write the full chain?';$('nextUpgradeText').textContent='Rectangle quantities and prism calculations become yours in sequence.';$('upgradeWorking').textContent='Try all working'}if(next>=0)$('upgradeWorking').dataset.level=String(next);document.dispatchEvent(new Event('lab-introduction-change'))}
function introduceInteraction(){const fields=[...$('workingDock').querySelectorAll('input:not(:disabled)')],target=current().type==='reshape'?$('widthHandle'):state.workingLevel===0?$('lengthHandle'):null;LabDesign.introduce(document.querySelector('main'),target?[target]:fields,'solids-'+current().type+'-'+state.workingLevel,target?'Change the solid':'Calculate the solid dimensions',target?(current().type==='reshape'?'Drag the width: height compensates to keep volume fixed. Compare the laid-flat material.':'Change the length to at least two different positions. Compare capacity with the side strip and end caps.'):'Complete the highlighted calculation. The length result controls the same extrusion and its material use.');}
function renderAll(){refreshWorkingState();markSolved();renderMission();renderSolid();renderSkin();renderBands();renderEvidence();renderWorking();renderNextCard();renderStartGuide();introduceInteraction()}
function invalidateAfterGeometry(kind){state.checked=false;state.bad=[];state.workingOK=false;state.workMessage='';if(current().type==='reshape'){if(state.workingLevel===1)state.answers.SA='';if(state.workingLevel===2){state.answers.P='';state.answers.side='';state.answers.SA='';/* A and V remain valid because A and L are invariant. */}}else if(kind==='length'&&state.workingLevel===2){state.answers.side='';state.answers.SA=''}}
function setLength(v,source='direct',doRender=true){if(current().type!=='extrude')return;const before=state.L;let next=snap(v,.1);if(source==='drag'||source==='key')next=snapInteractionValue(next,'length');state.L=clamp(next,4,22);if(Math.abs(state.L-before)<.001)return;if(source==='drag'||source==='key')state.moves++;if(source!=='entry')invalidateAfterGeometry('length');else{state.checked=false;state.bad=[];state.workingOK=false;state.workMessage='';if(state.workingLevel===2){state.answers.side='';state.answers.SA=''}}if(doRender)renderAll()}
function setWidth(v,source='direct'){const p=current();if(p.type!=='reshape')return;const oldW=state.w,before=metrics();let next=snap(v,.1);if(source==='drag'||source==='key')next=snapInteractionValue(next,'width');state.w=clamp(next,p.minW,p.maxW);state.h=p.A/state.w;if(Math.abs(state.w-oldW)<.00001)return;const after=metrics();if(source==='drag'||source==='key')state.moves++;state.lastChange={beforeP:before.P,beforeSA:before.SA,afterP:after.P,afterSA:after.SA};invalidateAfterGeometry('shape');if(state.workingLevel===2&&state.answers.V&&close(valueOf('V'),p.targetV,.11))state.workMessage='Volume working remains valid because A and L did not change. Recalculate P and SA for the new shape.';renderAll()}
function startPointer(e){if(e.target.id==='lengthHandle'||e.target.id==='lengthHandleHit'){if(current().type!=='extrude'||state.workingLevel>0)return;dismissStartGuide();e.preventDefault();state.lengthDrag={id:e.pointerId};e.target.setPointerCapture?.(e.pointerId);return}if(e.target.id==='widthHandle'||e.target.id==='widthHandleHit'){if(current().type!=='reshape')return;dismissStartGuide();e.preventDefault();state.widthDrag={id:e.pointerId};e.target.setPointerCapture?.(e.pointerId)}}
function movePointer(e){const solid=$('solidSvg');if(state.lengthDrag?.id===e.pointerId){e.preventDefault();const p=svgPoint(solid,e),geo=solidGeometry(),vx=8,vy=-3.2,mag=Math.hypot(vx,vy),ux=vx/mag,uy=vy/mag,dx=p.x-geo.frontC[0],dy=p.y-geo.frontC[1],proj=(dx*ux+dy*uy)/mag;setLength(proj,'drag')}else if(state.widthDrag?.id===e.pointerId){e.preventDefault();const p=svgPoint(solid,e),geo=solidGeometry(),w=2*(p.x-geo.cx)/geo.scale;setWidth(w,'drag')}}
function endPointer(e){if(state.lengthDrag?.id===e.pointerId)state.lengthDrag=null;if(state.widthDrag?.id===e.pointerId)state.widthDrag=null}
function advanceProblem(level=state.workingLevel){state.workingLevel=clamp(Number(level)||0,0,2);state.problemNumber++;startProblem()}
let activeSolidHandle=null;
LabDesign.bindSvgDrag($('solidSvg'),{
 start(event){const id=event.target.id,geo=solidGeometry();
  if((id==='lengthHandle'||id==='lengthHandleHit')&&current().type==='extrude'&&state.workingLevel===0){activeSolidHandle='length';dismissStartGuide();return{x:geo.backC[0],y:geo.backC[1]};}
  if((id==='widthHandle'||id==='widthHandleHit')&&current().type==='reshape'){activeSolidHandle='width';dismissStartGuide();return{x:geo.f[1][0],y:geo.cy};}
  return null;
 },
 move(point){const geo=solidGeometry();if(activeSolidHandle==='length'){const dx=point.x-geo.cx,dy=point.y-geo.cy;setLength((dx*8+dy*-3.2)/(8*8+3.2*3.2),'drag');}else if(activeSolidHandle==='width')setWidth(2*(point.x-geo.cx)/geo.scale,'drag');},
 end(){activeSolidHandle=null;}
});
$('solidSvg').addEventListener('keydown',e=>{if(e.target.id==='lengthHandle'&&state.workingLevel===0&&(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowDown')){dismissStartGuide();e.preventDefault();setLength(state.L+((e.key==='ArrowRight'||e.key==='ArrowUp')?.2:-.2),'key');requestAnimationFrame(()=>$('lengthHandle')?.focus())}if(e.target.id==='widthHandle'&&(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowDown')){dismissStartGuide();e.preventDefault();setWidth(state.w+((e.key==='ArrowRight'||e.key==='ArrowUp')?.2:-.2),'key');requestAnimationFrame(()=>$('widthHandle')?.focus())}});
$('workingDock').addEventListener('input',e=>{const key=e.target.dataset.answer;if(!key)return;dismissStartGuide();const caret=e.target.selectionStart??e.target.value.length;state.answers[key]=e.target.value;state.workMessage='';if(key==='L'&&current().type==='extrude'){const n=Number(e.target.value);if(Number.isFinite(n)&&e.target.value.trim()!=='')setLength(n,'entry',false)}renderAll();const fresh=document.querySelector(`[data-answer="${key}"]`);if(fresh&&!fresh.disabled){fresh.focus({preventScroll:true});const at=Math.min(caret,fresh.value.length);fresh.setSelectionRange(at,at)}});
$('resetProblem').addEventListener('click',()=>freshProblem(current()));document.querySelectorAll('[data-work-level]').forEach(button=>button.addEventListener('click',()=>{state.workingLevel=clamp(Number(button.dataset.workLevel)||0,0,2);freshProblem(current())}));$('nextProblem').addEventListener('click',()=>advanceProblem(state.workingLevel));$('upgradeWorking').addEventListener('click',()=>advanceProblem(Number($('upgradeWorking').dataset.level)));window.addEventListener('resize',()=>requestAnimationFrame(()=>{renderStartGuide();positionInteractionGuide()}));
startProblem();
window.__surfaceVolumeLab={
 getState:()=>({problemNumber:state.problemNumber,workingLevel:state.workingLevel,solvedAtLevel:[...state.solvedAtLevel],problem:{...current()},w:state.w,h:state.h,L:state.L,moves:state.moves,answers:{...state.answers},checked:state.checked,bad:[...state.bad],workingOK:state.workingOK,solved:state.solved,metrics:metrics(),visualSuccess:visualSuccess(),suggested:suggestedWorkLevel(),startGuideOpen:state.startGuideOpen,guideSeen:{...guideSeen},guideHidden:$('interactionGuide')?.hidden??true,reshapeSuccessInterval:reshapeSuccessInterval()}),
 metrics,makeProblem,
 setProblem:(seed=1,type='extrude',level=state.workingLevel)=>{state.problemNumber=1;state.workingLevel=clamp(Number(level)||0,0,2);state.solvedAtLevel=[0,0,0];freshProblem(makeProblem(seed,type))},
 setWorkingLevel:level=>{state.workingLevel=clamp(Number(level)||0,0,2);freshProblem(current())},
 setLength:v=>setLength(Number(v),'direct'),setWidth:v=>setWidth(Number(v),'direct'),dismissGuide:dismissStartGuide,
 simulateLengthMoves:values=>values.forEach(v=>setLength(Number(v),'drag')),simulateShapeMoves:values=>values.forEach(v=>setWidth(Number(v),'drag')),
 answer:(key,value)=>{state.answers[key]=String(value);if(key==='L'&&current().type==='extrude')setLength(Number(value),'entry');else renderAll()},check:()=>{renderAll();return state.workingOK},
 next:(level=state.workingLevel)=>advanceProblem(level),renderAll
};
})();
