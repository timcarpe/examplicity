.proof-actions{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.decision-label{color:var(--lab-muted);font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.verdict-group{display:flex;gap:5px}.verdict{min-height:32px;font-size:9px;font-weight:850}.verdict[aria-pressed="true"]{border-color:var(--lab-accent);background:var(--lab-accent);color:#fff}.proof-check{margin-left:auto;min-width:110px;background:var(--lab-accent);border-color:var(--lab-accent);color:#fff;font-size:9px;font-weight:850}.proof-message{min-height:18px;margin-top:6px;color:var(--lab-muted);font-size:9px;line-height:1.35}.proof-message.good{color:var(--lab-good);font-weight:750}.proof-message.bad{color:var(--lab-bad)}.method-reveal{margin-top:7px;padding:6px 8px;border:1px solid #acd3ba;border-radius:7px;background:var(--lab-good-soft);color:#356149;font-size:9px;line-height:1.4}.method-reveal code{font:850 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.locked-field{display:grid;gap:3px;min-width:0}.locked-field span{color:var(--lab-muted);font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.locked-value{height:36px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--lab-line);border-radius:7px;background:#fff;font:850 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.locked-value.distance{border-color:#a9c3dd;background:var(--distance-soft);color:#315d8e}.locked-value.time{border-color:#c5b6d9;background:var(--time-soft);color:#644d88}
.your-choice{fill:#fff;stroke:#4f5f69;stroke-width:2}.your-choice-label{font-size:7px;font-weight:900;fill:#52606a;text-transform:uppercase}.provisional{fill:rgba(82,119,184,.05);stroke:#8091a0;stroke-width:1.4;stroke-dasharray:5 4}.provisional-line{stroke:#8091a0;stroke-width:1.5;stroke-dasharray:4 4}
@media(max-width:760px){.rounding-rule{grid-template-columns:1fr}.equation-work{grid-template-columns:1fr auto 1fr;align-items:end}.equation-work .eq-label:first-child{grid-column:1/-1}.equation-work .num-field.speed{grid-column:1/-1;max-width:180px}.proof-check{margin-left:0}.bound-entry-grid{grid-template-columns:1fr}}
@media(max-width:480px){.equation-work{grid-template-columns:1fr}.equation-work .eq-label{display:none}.equation-work .num-field.speed{grid-column:auto;max-width:none}.proof-actions{align-items:stretch}.verdict-group{width:100%}.verdict{flex:1}.proof-check{width:100%}.bound-pair .pair-fields{grid-template-columns:1fr}}

@media(max-width:760px){.mission{grid-template-columns:1fr}.mission-tools{justify-content:flex-start;flex-wrap:wrap}}
@media(max-width:620px){body{padding:60px 0 76px}main{width:min(100% - 12px,1120px);margin-top:8px}h1{font-size:24px}.sub{font-size:12px}.lab{padding:5px}.stage{min-width:790px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>

</head>
<body data-lab-layout="standard" class="lab-adopt-v3">
<main>
<!-- LAB_MANIFEST_HEADER_START -->
<header class="lab-manifest-header">
  <div class="lab-manifest-heading">
    <h1 data-lab-manifest="title">Rounded Measurements and Bounds</h1>
  <p class="lab-manifest-subtitle" data-lab-manifest="subtitle">Build the possible measurement intervals, then test the claim with the slowest possible speed.</p>
  </div>
  <!-- LAB_SYLLABUS_CHIPS_START -->
<nav class="lab-syllabus-chips" aria-label="Syllabus alignment">
  <section class="lab-syllabus-chip" style="--syllabus-chip-bg:#edf8f3;--syllabus-chip-border:#91c4b0;--syllabus-chip-text:#235f4e;--syllabus-chip-hover:#dcf0e7" aria-label="IGCSE 0580 syllabus alignment">
    <a class="lab-syllabus-primary-link" href="https://www.cambridgeinternational.org/Images/662466-2025-2027-syllabus.pdf#page=14" target="_blank" rel="noopener noreferrer" aria-label="Open IGCSE 0580 syllabus section C1.10"></a>
    <span class="lab-syllabus-name">IGCSE 0580</span>
    <span class="lab-syllabus-divider" aria-hidden="true">·</span>
    <span class="lab-syllabus-sections"><a class="lab-syllabus-section is-primary" href="https://www.cambridgeinternational.org/Images/662466-2025-2027-syllabus.pdf#page=14" target="_blank" rel="noopener noreferrer" aria-label="Open primary IGCSE 0580 syllabus section C1.10">C1.10</a><span class="lab-syllabus-separator" aria-hidden="true">,</span><a class="lab-syllabus-section" href="https://www.cambridgeinternational.org/Images/662466-2025-2027-syllabus.pdf#page=34" target="_blank" rel="noopener noreferrer" aria-label="Open IGCSE 0580 syllabus section E1.10">E1.10</a><span class="lab-syllabus-separator" aria-hidden="true">,</span><a class="lab-syllabus-section" href="https://www.cambridgeinternational.org/Images/662466-2025-2027-syllabus.pdf#page=14" target="_blank" rel="noopener noreferrer" aria-label="Open IGCSE 0580 syllabus section C1.9">C1.9</a><span class="lab-syllabus-separator" aria-hidden="true">,</span><a class="lab-syllabus-section" href="https://www.cambridgeinternational.org/Images/662466-2025-2027-syllabus.pdf#page=34" target="_blank" rel="noopener noreferrer" aria-label="Open IGCSE 0580 syllabus section E1.9">E1.9</a></span>
  </section>
</nav>
<!-- LAB_SYLLABUS_CHIPS_END -->
</header>
<!-- LAB_MANIFEST_HEADER_END -->
<span class="lab-authored-title-slot" data-lab-authored-title-slot aria-hidden="true"></span>
  <span data-lab-authored-subtitle-slot hidden></span>

  <section class="panel mission lab-activity-bar" aria-live="polite">
    <div class="mission-copy"><span class="mission-claim" id="missionClaim"></span><span class="goal-kicker" id="goalKicker"></span><strong class="goal-text" id="goalText"></strong></div>
    <div class="mission-tools"><div class="ownership"><span>Working:</span><div class="complexity lab-toggle" data-kind="working" id="complexity" aria-label="How much working you complete"><button type="button" data-level="0" aria-pressed="true">None</button><button type="button" data-level="1" aria-pressed="false">Some</button><button type="button" data-level="2" aria-pressed="false">All</button></div></div><button type="button" class="reset lab-action" id="reset">Reset</button></div>
  </section>

  <section class="panel lab">
    <section class="next-card" id="nextCard" hidden aria-live="polite"></section>
    <section id="proofDock" class="proof-dock" hidden aria-live="polite"></section>
    <div class="stage-shell"><svg id="stage" class="stage" viewBox="0 0 1120 665" role="img" aria-labelledby="stageTitle stageDesc" data-lab-role="model" data-lab-manipulative="bounds-interval"></svg></div>
  </section>

</main>
<script src="./lab-kit.js" data-lab-resource="lab-kit.js"></script>
<script>
(() => {
'use strict';
const $=LabKit.dom.byId,NS='http://www.w3.org/2000/svg';
const low=x=>x.report-x.step/2,high=x=>x.report+x.step/2;
const fmt=(v,n=3)=>Number(v).toFixed(n).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
const number=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const close=(a,b,t)=>a!==null&&Math.abs(a-b)<=t;
const svg=(tag,attrs={},text)=>{const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));if(text!==undefined)node.textContent=text;return node};
const add=(root,tag,attrs,text)=>{const node=svg(tag,attrs,text);root.appendChild(node);return node};

function makeProblem(seed=1,forcedOutcome){
  const distances=[60,80,100,120,150,200],times=[8,10,12,12.4,15,20,25],dSteps=[1,2,5],tSteps=[.1,.2,.5];
  const distance={report:distances[(seed*5+1)%distances.length],step:dSteps[(seed*7)%dSteps.length],unit:'m'};
  const time={report:times[(seed*3+2)%times.length],step:tSteps[(seed*11)%tSteps.length],unit:'s'};
  const lowerSpeed=low(distance)/high(time),outcome=forcedOutcome||(seed%2?'cannot':'certify');
  const threshold=outcome==='certify'?Math.max(.1,Math.floor((lowerSpeed-.03)*100)/100):Math.ceil((lowerSpeed+.03)*100)/100;
  return {seed,distance,time,threshold,lowerSpeed,outcome};
}
function freshSession(problem,level){
  const lockedBounds=level<2,lockedSpeed=level<1;
  return {dLow:lockedBounds?String(low(problem.distance)):'',dHigh:lockedBounds?String(high(problem.distance)):'',tLow:lockedBounds?String(low(problem.time)):'',tHigh:lockedBounds?String(high(problem.time)):'',speed:lockedSpeed?String(problem.lowerSpeed):'',verdict:'',checked:false,success:false,counted:false,bad:[],message:''};
}
const state={problemNumber:1,workingLevel:0,solvedAtLevel:0,problem:makeProblem(1),session:null};
state.session=freshSession(state.problem,state.workingLevel);

function expectedVerdict(){return state.problem.outcome==='certify'?'yes':'no'}
function setLevel(level){
  state.workingLevel=Math.max(0,Math.min(2,Number(level)));state.solvedAtLevel=0;state.session=freshSession(state.problem,state.workingLevel);renderAll();
}
function newProblem(){state.problemNumber++;state.problem=makeProblem(state.problem.seed+1);state.session=freshSession(state.problem,state.workingLevel);renderAll()}
function reset(){state.session=freshSession(state.problem,state.workingLevel);renderAll()}

function renderMission(){
  const p=state.problem,labels=['Choose the certificate decision from the completed worst-case calculation.','Calculate the slowest possible speed, then decide whether the claim is guaranteed.','Build both measurement intervals, calculate the slowest speed, then decide whether the claim is guaranteed.'];
  $('missionClaim').textContent=`Certificate rule · every possible run must be ≥ ${fmt(p.threshold,2)} m/s`;
  $('goalKicker').textContent=`Problem ${state.problemNumber} · ${['decision','calculation','full proof'][state.workingLevel]}`;
  $('goalText').textContent=labels[state.workingLevel];
  $('complexity').querySelectorAll('[data-level]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.level)===state.workingLevel)));
}
function field(key,label,unit,kind,locked){
  const value=state.session[key],bad=state.session.bad.includes(key)?' bad':'';
  if(locked)return `<div class="locked-field"><span>${label}</span><div class="locked-value ${kind}">${fmt(value,4)} ${unit}</div></div>`;
  const status=state.session.checked?(bad?'bad':'good'):'action',mark=status==='good'?'✓':status==='bad'?'×':'';
  return `<label class="num-field ${kind} ${status}"><span>${label}</span><input data-field="${key}" inputmode="decimal" value="${value}" placeholder="${unit}"><span class="field-status" aria-hidden="true">${mark}</span></label>`;
}
function renderDock(){
  const p=state.problem,s=state.session,boundsLocked=state.workingLevel<2,speedLocked=state.workingLevel<1;
  const working=state.workingLevel===2
    ? `<div class="bound-entry-grid"><div class="bound-pair distance"><strong>Distance interval</strong><div class="pair-fields">${field('dLow','lower bound','m','distance',false)}${field('dHigh','upper bound','m','distance',false)}</div></div><div class="bound-pair time"><strong>Time interval</strong><div class="pair-fields">${field('tLow','lower bound','s','time',false)}${field('tHigh','upper bound','s','time',false)}</div></div></div><div class="equation-work" style="margin-top:8px"><div class="locked-field"><span>lower distance bound</span><div class="locked-value distance">${s.dLow?`${s.dLow} m`:'—'}</div></div><div class="eq-label">÷</div><div class="locked-field"><span>upper time bound</span><div class="locked-value time">${s.tHigh?`${s.tHigh} s`:'—'}</div></div><div class="eq-label">=</div>${field('speed','lower speed bound','m/s','speed',false)}</div>`
    : `<div class="equation-work">${field('dLow','lower distance bound','m','distance',boundsLocked)}<div class="eq-label">÷</div>${field('tHigh','upper time bound','s','time',boundsLocked)}<div class="eq-label">=</div>${field('speed','lower speed bound','m/s','speed',speedLocked)}</div>`;
  $('proofDock').hidden=false;
  $('proofDock').innerHTML=`<div class="proof-head"><div><strong>${fmt(p.distance.report)} m and ${fmt(p.time.report)} s were recorded</strong><span>Distance was rounded to the nearest ${fmt(p.distance.step)} m. Time was rounded to the nearest ${fmt(p.time.step)} s.</span></div></div><div class="proof-body"><div class="proof-rule"><strong>Worst case</strong><code>lower distance bound ÷ upper time bound</code><span>This is the slowest possible true speed.</span></div>${working}<div class="compare-rule">Is the slowest possible speed at least ${fmt(p.threshold,2)} m/s?</div><div class="proof-actions"><span class="decision-label">Certificate decision</span><div class="verdict-group"><button type="button" class="verdict lab-action" data-verdict="yes" aria-pressed="${s.verdict==='yes'}">Certify</button><button type="button" class="verdict lab-action" data-verdict="no" aria-pressed="${s.verdict==='no'}">Cannot certify</button></div><button type="button" class="proof-check lab-action" id="checkProof">Check</button></div><div class="proof-message ${s.success?'good':s.checked?'bad':''}">${s.message||'Complete the working you own, then make the certificate decision.'}</div>${s.success?`<div class="method-reveal"><code>${fmt(low(p.distance),4)} ÷ ${fmt(high(p.time),4)} = ${fmt(p.lowerSpeed,3)} m/s</code><br>${p.outcome==='certify'?'The lowest possible speed meets the claim, so every allowed run passes.':'The lowest possible speed is below the claim, so the rounded readings cannot guarantee it.'}</div>`:''}</div>`;
}
function renderNext(){
  const card=$('nextCard'),s=state.session;if(!s.success){card.hidden=true;card.replaceChildren();return}
  const canUpgrade=state.solvedAtLevel>=3&&state.workingLevel<2,nextLabel=state.workingLevel===0?'Take ownership of the calculation':'Take ownership of the bounds';
  card.hidden=false;card.innerHTML=`<strong>Problem complete</strong><span>Your worst-case proof supports the certificate decision.</span><button type="button" class="next-problem lab-action" data-next data-priority="primary">Next problem</button>${canUpgrade?`<div class="next-upgrade"><strong>Ready to show more working?</strong><span>${state.workingLevel===0?'Calculate the lower speed bound yourself on this same problem.':'Construct all four bounds yourself on this same problem.'}</span><button type="button" data-upgrade class="lab-action">${nextLabel}</button></div>`:''}`;
}
function renderStage(){
  const root=$('stage'),p=state.problem,s=state.session;root.replaceChildren();root.setAttribute('viewBox','0 0 1120 560');
  add(root,'title',{id:'stageTitle'},'Rounded measurement interval model');add(root,'desc',{id:'stageDesc'},'The possible distance and time intervals and their effect on the minimum speed.');add(root,'rect',{x:0,y:0,width:1120,height:560,rx:10,fill:'#fbfcfd'});
  add(root,'text',{x:34,y:31,class:'kicker'},'RECORDED RUN');add(root,'text',{x:34,y:55,class:'title'},`Test the claim that every possible true speed is at least ${fmt(p.threshold,2)} m/s.`);
  const rows=[{name:'DISTANCE',y:155,data:p.distance,color:'allowed-d',digits:3},{name:'TIME',y:300,data:p.time,color:'allowed-t',digits:4}];
  rows.forEach(row=>{const a=low(row.data),b=high(row.data),pad=row.data.step*.7,min=a-pad,max=b+pad,x=v=>245+(v-min)/(max-min)*650;add(root,'rect',{x:35,y:row.y-42,width:165,height:84,rx:10,class:'screen'});add(root,'text',{x:50,y:row.y-18,class:'screen-label'},'RECORDED READING');add(root,'text',{x:50,y:row.y+13,class:'screen-value'},`${fmt(row.data.report)} ${row.data.unit}`);add(root,'text',{x:50,y:row.y+31,class:'screen-target'},`nearest ${fmt(row.data.step)} ${row.data.unit}`);add(root,'text',{x:245,y:row.y-52,class:'kicker'},row.name+' · POSSIBLE TRUE VALUES');add(root,'rect',{x:245,y:row.y-16,width:650,height:32,rx:9,class:'ruler'});add(root,'rect',{x:x(a),y:row.y-11,width:x(b)-x(a),height:22,rx:7,class:row.color});add(root,'line',{x1:x(a),x2:x(a),y1:row.y-31,y2:row.y+31,class:'bound'});add(root,'line',{x1:x(b),x2:x(b),y1:row.y-31,y2:row.y+31,class:'bound upper'});add(root,'text',{x:x(a),y:row.y+51,'text-anchor':'middle',class:'bound-value'},fmt(a,row.digits));add(root,'text',{x:x(b),y:row.y+51,'text-anchor':'middle',class:'bound-value'},fmt(b,row.digits));});
  const lo=p.lowerSpeed,hi=high(p.distance)/low(p.time),min=Math.min(lo,p.threshold)-Math.max(.1,(hi-lo)*.25),max=Math.max(hi,p.threshold)+Math.max(.1,(hi-lo)*.25),x=v=>245+(v-min)/(max-min)*650;
  add(root,'rect',{x:215,y:390,width:705,height:130,rx:10,class:'speed-box'});add(root,'text',{x:245,y:418,class:'kicker'},'POSSIBLE SPEEDS');add(root,'rect',{x:245,y:450,width:650,height:16,rx:8,class:'speed-track'});add(root,'rect',{x:x(lo),y:450,width:x(hi)-x(lo),height:16,rx:8,class:'speed-range'});add(root,'line',{x1:x(p.threshold),x2:x(p.threshold),y1:428,y2:486,class:'speed-threshold'});add(root,'text',{x:x(p.threshold),y:421,'text-anchor':'middle',class:'speed-caption'},`${fmt(p.threshold,2)} required`);add(root,'circle',{cx:x(lo),cy:458,r:6,class:'speed-extreme'});add(root,'text',{x:x(lo),y:500,'text-anchor':'middle',class:'speed-label'},s.success||state.workingLevel===0?fmt(lo,3):'?');add(root,'text',{x:x(lo),y:514,'text-anchor':'middle',class:'speed-caption'},'slowest possible');
}
function check(){
  const p=state.problem,s=state.session,expected={dLow:low(p.distance),dHigh:high(p.distance),tLow:low(p.time),tHigh:high(p.time),speed:p.lowerSpeed};s.checked=true;s.bad=[];
  if(state.workingLevel===2){for(const key of ['dLow','dHigh','tLow','tHigh'])if(!close(number(s[key]),expected[key],.000001))s.bad.push(key)}
  if(state.workingLevel>=1&&!close(number(s.speed),expected.speed,.00051))s.bad.push('speed');
  if(s.bad.length)s.message=state.workingLevel===2&&s.bad.some(k=>k!=='speed')?'At least one interval endpoint does not match the stated rounding accuracy.':'Recalculate lower distance bound ÷ upper time bound.';
  else if(!s.verdict)s.message='The working is complete. Now choose the certificate decision.';
  else if(s.verdict!==expectedVerdict())s.message=`Compare ${fmt(expected.speed,3)} m/s with ${fmt(p.threshold,2)} m/s before deciding.`;
  else{s.success=true;s.message=p.outcome==='certify'?'Every allowed speed meets the claim. Certificate justified.':'At least one allowed speed misses the claim. Cannot certify.';if(!s.counted){s.counted=true;state.solvedAtLevel++}}
  renderAll();
}
function renderAll(){renderMission();renderDock();renderStage();renderNext()}

$('complexity').addEventListener('click',event=>{const button=event.target.closest('[data-level]');if(button)setLevel(button.dataset.level)});$('reset').addEventListener('click',reset);
$('proofDock').addEventListener('input',event=>{if(event.target.dataset.field){state.session[event.target.dataset.field]=event.target.value;state.session.checked=false;state.session.bad=[];renderStage()}});
$('proofDock').addEventListener('click',event=>{const verdict=event.target.closest('[data-verdict]');if(verdict){state.session.verdict=verdict.dataset.verdict;state.session.checked=false;state.session.bad=[];renderDock();return}if(event.target.closest('#checkProof'))check()});
$('nextCard').addEventListener('click',event=>{if(event.target.closest('[data-next]'))newProblem();if(event.target.closest('[data-upgrade]'))setLevel(state.workingLevel+1)});
window.__ROUNDED_BOUNDS_LAB__={getState:()=>JSON.parse(JSON.stringify({...state,lower:low(state.problem.distance),upperTime:high(state.problem.time)})),setWorkingLevel:setLevel,setProblem:(seed,level=state.workingLevel,outcome)=>{state.problemNumber=1;state.problem=makeProblem(seed,outcome);state.workingLevel=Number(level);state.solvedAtLevel=0;state.session=freshSession(state.problem,state.workingLevel);renderAll()},setAnswers:answers=>{Object.assign(state.session,Object.fromEntries(Object.entries(answers).map(([key,value])=>[key,String(value)])));renderAll()},check,reset};
renderAll();
})();

</script>
