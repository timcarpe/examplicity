}
/* Source controls invoke through the dock; do not leave their old rows as blank space. */

/* Scoped restart disclosure: DOM and visual order agree at every breakpoint. */
.lesson-head .reset-menu{position:relative;grid-area:1 / 2;font:400 12px/1.4 var(--lab-font-sans);z-index:10}

/* SVG group touch-action alone does not stop mobile scroll arbitration after a redraw. */
.rail-lab .stage{touch-action:none}

<body class="lab-adopt-v3 mathematics straight-line-coordinates-equations" data-lab-layout="standard">
<main data-lab-workspace>
<span class="lab-authored-title-slot" data-lab-authored-title-slot aria-hidden="true"></span><span data-lab-authored-subtitle-slot hidden></span>
<section class="lab rail-lab" aria-label="Straight-line rail investigation">
<header class="lesson-head lab-context" aria-labelledby="title">
  <div class="lesson-meta"><p id="stepLabel" class="step-label"></p><div id="checkpoints" class="lab-checkpoints" aria-label="Learning progress"></div></div>
  <details id="resetMenu" class="reset-menu"><summary aria-controls="resetOptions">Restart options<span class="reset-chevron" aria-hidden="true"></span></summary><div class="reset-options" id="resetOptions"><div id="resetChoices" class="reset-choices"><button type="button" class="lab-action" id="repeat" aria-label="Repeat this step"><span id="repeatLabel">Repeat this step</span><small id="repeatDescription">Reset this step only; keep other progress.</small></button><button type="button" class="lab-action" id="restart" aria-label="Restart lab"><span>Restart lab…</span><small>Clear this lab’s progress and readings.</small></button></div><section class="reset-confirmation" id="resetConfirmation" aria-labelledby="resetTitle" hidden><h2 id="resetTitle">Restart this lab?</h2><p>This clears your answers, readings and visited steps in this lab. It cannot be undone.</p><div class="reset-confirm-actions"><button type="button" class="lab-action" id="cancelRestart">Keep working</button><button type="button" class="lab-action" id="confirmRestart" data-lab-action="reset">Restart lab</button></div></section></div></details>
  <div class="mission-copy"><h2 id="title" tabindex="-1"></h2><p class="intro" id="intro"></p></div>
</header>
<div id="context" class="context"></div>
<div class="stage-wrap lab-stage-surface" id="stageWrap"><svg xmlns="http://www.w3.org/2000/svg" class="stage" id="stage" role="group" data-lab-role="model" data-lab-manipulative="graph"></svg></div>
<section id="working" class="lab-work-card learning-work" hidden data-lab-role="working" aria-label="Working"></section>
<div class="controls" id="controls"></div>
<footer class="foot learning-dock" id="learningDock" aria-label="Feedback and next action" data-state="idle" data-lab-role="evidence">
  <div class="outcome" id="outcome" data-state="idle"><svg class="outcome-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle class="outcome-disc" cx="12" cy="12" r="10.5"/><path class="success-mark" d="m7 12 3.25 3.25L17 8.5"/><path class="retry-mark" d="M12 7v6m0 4h.01"/></svg><div><p class="outcome-title" id="outcomeTitle"></p><p class="feedback" id="feedback"></p></div></div>
  <div class="dock-actions"><div class="dock-navigation"><button class="lab-action" id="back" aria-label="Previous step">Back</button><button class="lab-action" id="forwardVisited" hidden>Forward</button><button type="button" class="lab-action hint-toggle" id="hintToggle" aria-expanded="false" aria-controls="evidenceHelp">Hint</button></div><div class="dock-advance"><button type="button" class="lab-action" id="secondaryAction" hidden></button><div class="primary-slot"><button type="button" class="lab-action" data-priority="primary" id="next" aria-describedby="feedback">Continue</button></div></div></div>
  <section id="evidenceHelp" class="evidence-help" aria-labelledby="hintTitle" hidden><h2 id="hintTitle"></h2><p id="hintText"></p><div class="hint-navigation"><button type="button" id="previousHint" class="lab-action">Previous hint</button><button type="button" id="anotherHint" class="lab-action">Next hint</button></div></section>
</footer>
<table class="records" id="records" hidden aria-label="Experiment readings" data-lab-role="evidence"></table><p id="comparisonNote" class="comparison-note" hidden></p>
<p id="statusAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<p class="smallprint">Coordinate units. Gradient is signed rise ÷ run. Vertical lines use x = k, not an infinite numerical gradient. The carriage checks the interval from −2 to 2.</p>
<noscript>This interactive lab needs JavaScript enabled in your browser.</noscript>
</section>
</main>
<script src="./lab-kit.js" data-lab-resource="lab-kit.js"></script>
<script>
// Small DOM and lesson helpers. Each model owns its state and completion conditions.
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(x,d=1)=>Number(x.toFixed(d)).toString();
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let W=900,H=420,mobile=false,step=0,maxStep=0,ready=false,drag=null;
// Session-only snapshots: inspecting an earlier result must not rerun the experiment.
const checkpointSnapshots=new Map();
let hintSteps=[];
let activeDockSource=null,secondaryDockSource=null,announcementTimer=0,outcomeHeading='';
const validNumber=value=>String(value).trim()!==''&&Number.isFinite(Number(value));

const svg=$('stage');
function el(tag,attrs={},text,parent=svg){const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;parent.appendChild(n);return n}
function text(x,y,t,cls='',anchor='start',parent=svg){return el('text',{x,y,class:cls,'text-anchor':anchor},t,parent)}
function line(x1,y1,x2,y2,attrs={},parent=svg){return el('line',{x1,y1,x2,y2,stroke:'var(--ink)','stroke-width':2,...attrs},undefined,parent)}
function dot(x,y,r,attrs={},parent=svg){return el('circle',{cx:x,cy:y,r,...attrs},undefined,parent)}
function clear(){const active=document.activeElement?.getAttribute('data-control'),source=document.activeElement?.getAttribute('data-source');svg.dataset.restoreSource=source||'';svg.replaceChildren();svg.dataset.restoreFocus=active||'';}
function endDraw(){const id=svg.dataset.restoreFocus,key=svg.dataset.restoreSource;if(id)svg.querySelector(`[data-control="${id}"]`)?.focus({preventScroll:true});else if(key)svg.querySelector(`[data-source="${key}"]`)?.focus({preventScroll:true});updateConnections();syncHint();}
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function handle(id,x,y,config){const g=el('g',{'data-control':id,class:'model-control',tabindex:0,role:'slider','aria-label':config.label,'aria-valuemin':config.min,'aria-valuemax':config.max,'aria-valuenow':config.value,'aria-valuetext':config.valueText??`${fmt(config.value,2)}`});g.dataset.help=config.help||config.label+'. Drag this control, or use the arrow keys to change its value.';dot(x,y,24,{fill:'transparent'},g);dot(x,y,12,{class:'handle'},g);dot(x,y,3,{fill:'var(--lab-accent)'},g);g.onpointerdown=e=>{e.preventDefault();drag={id,config,offset:config.value-config.fromPoint(point(e))};svg.setPointerCapture(e.pointerId);g.focus({preventScroll:true});};g.onkeydown=e=>{let v=config.value;if(['ArrowLeft','ArrowDown'].includes(e.key))v-=config.increment||.1;else if(['ArrowRight','ArrowUp'].includes(e.key))v+=config.increment||.1;else if(e.key==='Home')v=config.min;else if(e.key==='End')v=config.max;else return;e.preventDefault();config.set(clamp(v,config.min,config.max));};return g}
svg.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drag.config.set(clamp(drag.config.fromPoint(point(e))+drag.offset,drag.config.min,drag.config.max))});
svg.addEventListener('pointerup',e=>{if(!drag)return;const id=drag.id;drag=null;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);svg.querySelector(`[data-control="${id}"]`)?.focus({preventScroll:true})});
svg.addEventListener('pointercancel',()=>{drag=null});
function feedback(message,ok=false,retry=false,heading=''){
 outcomeHeading=heading;
 if($('feedback').textContent!==message)$('feedback').textContent=message;
 $('feedback').className='feedback'+(ok?' good':retry?' retry':'');
 ready=ok;
 $('next').disabled=!ok&&step>=maxStep;
 scheduleOutcome();
}
function head(title,intro){
 $('title').textContent=title;$('intro').textContent=intro;
 $('stepLabel').textContent=step===lesson.length-1?'Experiment':`Step ${step+1} of ${lesson.length-1} · ${lesson[step].label}`;
 if($('checkpoints').dataset.step!==String(step)){
  LabDesign.checkpoints($('checkpoints'),lesson.slice(0,-1).map(x=>x.label),step===lesson.length-1?-1:step,i=>i<maxStep);
  $('checkpoints').dataset.step=step;
 }
 $('back').disabled=step===0;
 $('next').hidden=step===lesson.length-1;
 $('next').textContent=step<maxStep?'Forward':step===lesson.length-2?'Open experiment':'Continue';
 svg.setAttribute('aria-label',title+' '+intro);
}
function checkpointState(){
 s.helpOpen=!$('evidenceHelp').hidden;
 return {state:structuredClone(s),extras:typeof snapshotExtras==='function'?snapshotExtras():null};
}
function restoreCheckpoint(saved){
 for(const key of Object.keys(s))delete s[key];
 Object.assign(s,structuredClone(saved.state));
 if(typeof restoreExtras==='function')restoreExtras(structuredClone(saved.extras));
 restoreView();
}
function go(n,restart=false,repeat=false){
 if(checkpointBusy)return;
 if(!restart&&(s.busy||s.phase==='offspring'))return;
 if(!restart&&!repeat)checkpointSnapshots.set(step,checkpointState());
 if(typeof stopModel==='function')stopModel();
 return changeCheckpoint(()=>{
  if(restart){checkpointSnapshots.clear();maxStep=0;step=0;reset();}
  step=clamp(n,0,lesson.length-1);
  if(repeat)checkpointSnapshots.delete(step);
  maxStep=Math.max(maxStep,step);
  $('controls').replaceChildren();$('context').replaceChildren();
  $('working').hidden=true;$('working').replaceChildren();$('records').replaceChildren();$('records').hidden=true;
  $('comparisonNote').hidden=true;$('evidenceHelp').hidden=true;
  hintSteps=[];ready=false;drag=null;
  const saved=checkpointSnapshots.get(step);
  if(saved)restoreCheckpoint(saved);else{s.helpLevel=0;s.helpOpen=false;enter();}
  resize(true);
 });
}
$('next').onclick=e=>{
 if(e.detail>1||checkpointBusy||s.busy||s.phase==='offspring')return;
 if(activeDockSource)runDockAction(activeDockSource,e);
 else if(ready||step<maxStep)go(step+1);
};
$('forwardVisited').onclick=e=>{if(e.detail<=1&&step<maxStep)go(step+1)};
$('back').onclick=()=>go(step-1);
// Restart is a native disclosure, not an application menu or a learner-work modal.
function resetChoicesView(){
 $('resetChoices').hidden=false;$('resetConfirmation').hidden=true;
}
function closeReset(restoreFocus=false){
 $('resetMenu').open=false;resetChoicesView();
 if(restoreFocus)$('resetMenu').querySelector('summary').focus({preventScroll:true});
}
$('resetMenu').addEventListener('toggle',()=>{if(!$('resetMenu').open)resetChoicesView();});
// Wait for the actual next focus target: focusout can temporarily leave body active.
document.addEventListener('focusin',e=>{
 if($('resetMenu').open&&!$('resetMenu').contains(e.target))closeReset(false);
});
$('restart').onclick=e=>{
 if(e.detail>1||checkpointBusy||s.busy||s.phase==='offspring')return;
 $('resetChoices').hidden=true;$('resetConfirmation').hidden=false;
 $('cancelRestart').focus({preventScroll:true});
};
$('cancelRestart').onclick=()=>{resetChoicesView();$('restart').focus({preventScroll:true});};
$('confirmRestart').onclick=e=>{
 if(e.detail>1||checkpointBusy||s.busy||s.phase==='offspring')return;
 closeReset(false);go(0,true);
};
$('repeat').onclick=e=>{
 if(e.detail>1||checkpointBusy||s.busy||s.phase==='offspring')return;
 closeReset(false);go(step,false,true);
};

// One disclosure location. Opening/closing help never shifts the action row above it.
function setHelp(steps){
 hintSteps=steps;
 $('hintToggle').hidden=!steps.length;
 syncHint();
}
function syncHint(){
 document.querySelectorAll('.evidence-cue').forEach(node=>node.classList.remove('evidence-cue'));
 const open=hintSteps.length>0&&!!s.helpOpen;
 $('evidenceHelp').hidden=!open;
 $('hintToggle').setAttribute('aria-expanded',String(open));
 $('hintToggle').textContent=open?'Hide hint':'Hint';
 if(!open)return;
 const level=clamp(s.helpLevel||0,0,hintSteps.length-1),value=hintSteps[level];
 const hint=typeof value==='function'?value():value;
 $('hintTitle').textContent=`${hint.example?'Worked example':'Hint'} ${level+1} of ${hintSteps.length}`;
 const text=typeof hint==='string'?hint:hint.text;
 if($('hintText').textContent!==text)$('hintText').textContent=text;
 $('previousHint').disabled=level===0;
 $('anotherHint').disabled=level>=hintSteps.length-1;
 $('anotherHint').textContent=hintSteps[level+1]?.example?'Show example':'Next hint';
 for(const key of hint.keys||[])document.querySelectorAll(`[data-source="${key}"]`).forEach(node=>node.classList.add('evidence-cue'));
}
$('hintToggle').onclick=()=>{s.helpOpen=!s.helpOpen;syncHint();if(s.helpOpen)requestAnimationFrame(()=>{if(s.helpOpen)$('evidenceHelp').scrollIntoView({block:'nearest',behavior:'instant'});});};
$('previousHint').onclick=()=>{s.helpLevel=Math.max(0,(s.helpLevel||0)-1);syncHint();};
$('anotherHint').onclick=()=>{s.helpLevel=Math.min(hintSteps.length-1,(s.helpLevel||0)+1);syncHint();};
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 if($('resetMenu').open){closeReset(true);}
 else if(s.helpOpen&&(e.target.closest('#evidenceHelp')||e.target===$('hintToggle'))){s.helpOpen=false;syncHint();$('hintToggle').focus();}
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#resetMenu'))closeReset(false);});

// A single, persistent button for Test / Check / Continue. Model calculations and
// completion predicates remain in the subject files; the dock invokes their real callbacks.
function dockSources(){
 return [...document.querySelectorAll('[data-dock-action]')]
  .filter(node=>!node.disabled&&!node.closest('[hidden]'))
  .sort((a,b)=>Number(b.dataset.dockRank||10)-Number(a.dataset.dockRank||10));
}
function syncActionDock(){
 const busy=!!s.busy||s.phase==='offspring',experiment=step===lesson.length-1;
 const sources=dockSources(),next=$('next'),secondary=$('secondaryAction');
 activeDockSource=!ready?sources[0]||null:null;
 secondaryDockSource=sources.find(node=>node!==activeDockSource&&node.dataset.repeatable==='true')||null;
 next.hidden=experiment&&!busy&&!activeDockSource;
 next.disabled=busy||(!activeDockSource&&!ready&&step>=maxStep);
 next.textContent=busy?(s.phase==='offspring'?'Producing offspring…':'Testing…'):activeDockSource?activeDockSource.textContent:step<maxStep?'Forward':step===lesson.length-2?'Open experiment':'Continue';
 secondary.hidden=busy||!secondaryDockSource;
 if(secondaryDockSource)secondary.textContent=secondaryDockSource.textContent;
 $('forwardVisited').hidden=step>=maxStep||!activeDockSource;
 $('forwardVisited').disabled=busy;
 $('back').disabled=busy||step===0;
 $('repeat').disabled=busy;
 $('restart').disabled=busy;$('confirmRestart').disabled=busy;
 $('repeatLabel').textContent=experiment?'Reset experiment':'Repeat this step';
 $('repeat').setAttribute('aria-label',experiment?'Reset experiment':'Repeat this step');
 $('repeatDescription').textContent=experiment?'Clear this experiment; keep guided progress.':'Reset this step only; keep other progress.';
 $('learningDock').setAttribute('aria-busy',String(busy));
 // The same button changes from Test to Continue: focus and pointer position are retained.
}
function runDockAction(source,event){
 if(event.detail>1||checkpointBusy||s.busy||s.phase==='offspring'||!source?.isConnected||source.disabled)return;
 source.click();
}
$('secondaryAction').onclick=e=>runDockAction(secondaryDockSource,e);
function announceOutcome(state){
 clearTimeout(announcementTimer);
 const message=$('outcomeTitle').textContent+'. '+$('feedback').textContent;
 announcementTimer=setTimeout(()=>{
  if($('statusAnnouncement').textContent!==message)$('statusAnnouncement').textContent=message;
 },state==='good'||state==='retry'?0:300);
}
function rememberReading(reading){
 s.records.push(structuredClone(reading));
 if(s.records.length>6){s.records.shift();s.comparison=s.comparison>0?s.comparison-1:null;}
 if(s.comparison==null)s.comparison=s.records.length-1;
}
function clearReadings(){s.records=[];s.comparison=null;render();}
function comparisonDescription(before,after){
 const changed=Object.keys(after).filter(key=>String(before[key])!==String(after[key]));
 return changed.length?'Changed: '+changed.map(key=>`${key} ${before[key]} → ${after[key]}`).join('; ')+'.':'Same conditions. Change one quantity to compare its consequence.';
}
function comparisonNote(message){const node=$('comparisonNote');node.hidden=!message;node.textContent=message;}

// Pure straight-line model. No DOM, sampling-based equality or expression evaluation.
function railNumber(value) {
  const raw = String(value).trim().replace(/−/g, '-').replace(/\s/g, '');
  if (!raw) return null;
  const match = raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\/([+-]?(?:\d+(?:\.\d*)?|\.\d+)))?$/);
  if (!match) return null;
  const numerator = Number(match[1]), denominator = match[2] === undefined ? 1 : Number(match[2]);
  const valueNumber = numerator / denominator;
  return denominator !== 0 && Number.isFinite(valueNumber) ? valueNumber : null;
}
function railValue(rail, position) { return rail.mode === 'vertical' ? rail.k : rail.m * position + rail.c; }
function railPoint(rail, position) { return rail.mode === 'vertical' ? {x: rail.k, y: position} : {x: position, y: railValue(rail, position)}; }
function railGap(a, b, position) { return a.mode === b.mode ? railValue(a, position) - railValue(b, position) : null; }
function railExtent(a, b, low = -2, high = 2) {
  // The gap is affine. Its absolute maximum on a closed interval is at an endpoint.

  return Math.max(Math.abs(railGap(a, b, low)), Math.abs(railGap(a, b, high)));

function railText(value) {

function railEquation(rail) {
  if (rail.mode === 'vertical') return `x = ${railText(rail.k)}`;
  if (Math.abs(rail.m) < 1e-9) return `y = ${railText(rail.c)}`;
  const first = rail.m === 1 ? 'x' : rail.m === -1 ? '−x' : `${railText(rail.m)}x`;
  return 'y = ' + first + (rail.c === 0 ? '' : ` ${rail.c < 0 ? '−' : '+'} ${railText(Math.abs(rail.c))}`);

function railOnPoint(rail, point) { return Math.abs(rail.mode === 'vertical' ? point.x - rail.k : point.y - railValue(rail, point.x)) < 1e-8; }

  if(editableTilt){
    const x=plot.x(2),y=plot.y(2*s.m+s.c);
    railHandle('rail-tilt',x,y,'Tilt: gradient',{help:'Drag up or down to change the gradient. The intercept stays fixed.',min:-1.5,max:1.5,value:s.m,increment:.25,set:v=>setRailValue('m',v),fromPoint:p=>((plot.top+plot.size-p.y)/plot.unit-5-s.c)/2});
    text(x+19,y+([3,4].includes(step)||y<plot.top+28?24:-16),'Tilt','rail-control-label');
  }
  if(editableSlide){
    const x=plot.x(0),y=plot.y(s.c);
    railHandle('rail-slide',x,y,'Slide: y-intercept',{help:'Drag vertically to move the whole rail. Its gradient does not change.',min:-2,max:2,value:s.c,increment:.5,set:v=>setRailValue('c',v),fromPoint:p=>(plot.top+plot.size-p.y)/plot.unit-5});
    text(x-20,y-16,'Slide','rail-control-label','end');
  }
  if(s.mode==='vertical'){
    const xx=plot.x(s.k),yy=plot.y(0);
    railHandle('rail-vertical',xx,yy,'Slide: constant x-coordinate',{help:'Drag horizontally. Every point on the vertical rail keeps the same x-coordinate.',min:-3,max:3,value:s.k,increment:.5,set:v=>setRailValue('k',v),fromPoint:p=>(p.x-plot.left)/plot.unit-5});
    text(xx+18,yy-18,'Slide','rail-control-label');
  }
  // Coordinate labels are given measurements, never correctness signals.
  if(s.mode==='linear'&&step<=2){
    const xx=plot.x(0),yy=plot.y(s.c);
    if(!editableSlide)dot(xx,yy,4,{class:'rail-coordinate-dot'});
    sourceLabel('intercept',xx-16,yy+17,`(0, ${railText(s.c)})`,'At x = 0 the second coordinate is the y-intercept c.','small','end');
    if(step===2){dot(plot.x(2),plot.y(2*s.m+s.c),4,{class:'rail-coordinate-dot'});sourceLabel('point-b',plot.x(2)+14,plot.y(2*s.m+s.c)-18,`(2, ${railText(2*s.m+s.c)})`,'A second measured point on the amber rail. Compare its coordinates with the point at x = 0.','small');}
  }
}
function drawRailProbe(plot,other) {
  const p=railPoint(currentRail(),s.probe),xx=plot.x(p.x),yy=plot.y(p.y),trackY=plot.bottom+45;
  const group=el('g',{'clip-path':'url(#railPlotClip)'});
  line(xx,yy,xx,plot.bottom,{class:'rail-probe-guide'},group);
  if(s.mode==='linear')line(xx,plot.bottom,xx,trackY,{class:'rail-probe-guide'});
  // A neutral carriage follows the actual rail. It never changes the geometry or prediction.
  dot(xx,yy,5,{class:'rail-carriage'},group);
  if(other){
    if(other.mode===s.mode){
      const q=railPoint(other,s.probe);
      line(xx,yy,plot.x(q.x),plot.y(q.y),{class:'rail-gap'},group);
      dot(plot.x(q.x),plot.y(q.y),4,{class:'rail-other-point'},group);
    }
  }
  const left=plot.x(-2),right=plot.x(2),trackX=left+(s.probe+2)/4*(right-left);
  line(left,trackY,right,trackY,{class:'rail-travel-base'});
  if(s.visitedLow!==null)line(plot.x(s.visitedLow),trackY,plot.x(s.visitedHigh),trackY,{class:'rail-travel-visited'});
  for(const value of [-2,2]){const visited=value<0?s.visitedLow!==null&&s.visitedLow<=-2:s.visitedHigh!==null&&s.visitedHigh>=2;dot(plot.x(value),trackY,5,{class:`rail-stop${visited?' visited':''}`});text(plot.x(value),trackY+26,railText(value),'small','middle');}
  railHandle('rail-probe',trackX,trackY,'Test carriage position',{help:s.mode==='vertical'?'Move between −2 and 2 to inspect the lower and upper ends of the vertical rail.':'Move between −2 and 2 to compare the rail at different x-coordinates.',min:-2,max:2,value:s.probe,increment:.25,valueText:`${s.mode==='vertical'?'y':'x'} = ${railText(s.probe)}`,set:setProbe,fromPoint:q=>-2+4*(q.x-left)/(right-left)});
  text(W/2,trackY-23,'Test carriage','small','middle');
  sourceLabel('probe-coordinate',W/2,trackY+55,`Point (${railText(p.x)}, ${railText(p.y)})`,'The carriage reads a point on the actual amber rail. First coordinate: x. Second coordinate: y.','accent','middle');
  const gap=other?railGap(currentRail(),other,s.probe):null;
  const reading=other?(gap===null?'Different directions':`${s.mode==='vertical'?'Horizontal':'Vertical'} gap: ${railText(Math.abs(gap))}`):s.mode==='vertical'?'x stays constant as the carriage travels.':'Read x, then y, at this position.';
  sourceLabel('gap',W/2,trackY+80,reading,'The gap compares the rails at the same x-coordinate, or at the same y-coordinate for two vertical rails. A single matching point is not enough.','small','middle');
}
function render() {
  clear();head(lesson[step].title,lesson[step].intro);
  const plot=railLayout(),ref=referenceRail(),prediction=needsEquation()&&s.tested?predictedRail():null;
  const saved=step===6&&s.comparison!==null?s.records[s.comparison]:null;
  const defs=el('defs'),clip=el('clipPath',{id:'railPlotClip'},undefined,defs);
  el('rect',{x:plot.left,y:plot.top,width:plot.size,height:plot.size},undefined,clip);
  el('rect',{x:plot.left,y:plot.top,width:plot.size,height:plot.size,class:'rail-plot'});
  for(let i=-5;i<=5;i++){
    line(plot.x(i),plot.top,plot.x(i),plot.bottom,{class:i===0?'rail-axis':'rail-grid'});
    line(plot.left,plot.y(i),plot.right,plot.y(i),{class:i===0?'rail-axis':'rail-grid'});
    if(i!==0&&i%2===0){text(plot.x(i),plot.y(0)+15,String(i),'rail-tick','middle');text(plot.x(0)-7,plot.y(i)+4,String(i),'rail-tick','end');}
  }
  text(plot.right+14,plot.y(0)+5,'x','small','middle');text(plot.x(0),plot.top-10,'y','small','middle');
  // The legend is stable and sits outside the drawing, not in floating cards over it.
  line(plot.left,17,plot.left+17,17,{stroke:'var(--lab-concept-amber)','stroke-width':3});text(plot.left+24,21,'Your rail','small');
  if(ref){line(plot.right-100,17,plot.right-83,17,{stroke:'var(--lab-concept-blue)','stroke-width':3});text(plot.right-76,21,'Reference','small');drawRail(ref,'reference',plot);}
  else if(prediction||saved){line(plot.right-109,17,plot.right-90,17,{stroke:'var(--lab-concept-violet)','stroke-width':2,'stroke-dasharray':'5 3'});text(plot.right-84,21,saved?'Saved line':'Equation','small');}
  drawRailTriangle(plot);drawRail(currentRail(),'candidate',plot);
  if(prediction)drawRail(prediction,'prediction',plot);if(saved)drawRail(saved,'saved',plot);
  if(step===1)railMount('P',0,2,plot,'point-p');
  if(step===3){railMount('A',-2,3,plot,'point-a');railMount('B',2,1,plot,'point-b');}
  if(step===4){railMount('A',-2,-2,plot,'point-a');railMount('B',2,-2,plot,'point-b');}
  if(step===5)railMount('P',2,1,plot,'point-p');
  drawRailControls(plot);drawRailProbe(plot,prediction||saved||ref);
  updateRailWork();railFeedback();endDraw();
}

const lesson = [
  {label:'Tilt', title:'Make the rails run in the same direction.', intro:'Drag Tilt to turn the amber rail. Then move the carriage to both ends and compare the gap.', success:'The gap stays constant.'},
  {label:'Slide', title:'Keep the direction. Move the rail through P.', intro:'Drag Slide until the amber rail passes through P(0, 2). Check both ends with the carriage.', success:'Sliding changes the intercept, not the gradient.'},
  {label:'Describe', title:'Write an equation for the amber rail.', intro:'Use the marked coordinates to enter m and c. Test your equation, then compare it at both ends.', success:'One equation describes the whole rail.'},
  {label:'Falling rail', title:'Build a rail through both mounting points.', intro:'Use Tilt and Slide to reach A(−2, 3) and B(2, 1). Write its equation and test both ends.', success:'Both points and the equation agree.'},
  {label:'Level rail', title:'Build a level rail through both mounts.', intro:'Place the rail through A(−2, −2) and B(2, −2). Enter its gradient and intercept, then test.', success:'A horizontal line has zero gradient.'},
  {label:'Vertical rail', title:'Slide a vertical rail through P.', intro:'Reach P(2, 1), then choose which coordinate stays constant. Test the equation along the rail.', success:'A vertical line keeps x constant.'},
  {label:'Experiment', title:'Compare lines of your own.', intro:'Tilt or slide the rail, move the carriage and save a reading. Select a saved line to compare it.', success:''}
];
const s = {mode:'linear',m:1,c:-1,k:-1,probe:0,visitedLow:null,visitedHigh:null,answerM:'',answerC:'',axis:'',answerK:'',tested:false,invalid:false,records:[],comparison:null};
function currentRail() { return {mode:s.mode,m:s.m,c:s.c,k:s.k}; }
function targetRail() {
  return [
    {mode:'linear',m:.5,c:-1}, {mode:'linear',m:.5,c:2}, {mode:'linear',m:.5,c:1},
    {mode:'linear',m:-.5,c:2}, {mode:'linear',m:0,c:-2}, {mode:'vertical',k:2}
  ][step] || null;
}
function referenceRail() { return step===0?{mode:'linear',m:.5,c:1}:step===1?{mode:'linear',m:.5,c:0}:null; }
function predictedRail() {
  if (step===5) {
    const k=railNumber(s.answerK);
    return k===null||!['x','y'].includes(s.axis)?null:s.axis==='x'?{mode:'vertical',k}:{mode:'linear',m:0,c:k};
  }
  const m=railNumber(s.answerM),c=railNumber(s.answerC);
  return m===null||c===null?null:{mode:'linear',m,c};
}
function needsEquation() { return step>=2 && step<=5; }
function geometryMatches() { return step===0?railParallel(currentRail(),targetRail()):railSame(currentRail(),targetRail()); }
function comparedBothEnds() { return s.visitedLow!==null&&s.visitedLow<=-2&&s.visitedHigh>=2; }
function clearTravel() { s.visitedLow=null;s.visitedHigh=null; }
function invalidateRail() { s.tested=false;s.invalid=false;clearTravel(); }
function setRailValue(key,value) {
  const increment=key==='m'?.25:.5;
  const next=Math.round(value/increment)*increment;
  if(s[key]!==next){s[key]=next;invalidateRail();}
  render();
}
function setProbe(value) {
  s.probe=Math.round(value*4)/4;
  if(!needsEquation()||s.tested) {
    s.visitedLow=s.visitedLow===null?s.probe:Math.min(s.visitedLow,s.probe);
    s.visitedHigh=s.visitedHigh===null?s.probe:Math.max(s.visitedHigh,s.probe);
  }
  render();
}
function reset() { Object.assign(s,{mode:'linear',m:1,c:-1,k:-1,probe:0,visitedLow:null,visitedHigh:null,answerM:'',answerC:'',axis:'',answerK:'',tested:false,invalid:false,records:[],comparison:null,helpLevel:0,helpOpen:false}); }
function enter() {
  invalidateRail();Object.assign(s,{probe:0,answerM:'',answerC:'',answerK:'',axis:''});
  const initial=[{m:1,c:-1},{m:.5,c:-1},{m:.5,c:1},{m:.5,c:0},{m:.5,c:-1},{k:-1},{m:.5,c:1,k:0}][step];
  Object.assign(s,initial,{mode:step===5?'vertical':'linear'});
  if(step===6){s.records=[];s.comparison=null;}
  controls();
}
function restoreView() { controls(); }
function inputHtml(id,label) { return `<input type="text" inputmode="text" autocomplete="off" spellcheck="false" id="${id}" aria-label="${label}" placeholder="${id==='gradientInput'?'m':id==='interceptInput'?'c':'value'}" maxlength="20">`; }
function controls() {
  $('context').replaceChildren();$('controls').replaceChildren();$('working').hidden=true;
  if(step===1) workSetup('Read the gradient, then the intercept',workRow('vertical change ÷ horizontal change',workOutput('gradientWork'))+workRow('where x = 0',workOutput('interceptWork')));
  if(needsEquation()) {
    const body=step===5?
      workRow('constant-coordinate equation','<select id="axisInput" aria-label="Constant coordinate"><option value="">Choose x or y</option><option value="x">x</option><option value="y">y</option></select> = '+inputHtml('constantInput','Constant coordinate value')):
      workRow('your equation',`y = ${inputHtml('gradientInput','Predicted gradient m')} x + ${inputHtml('interceptInput','Predicted intercept c')}`);
    workSetup('Predict, then compare',body,step===5?'Choose the coordinate, not the direction of movement.':'Decimals and fractions are accepted, including negative values.',true);
    $('traceWorking').hidden=true; // No supplied numerical substitution in these transfer cases.
    const fields=step===5?[['constantInput','answerK'],['axisInput','axis']]:[['gradientInput','answerM'],['interceptInput','answerC']];
    fields.forEach(([id,key])=>{const input=$(id);input.value=s[key];input.addEventListener(id==='axisInput'?'change':'input',()=>{s[key]=input.value;invalidateRail();render();});});
    workAction('Test equation',()=>{s.invalid=!predictedRail();s.tested=!s.invalid;clearTravel();render();});
  }
  if(step===6) {
    const label=document.createElement('label');label.textContent='Rail ';
    const select=document.createElement('select');select.id='railMode';select.setAttribute('aria-label','Rail orientation');
    select.innerHTML='<option value="linear">Tilt and slide</option><option value="vertical">Vertical</option>';select.value=s.mode;
    select.onchange=()=>{s.mode=select.value;invalidateRail();s.probe=0;controls();render();};label.appendChild(select);$('controls').appendChild(label);
    button('Record reading',()=>{rememberReading({...currentRail(),probe:s.probe,coordinate:railPoint(currentRail(),s.probe)});render();});
    button('Clear readings',clearReadings);
  }
  setHelp(railHints());
}
function railHints() {
  const examples={
    tilt:[{text:'Compare the amber rail with the blue reference at the left and right ends. Does the gap change?',keys:['gap']},{text:'Tilt changes the vertical rise while the horizontal run stays fixed. Parallel rails have the same gradient.',keys:['rise','run']},{text:'A different rail rises 2 units over a run of 4. Its gradient is 2 ÷ 4 = 0.5. Sliding it does not change that ratio.',example:true}],
    equation:[()=>({text:step===3?'Both mounts matter. Your line can pass through B yet miss A. Compare their y-coordinates as x increases.':'The marked points belong to the amber rail. Compare vertical change with horizontal change; then inspect x = 0.',keys:['point-a','point-b','intercept']}),{text:'Gradient is change in y divided by change in x. The intercept is the y-value at x = 0, not the height at any other point.',keys:['rise','run','intercept']},{text:'Different points (0, −1) and (4, 1) give m = (1 − (−1)) ÷ (4 − 0) = 0.5 and c = −1. Their equation is y = 0.5x − 1.',example:true}],
    vertical:[{text:'Move the carriage along the rail and watch the two coordinates. Which one does not change?',keys:['probe-coordinate']},{text:'Vertical travel changes y but not x. A vertical line cannot be written as y = mx + c with a finite gradient.'},{text:'For a different vertical line through (−3, 0) and (−3, 4), every point has x = −3. Its equation is x = −3, not y = −3.',example:true}]
  };
  if(step===0)return examples.tilt;
  if(step===1)return [{text:'P is on the y-axis. Slide moves every point up or down by the same amount.',keys:['point-p','intercept']},examples.tilt[1],examples.tilt[2]];
  if(step===5)return examples.vertical;
  if(step===6)return [{text:'Save a line, then change only Tilt or Slide. The dashed line preserves your saved geometry.'},{text:'The carriage reads actual coordinates. For two nonvertical lines, equal gradients keep their vertical separation constant; equal intercepts alone do not.'}];
  return examples.equation;
}
function updateRailWork() {
  if(step===1) {
    workFormula('gradientWork',`${term('rise',railText(2*s.m))} ÷ ${term('run','2')} = ${result('gradient-result',railText(s.m),'The ratio of vertical to horizontal change sets the direction.')}`);
    workFormula('interceptWork',`c = ${term('intercept',railText(s.c))}`);
  }
  if(!needsEquation())return;
  const prediction=predictedRail();
  const grade=(id,correct)=>{const input=$(id);if(!input)return;input.className=s.tested&&!correct||s.invalid&&!validNumber(input.value)&&railNumber(input.value)===null?'bad':'';input.setAttribute('aria-invalid',String(input.className==='bad'));};
  if(step===5){grade('constantInput',railNumber(s.answerK)===s.k);$('axisInput').setAttribute('aria-invalid',String(s.tested&&s.axis!=='x'||s.invalid&&!s.axis));}
  else {grade('gradientInput',prediction&&Math.abs(prediction.m-s.m)<1e-8);grade('interceptInput',prediction&&Math.abs(prediction.c-s.c)<1e-8);}
  // Route the action through the shared persistent button. Valid equations still need travel evidence.
  const source=$('workActions').querySelector('button');
  source.disabled=!!(s.tested&&prediction&&railSame(prediction,currentRail())&&geometryMatches());
  workState(s.invalid?'bad':'needed');
}
function railFeedback() {
  if(step===6){
    feedback(`${railEquation(currentRail())}. Move the carriage to read another point.`,false,false,'Explore and compare');
    const saved=s.comparison===null?null:s.records[s.comparison];
    table(['Equation','Carriage point'],s.records.map(r=>[railEquation(r),`(${railText(r.coordinate.x)}, ${railText(r.coordinate.y)})`]),true);
    if(saved)comparisonNote(comparisonDescription({equation:railEquation(saved)},{equation:railEquation(currentRail())})+(railParallel(saved,currentRail())?' The lines have the same direction.':' The directions differ.'));
    else comparisonNote('');
    return;
  }
  const geometric=geometryMatches(),prediction=predictedRail();
  if(s.invalid){feedback(step===5?'Choose x or y and enter a finite number.':'Enter both values as numbers or fractions. A denominator cannot be zero.',false,true,'Complete the equation');return;}
  if(needsEquation()&&!s.tested){feedback(step===3||step===4?'Position the rail, enter its equation, then test.':'Enter your equation before comparing it along the rail.',false,false,'Make a prediction');return;}
  if(needsEquation()&&prediction&&!railSame(prediction,currentRail())) {
    const message=step===5?(prediction.mode!=='vertical'?'Your equation draws a horizontal line, but the rail is vertical. Follow which coordinate stays constant.':'Your constant coordinate places a different vertical line. Compare it with the amber rail.'):
      Math.abs(prediction.m-s.m)>1e-8?'The dashed equation and amber rail have different directions. Compare the rise with the run.':'The direction agrees, but the intercept does not. Compare the two lines where x = 0.';
    feedback(message,false,true,'Compare your equation');return;
  }
  if(!geometric){
    const message=step===0?'Turn the Tilt handle. Compare the blue and amber directions.':step===1?'The direction is fixed. Slide the rail until it reaches P.':step===5?'The equation matches your rail, but the rail does not reach P. Slide it and revise the constant.':'Your equation matches the rail, but a mounting point is missed. Adjust the geometry and revise your equation.';
    feedback(message,false,needsEquation(),step===0?'Compare directions':'Check the placement');return;
  }
  if(!comparedBothEnds()){
    feedback(s.mode==='vertical'?'Move the carriage from y = −2 to y = 2. Check that x stays constant.':'Move the carriage to x = −2 and x = 2. Compare the rail at both stops.',false,false,'Check both ends');return;
  }
  const evidence=[
    'The vertical gap is 2 units at both ends. Equal gradients keep these rails parallel.',
    'The rail passes through (0, 2). Its gradient stays 0.5 as its intercept moves to 2.',
    'y = 0.5x + 1 agrees at x = −2 and x = 2. Both representations describe the same straight line.',
    'From A to B, y falls 2 while x increases 4. y = −0.5x + 2 reaches both mounts.',
    'y stays −2 as x changes: m = 0, so the equation simplifies to y = −2.',
    'x stays 2 as y changes. The equation is x = 2; its gradient is undefined, not zero.'
  ][step];
  feedback(evidence,true);
}
start();
