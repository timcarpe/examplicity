<script>
LabDesign.discovery.mount(document.querySelector('.lab-discovery'), runtime => {
  const { $, svg, NS, clamp, fmt, reduced, validNumber, el, text, line, dot, clear, endDraw, point, handle, feedback, head, go, setHelp, rememberReading, clearReadings, comparisonDescription, comparisonNote, button, workRow, workOutput, workSetup, workValue, workState, workAction, table, sourceLabel, explain, term, result, workFormula, workingExplanation, updateConnections, stopConnections, arrive, explanations } = runtime;
  const lesson=[
    {label:'Area',title:'Make the second bar represent 20 pupils.',intro:'The first bar represents 10 pupils. Move the second bar’s top and compare the filled grid cells.'},
    {label:'Width',title:'Give both intervals the same frequency.',intro:'These two groups each contain 20 pupils. Adjust the wider bar without changing its interval.'},
    {label:'Build',title:'Build the whole grouped report.',intro:'Set the four bar heights from the given frequencies. You can work on the intervals in any order.'},
    {label:'Accumulate',title:'Turn the bar areas into a running total.',intro:'Move the three crosses to build a cumulative-frequency graph for the same 60 pupils. Then check it.'},
    {label:'Middle half',title:'Locate the middle half of the journeys.',intro:'Use the ruler to record Q1, the median and Q3. Then calculate the interquartile range in minutes.'},
    {label:'Experiment',title:'Change one group. Compare the whole distribution.',intro:'Adjust a bar, then save the report. Select a saved reading to compare its areas, totals and quartiles.'}
  ];
  const freshReports=[
    {bounds:[0,6,14,23,35,50],counts:[8,14,20,11,7]},
    {bounds:[0,5,12,21,33,48,60],counts:[6,12,18,15,9,8]},
    {bounds:[0,8,17,29,36,47],counts:[12,9,21,8,10]}
  ];
  const s={bounds:[],counts:[],targets:[],sketch:[],selected:1,tested:false,scan:0,qIndex:0,quartiles:[null,null,null],readError:false,iqr:'',iqrChecked:false,records:[],comparison:null,practice:false,practiceIndex:0,practiceStage:'bars',densityAnswer:'',totalAnswer:'',rankAnswer:'',densityChecked:[],totalChecked:[],rankChecked:[],practiceIqr:'',practiceIqrChecked:false};
  let W=900,H=420,mobile=false,step=0,ready=false,maxStep=0;
  function applyScene(scene){({W,H,mobile,step,ready,maxStep}=scene);}
  function reset(){Object.assign(s,{bounds:[],counts:[],targets:[],sketch:[],selected:1,tested:false,scan:0,qIndex:0,quartiles:[null,null,null],readError:false,iqr:'',iqrChecked:false,records:[],comparison:null,practice:false,practiceIndex:0,practiceStage:'bars',densityAnswer:'',totalAnswer:'',rankAnswer:'',densityChecked:[],totalChecked:[],rankChecked:[],practiceIqr:'',practiceIqrChecked:false});}
  function histogramDistribution(boundaries,frequencies){if(!Array.isArray(boundaries)||!Array.isArray(frequencies)||!frequencies.length||boundaries.length!==frequencies.length+1||boundaries.some(x=>!Number.isFinite(x))||frequencies.some(f=>!Number.isFinite(f)||f<0))throw new RangeError('A distribution needs finite boundaries and non-negative frequencies.');const widths=frequencies.map((_,i)=>boundaries[i+1]-boundaries[i]);if(widths.some(w=>w<=0))throw new RangeError('Class boundaries must strictly increase.');const cumulative=[0];for(const f of frequencies)cumulative.push(cumulative.at(-1)+f);return{boundaries:boundaries.slice(),frequencies:frequencies.slice(),widths,densities:frequencies.map((f,i)=>f/widths[i]),cumulative,total:cumulative.at(-1)};}
  function histogramCumulativeAt(data,x){if(!Number.isFinite(x))throw new RangeError('A read-off needs a finite coordinate.');if(x<=data.boundaries[0])return 0;for(let i=0;i<data.frequencies.length;i++){if(x<=data.boundaries[i+1])return data.cumulative[i]+data.frequencies[i]*(x-data.boundaries[i])/data.widths[i];}return data.total;}
  function histogramQuantile(data,fraction){if(!Number.isFinite(fraction)||fraction<0||fraction>1)throw new RangeError('A quantile fraction must be between zero and one.');if(!data.total)return null;if(fraction===0)return data.boundaries[0];const rank=fraction*data.total;for(let i=0;i<data.frequencies.length;i++)if(data.frequencies[i]>0&&rank<=data.cumulative[i+1])return data.boundaries[i]+(rank-data.cumulative[i])/data.densities[i];return data.boundaries.at(-1);}
  function histogramNumber(raw){const value=String(raw).trim().replaceAll('−','-');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(value))return null;const [a,b='1']=value.split('/'),result=Number(a)/Number(b);return Number(b)===0||!Number.isFinite(result)?null:result;}
  function histogramMatches(actual,expected,tolerance=1e-8){return actual.length===expected.length&&actual.every((x,i)=>Math.abs(x-expected[i])<=tolerance);}
  function histData(){return histogramDistribution(s.bounds,s.counts);}function histReport(){return histogramDistribution(s.bounds,s.targets);}function histInterval(i){return `${s.bounds[i]}–${s.bounds[i+1]}`;}function histAllRead(){return s.quartiles.every(x=>x!==null);}function histNumberText(n){return n===null?'not defined':fmt(n,1);}
  function enter(){head(lesson[step].title,lesson[step].intro);s.practice=false;s.bounds=step===0?[0,10,20]:step===1?[0,10,30]:[0,10,20,40,60];s.targets=step===0?[10,20]:step===1?[20,20]:[10,20,20,10];s.counts=step===0?[10,10]:step===1?[20,40]:step===2?[10,10,10,10]:s.targets.slice();Object.assign(s,{selected:step<2?1:0,tested:false,sketch:[0,10,20,30,60],scan:5,qIndex:0,quartiles:[null,null,null],readError:false,iqr:'',iqrChecked:false,densityAnswer:'',totalAnswer:'',rankAnswer:'',densityChecked:[],totalChecked:[],rankChecked:[],practiceIqr:'',practiceIqrChecked:false});if(step===5){s.records=[];s.comparison=null;}controls();}
  function sceneHeight(){return mobile?(step<3?340:500):(step<3?340:500);}
  function startPractice(){const report=freshReports[s.practiceIndex%freshReports.length];s.practiceIndex=(s.practiceIndex+1)%freshReports.length;s.practice=true;s.practiceStage='bars';s.comparison=null;$('records').hidden=true;comparisonNote('');s.bounds=report.bounds.slice();s.targets=report.counts.slice();s.counts=report.counts.map(()=>0);const total=report.counts.reduce((a,b)=>a+b,0),n=report.counts.length;s.sketch=[0,...report.counts.slice(0,-1).map((_,i)=>Math.round(total*(i+1)/n)),total];s.selected=0;s.tested=false;s.scan=0;s.qIndex=0;s.quartiles=[null,null,null];s.readError=false;s.densityAnswer='';s.totalAnswer='';s.rankAnswer='';s.densityChecked=report.counts.map(()=>false);s.totalChecked=Array(n+1).fill(false);s.totalChecked[0]=true;s.totalChecked[n]=true;s.rankChecked=[false,false,false];s.practiceIqr='';s.practiceIqrChecked=false;controls();render();}
  function practiceBoundaryTargets(){const report=histReport();return report.cumulative;}
  function setHistFrequency(i,frequency){const maximum=3*(s.bounds[i+1]-s.bounds[i]),next=Math.round(clamp(frequency,0,maximum));if(next!==s.counts[i]){s.counts[i]=next;s.tested=false;if(s.practice)s.densityChecked[i]=false;}s.selected=i;if(s.practice)s.densityAnswer=fmt(next/(s.bounds[i+1]-s.bounds[i]),2);render();}
  function setHistTotal(i,value){const next=Math.round(clamp(value,s.sketch[i-1],s.sketch[i+1]));if(next!==s.sketch[i]){s.sketch[i]=next;s.tested=false;if(s.practice)s.totalChecked[i]=false;}s.selected=i-1;if(s.practice)s.totalAnswer=String(next);render();}
  function setHistScan(value){const next=Math.round(clamp(value,0,s.bounds.at(-1))*2)/2,wasAllRead=histAllRead();if(next!==s.scan){s.scan=next;s.readError=false;if(step===4||s.practice&&s.practiceStage==='quartiles'){s.quartiles[s.qIndex]=null;if(!s.practice)s.iqrChecked=false;}}if(!s.practice&&step===4&&wasAllRead&&!histAllRead())controls();render();}
  function recordHistQuartile(){const data=histData(),rank=data.total*(s.qIndex+1)/4,wasAllRead=histAllRead();if(s.practice&&!s.rankChecked[s.qIndex]){controls();feedback('Check this quartile rank before recording the read-off.',false,true,'Calculate the rank');return;}s.readError=Math.abs(histogramCumulativeAt(data,s.scan)-rank)>.55;if(!s.readError){s.quartiles[s.qIndex]=s.scan;if(!s.practice)s.iqrChecked=false;const next=s.quartiles.findIndex(x=>x===null);if(next!==-1){s.qIndex=next;if(s.practice)controls();}else if(s.practice){s.practiceStage='iqr';s.practiceIqr='';s.practiceIqrChecked=false;controls();}else if(step===4&&!wasAllRead)controls();}render();}
  function practiceSelectors(){const host=document.createElement('div');host.className='practice-step';const count=s.practiceStage==='bars'?s.bounds.length-1:s.practiceStage==='totals'?s.bounds.length-2:3;for(let i=0;i<count;i++){const index=s.practiceStage==='totals'?i+1:i,b=button(s.practiceStage==='bars'?`Group ${index+1}`:s.practiceStage==='totals'?`Boundary ${s.bounds[index]}`:['Q1','Median','Q3'][i],()=>{s.selected=s.practiceStage==='totals'?index-1:index;s.qIndex=s.practiceStage==='quartiles'?i:s.qIndex;if(s.practiceStage==='bars')s.densityAnswer=fmt(s.counts[index]/(s.bounds[index+1]-s.bounds[index]),2);if(s.practiceStage==='totals')s.totalAnswer=String(s.sketch[index]);if(s.practiceStage==='quartiles')s.rankAnswer='';controls();render();},{'aria-pressed':String(s.practiceStage==='quartiles'?s.qIndex===i:s.selected===index)});host.appendChild(b);}return host;}
  function setupPracticeControls(){
    const report=histReport(),i=s.practiceStage==='totals'?s.selected+1:s.selected;
    if(s.practiceStage==='bars'){workSetup('Frequency density',workRow(`group ${i+1}: frequency ÷ width`,`<input id="practiceDensity" type="text" inputmode="decimal" aria-label="Frequency density for group ${i+1}"> pupils/min`)+workRow('model check',workOutput('histogramWork')),'Enter density, then check the bar area. Each checked density owns one bar.',true);const input=$('practiceDensity');input.value=s.densityAnswer;input.oninput=e=>{s.densityAnswer=e.target.value;s.densityChecked[i]=false;render();};workAction('Check density',()=>{const value=histogramNumber(s.densityAnswer),expected=s.targets[i]/(s.bounds[i+1]-s.bounds[i]);s.densityChecked[i]=value!==null&&Math.abs(value-expected)<.011;if(s.densityChecked[i])s.counts[i]=s.targets[i];render();});$('controls').append(practiceSelectors());return;}
    if(s.practiceStage==='totals'){workSetup('Cumulative total',workRow(`through ${s.bounds[i]} min`,`<input id="practiceTotal" type="number" min="0" step="1" inputmode="numeric" aria-label="Cumulative total at ${s.bounds[i]} minutes"> pupils`)+workRow('model check',workOutput('histogramWork')),'Include every group to the left. The last total is the report total.',true);const input=$('practiceTotal');input.value=s.totalAnswer||s.sketch[i];input.oninput=e=>{s.totalAnswer=e.target.value;s.totalChecked[i]=false;render();};workAction('Check total',()=>{const value=Number(s.totalAnswer),expected=report.cumulative[i];s.totalChecked[i]=Number.isFinite(value)&&Math.abs(value-expected)<.01;if(s.totalChecked[i])s.sketch[i]=expected;render();});$('controls').append(practiceSelectors());return;}
    if(s.practiceStage==='quartiles'){const rank=report.total*(s.qIndex+1)/4;workSetup('Quartile rank',workRow(['Q1','Median','Q3'][s.qIndex],`<input id="practiceRank" type="number" min="0" step="1" inputmode="numeric" aria-label="${['Q1','Median','Q3'][s.qIndex]} rank"> pupils`)+workRow('model check',workOutput('histogramWork')),'Calculate the rank from the total before moving the ruler.',true);const input=$('practiceRank');input.value=s.rankAnswer;const action=workAction(s.rankChecked[s.qIndex]?'Record estimate':'Check rank',()=>{if(s.rankChecked[s.qIndex]){recordHistQuartile();return;}const value=Number(s.rankAnswer);s.rankChecked[s.qIndex]=Number.isFinite(value)&&Math.abs(value-rank)<.01;controls();render();});input.oninput=e=>{s.rankAnswer=e.target.value;s.rankChecked[s.qIndex]=false;action.textContent='Check rank';render();};$('controls').append(practiceSelectors());return;}
    if(s.practiceStage==='iqr'){workSetup('Interquartile range',workRow('Q3 − Q1',`<input id="practiceIqr" type="text" inputmode="decimal" aria-label="Interquartile range"> min`)+workRow('model check',workOutput('histogramWork')),'Use your recorded outer read-offs. The result is an estimate.',true);const input=$('practiceIqr');input.value=s.practiceIqr;input.oninput=e=>{s.practiceIqr=e.target.value;s.practiceIqrChecked=false;render();};workAction('Check range',()=>{const value=histogramNumber(s.practiceIqr),expected=s.quartiles[2]-s.quartiles[0];s.practiceIqrChecked=value!==null&&Math.abs(value-expected)<.11;if(s.practiceIqrChecked){s.practiceStage='done';controls();}render();});return;}
    workSetup('Fresh report complete',workRow('Q3 − Q1',workOutput('histogramWork')),'Save this report to compare it, or try a new set of grouped data.');workAction('Save report',()=>{rememberReading({bounds:s.bounds.slice(),counts:s.counts.slice()});render();});workAction('New report',startPractice,{'data-lab-action':'new-report','data-repeatable':'true'});
  }
  function controls(){const c=$('controls');c.replaceChildren();$('working').hidden=true;if(step<4){workSetup(step===3?'Same pupils, a different representation':'Your report',workRow(step===3?'selected interval':'evidence',workOutput('histogramWork')));workAction(step===3?'Check totals':'Check bars',()=>{s.tested=true;render();});}else if(step===4){const readings=['Q1','Median','Q3'].map((name,i)=>`<button type="button" class="lab-action" data-quantile="${i}" aria-pressed="${s.qIndex===i}"><span>${name}</span><span id="qReading${i}">Not recorded</span></button>`).join('');workSetup('Recorded estimates',`<div class="hist-readings">${readings}</div><div class="hist-range"><label for="iqrInput">Interquartile range</label><input type="text" inputmode="decimal" autocomplete="off" maxlength="20" id="iqrInput" aria-label="Interquartile range in minutes"><span>min</span></div>`,'Read-offs inside a group are estimates. Use your recorded Q3 and Q1.');$('iqrInput').value=s.iqr;$('iqrInput').oninput=e=>{s.iqr=e.target.value;s.iqrChecked=false;render();};$('working').querySelectorAll('[data-quantile]').forEach(b=>b.onclick=()=>{s.qIndex=Number(b.dataset.quantile);if(s.quartiles[s.qIndex]!==null)s.scan=s.quartiles[s.qIndex];s.readError=false;render();});if(histAllRead())workAction('Check range',()=>{s.iqrChecked=String(s.iqr).trim()!=='';render();});else workAction('Record estimate',recordHistQuartile);}else if(s.practice){setupPracticeControls();}else{workSetup('Linked evidence',workRow('selected interval',workOutput('histogramWork')),'Between boundaries, the cumulative line assumes constant density. It is not a record of individual journey times.');workAction('Save report',()=>{rememberReading({bounds:s.bounds.slice(),counts:s.counts.slice()});render();});workAction('New report',startPractice,{'data-lab-action':'new-report','data-repeatable':'true'});if(s.records.length)workAction('Clear readings',clearReadings);}setHelp(histHints());}
  function histHints(){if(s.practice){if(s.practiceStage==='bars')return[{text:'Divide each given frequency by its interval width. The wider intervals need lower density for the same area.',keys:['bar-area','density']}];if(s.practiceStage==='totals')return[{text:'A cumulative total includes every group to the left. A rise between two boundaries equals one bar area.',keys:['cumulative-rise']}];if(s.practiceStage==='quartiles')return[{text:'Q1, the median and Q3 are 25%, 50% and 75% of the total. Check the rank, then place the ruler.',keys:['read-time','read-total']}];return[{text:'Subtract your Q1 read-off from your Q3 read-off. Grouped read-offs are estimates.'}];}if(step<3)return[{text:'Count the filled area, not just the height. A full grid cell represents 5 pupils; part of a cell represents part of that amount.',keys:['bar-area']},{text:'Width is measured in minutes; height is pupils per minute. Multiplying them gives pupils.',keys:['class-width','density']},{text:'Different example: 30 pupils spread over a 15-minute interval need a density of 30 ÷ 15 = 2 pupils per minute.',example:true}];if(step===3)return[{text:'A cross includes this interval and every interval to its left. Compare the rise between two crosses with the area of the bar above.',keys:['bar-area','cumulative-rise']},{text:'Cumulative totals never decrease. The last total includes all 60 pupils.'}];if(step===4)return[{text:'Follow the horizontal target rank to the cumulative line, then read down to the time axis.',keys:['read-time','read-total']},{text:'Q1 is at 25% of the total, the median at 50%, and Q3 at 75%. The interquartile range is Q3 minus Q1.'}];return[{text:'Save the report before changing a bar. Dashed outlines retain saved areas and cumulative totals on the same axes.'},{text:'Changing one bar changes its frequency and every later cumulative total.'}];}
  function histLayout(){const left=mobile?42:Math.max(62,(W-820)/2),right=mobile?W-18:W-left,top=step<3?64:54,bottom=step<3?250:198;return{left,right,top,bottom,x:value=>left+value/s.bounds.at(-1)*(right-left),y:value=>bottom-value/3*(bottom-top),cfTop:304,cfBottom:436};}
  function histPolyline(data,values,L,max){return values.map((value,i)=>`${i?'L':'M'}${L.x(data.boundaries[i])} ${L.cfBottom-value/max*(L.cfBottom-L.cfTop)}`).join(' ');}
  function histGrid(L){if(step<3&&!s.practice)text(L.left,48,'Density / pupils per min','small');for(let v=0;v<=3;v++){line(L.left,L.y(v),L.right,L.y(v),{class:'hist-grid'});text(L.left-10,L.y(v)+4,String(v),'small','end');}for(let v=0;v<=s.bounds.at(-1);v+=5)line(L.x(v),L.top,L.x(v),L.bottom,{class:'hist-grid'});line(L.left,L.top,L.left,L.bottom,{class:'hist-axis'});line(L.left,L.bottom,L.right,L.bottom,{class:'hist-axis'});for(const value of s.bounds)text(L.x(value),L.bottom+21,String(value),'small','middle');}
  function histBar(i,data,L,editable,saved=false){const x=L.x(data.boundaries[i]),width=L.x(data.boundaries[i+1])-x,y=L.y(data.densities[i]),group=el('g',{'data-histogram-bar':i});el('rect',{x,y,width,height:L.bottom-y,class:saved?'comparison-ghost':'hist-bar'},undefined,group);if(saved)return;for(let v=data.boundaries[i]+5;v<data.boundaries[i+1];v+=5)line(L.x(v),y,L.x(v),L.bottom,{class:'hist-cell'},group);for(let d=1;d<data.densities[i];d++)line(x,L.y(d),x+width,L.y(d),{class:'hist-cell'},group);const topLabel=step<3?L.bottom+51:L.bottom+44;if(mobile&&(s.practice||step<3)){text(x+width/2,topLabel,'Given','small','middle',group);text(x+width/2,topLabel+13,String(s.targets[i]),'small','middle',group);}else text(x+width/2,topLabel,s.practice||step<3?`Given ${s.targets[i]}`:`${data.frequencies[i]} pupils`,'small','middle',group);if(editable){const tap=el('rect',{x,y:L.top,width,height:L.bottom-L.top,fill:'transparent',class:'hist-tap','data-set-bar':i},undefined,group);tap.onclick=e=>{if(e.detail>1)return;const p=point(e);setHistFrequency(i,(L.bottom-p.y)/(L.bottom-L.top)*3*data.widths[i]);};const control=handle('hist-bar-'+i,x+width/2,y,{label:`Frequency density for ${histInterval(i)} minutes`,min:0,max:3,value:data.densities[i],valueText:`${fmt(data.densities[i],2)} pupils per minute; area ${data.frequencies[i]} pupils`,increment:1/data.widths[i],set:value=>setHistFrequency(i,value*data.widths[i]),fromPoint:p=>(L.bottom-p.y)/(L.bottom-L.top)*3,help:'Drag this bar top, use the arrow keys, or tap inside its column to set the height. The interval width stays fixed.'});control.setAttribute('aria-orientation','vertical');}const wrong=!s.practice&&step<3&&s.tested&&data.frequencies[i]!==s.targets[i];if(wrong){el('rect',{x:x+1,y:y+1,width:Math.max(0,width-2),height:Math.max(0,L.bottom-y-2),class:'hist-error-outline'},undefined,group);text(x+width/2,topLabel+18,'×','hist-error','middle',group);}}
  function histQuantityLabels(data,L){const i=s.selected;if(step===0&&!s.tested&&!s.practice){text((L.left+L.right)/2,29,'One full grid cell represents 5 pupils','small','middle');return;}if(step===2&&!s.practice){text((L.left+L.right)/2,29,'Frequency density / pupils per minute','small','middle');return;}sourceLabel('bar-area',L.left,26,`${histInterval(i)} min: ${s.practice?s.targets[i]:data.frequencies[i]} pupils`,'This frequency is the selected bar’s area, not its height.','small');sourceLabel('density',L.right,26,`Height ${fmt(data.densities[i],2)}`,`Frequency density is ${fmt(data.densities[i],2)} pupils per minute. Multiplying by the interval width gives its frequency.`,'small','end');sourceLabel('class-width',step<3?L.right:(L.left+L.right)/2,step<3?325:275,`Width ${data.widths[i]} min`,'The upper boundary minus the lower boundary gives the width of the selected interval.','small',step<3?'end':'middle');}
  function histCumulative(data,L,savedData){const report=histReport(),practiceTotals=s.practice&&s.practiceStage==='totals',maximum=step===3||step===4||s.practice?Math.max(report.total,60):Math.max(60,Math.ceil(Math.max(data.total,savedData?.total||0)/20)*20),cy=value=>L.cfBottom-value/maximum*(L.cfBottom-L.cfTop);text(L.left,292,'Cumulative frequency / pupils','small');for(let j=0;j<=4;j++){const value=maximum*j/4;line(L.left,cy(value),L.right,cy(value),{class:'hist-grid'});text(L.left-10,cy(value)+4,fmt(value,1),'small','end');}for(const value of s.bounds){line(L.x(value),L.cfTop,L.x(value),L.cfBottom,{class:'hist-grid'});text(L.x(value),L.cfBottom+21,String(value),'small','middle');}line(L.left,L.cfTop,L.left,L.cfBottom,{class:'hist-axis'});line(L.left,L.cfBottom,L.right,L.cfBottom,{class:'hist-axis'});if(savedData)el('path',{d:histPolyline(savedData,savedData.cumulative,L,maximum),class:'comparison-ghost','data-saved-curve':'true'});if(practiceTotals)el('path',{d:histPolyline(report,report.cumulative,L,maximum),class:'comparison-ghost','data-report-curve':'true'});else el('path',{d:histPolyline(s.practice?report:data,s.practice?report.cumulative:data.cumulative,L,maximum),class:'hist-curve','data-report-curve':'true'});if(step===3||practiceTotals){const sketch=s.sketch;el('path',{d:histPolyline(data,sketch,L,maximum),class:'hist-sketch'});const strip=el('g');for(let i=1;i<sketch.length-1;i++){const x=L.x(s.bounds[i]),target=el('rect',{x:x-20,y:L.cfTop,width:40,height:L.cfBottom-L.cfTop,fill:'transparent',class:'hist-tap','data-set-total':i},undefined,strip);target.onclick=e=>{if(e.detail>1)return;setHistTotal(i,(L.cfBottom-point(e).y)/(L.cfBottom-L.cfTop)*maximum);};}for(let i=1;i<sketch.length-1;i++){const x=L.x(s.bounds[i]),y=cy(sketch[i]),control=handle('hist-total-'+i,x,y,{label:`Cumulative frequency at ${s.bounds[i]} minutes`,min:sketch[i-1],max:sketch[i+1],value:sketch[i],valueText:`${sketch[i]} pupils accumulated`,increment:1,set:value=>setHistTotal(i,value),fromPoint:p=>(L.cfBottom-p.y)/(L.cfBottom-L.cfTop)*maximum,help:'Move this cross vertically, or tap above or below it. Include every interval to the left. Neighbouring totals keep the sketch non-decreasing.'});control.setAttribute('aria-orientation','vertical');line(x-5,y-5,x+5,y+5,{class:'hist-cross','pointer-events':'none'});line(x-5,y+5,x+5,y-5,{class:'hist-cross','pointer-events':'none'});}sourceLabel('cumulative-rise',L.right,275,`${sketch[s.selected+1]-sketch[s.selected]}`,'Subtract the previous total from the next total to find the pupils added by this interval.','small','end');text(L.right,484,s.tested?'Solid: report · dashed: your totals':'Dashed: your running totals','small','end');}if(step===4||s.practice&&s.practiceStage==='quartiles'||s.practice&&s.practiceStage==='iqr')histRuler(data,L,cy);}
  function histRuler(data,L,cy){const isPractice=s.practice&&(s.practiceStage==='quartiles'||s.practiceStage==='iqr'),x=L.x(s.scan),current=histogramCumulativeAt(data,s.scan),rank=data.total*(s.qIndex+1)/4;line(L.left,cy(rank),L.right,cy(rank),{class:'hist-rank'});text(L.right,cy(rank)-7,`${['Q1','Median','Q3'][s.qIndex]}: ${rank} pupils`,'small','end');if(!isPractice&&step===4){for(let i=0;i<data.frequencies.length;i++){const lower=histAllRead()?s.quartiles[0]:data.boundaries[0],upper=histAllRead()?s.quartiles[2]:s.scan,left=L.x(Math.max(lower,data.boundaries[i])),right=L.x(Math.min(upper,data.boundaries[i+1]));if(right>left)el('rect',{x:left,y:L.y(data.densities[i]),width:right-left,height:L.bottom-L.y(data.densities[i]),class:'hist-estimate-shade','data-middle-half':String(histAllRead())});}}const area=el('rect',{x:L.left,y:L.cfTop,width:L.right-L.left,height:L.cfBottom-L.cfTop,fill:'transparent',class:'hist-tap','data-set-ruler':'true'});area.onclick=e=>{if(e.detail>1)return;setHistScan((point(e).x-L.left)/(L.right-L.left)*s.bounds.at(-1));};line(x,L.top,x,L.cfBottom,{class:'hist-ruler','pointer-events':'none'});dot(x,cy(current),5,{class:'hist-read-dot','pointer-events':'none'});const control=handle('hist-ruler',x,L.cfBottom,{label:'Journey-time read-off ruler',min:0,max:s.bounds.at(-1),value:s.scan,valueText:`${fmt(s.scan,1)} minutes, ${fmt(current,1)} pupils accumulated`,increment:.5,set:setHistScan,fromPoint:p=>(p.x-L.left)/(L.right-L.left)*s.bounds.at(-1),help:'Move the ruler horizontally, use arrow keys, or tap the cumulative graph at a journey time.'});control.setAttribute('aria-orientation','horizontal');sourceLabel('read-time',L.left,484,`${fmt(s.scan,1)} min`,'This is an estimated journey time read from the horizontal axis.','small');sourceLabel('read-total',L.right,484,`${fmt(current,1)} pupils`,'The cumulative value at the ruler includes all histogram area to its left.','small','end');if(histAllRead()){const prediction=histogramNumber(s.practice?s.practiceIqr:s.iqr),q1=s.quartiles[0],q3=s.quartiles[2],end=(s.practice?s.practiceIqrChecked:s.iqrChecked)&&prediction!==null?q1+prediction:q3,a=L.x(q1),b=L.x(clamp(end,0,s.bounds.at(-1))),y=256;line(a,y,b,y,{class:'hist-bracket'});line(a,y-5,a,y+5,{class:'hist-bracket'});line(b,y-5,b,y+5,{class:'hist-bracket'});line(L.x(q3),y-8,L.x(q3),y+8,{class:'hist-rank'});}}
  function updateHistWork(){const data=histData(),i=s.selected;if(s.practice){if(s.practiceStage==='bars')workFormula('histogramWork',`${histInterval(i)} min: ${s.targets[i]} pupils ÷ ${data.widths[i]} min = ${fmt(s.targets[i]/data.widths[i],2)} pupils/min`);if(s.practiceStage==='totals'){const j=i+1;workFormula('histogramWork',`Through ${s.bounds[j]} min: ${data.cumulative[j]} pupils.`);}if(s.practiceStage==='quartiles')workFormula('histogramWork',`${['Q1','Median','Q3'][s.qIndex]} rank = ${data.total} × ${(s.qIndex+1)}/4 = ${data.total*(s.qIndex+1)/4} pupils.`);if(s.practiceStage==='iqr'||s.practiceStage==='done')workFormula('histogramWork',`IQR ≈ ${fmt(s.quartiles[2],1)} − ${fmt(s.quartiles[0],1)}${s.practiceStage==='done'?` = ${fmt(s.quartiles[2]-s.quartiles[0],1)}`:''} min.`);return;}if(step===4){const all=histAllRead();for(let j=0;j<3;j++){$(`qReading${j}`).textContent=s.quartiles[j]===null?'Not recorded':`≈ ${histNumberText(s.quartiles[j])} min`;$('working').querySelector(`[data-quantile="${j}"]`).setAttribute('aria-pressed',String(j===s.qIndex));}$('iqrInput').className=s.iqrChecked&&histogramNumber(s.iqr)!==null?'good':'';return;}if(step===0&&!s.tested){workFormula('histogramWork','Given: 10 pupils in 0–10 min; 20 pupils in 10–20 min.');return;}if(step===2){workFormula('histogramWork',`Your bar areas total ${data.total} pupils. The given report contains 60.`);return;}if(step===3){workFormula('histogramWork',`${histInterval(i)} min: bar area ${term('bar-area',data.frequencies[i])}; your cumulative rise ${term('cumulative-rise',s.sketch[i+1]-s.sketch[i])} pupils.`);return;}workFormula('histogramWork',`${term('class-width',data.widths[i])} min × ${term('density',fmt(data.densities[i],2))} pupils/min = ${term('bar-area',data.frequencies[i])} pupils`);}
  function histogramFeedback(){const data=histData(),report=histReport();if(s.practice){if(s.practiceStage==='bars'){const done=s.densityChecked.every(Boolean)&&histogramMatches(s.counts,s.targets);feedback(done?'Every density has the required bar area. Continue to cumulative totals.':'Enter and check the density for each unequal-width group.',false,false,'Own each bar area');if(done){s.practiceStage='totals';s.selected=0;s.totalAnswer='';controls();render();}return;}if(s.practiceStage==='totals'){const done=s.totalChecked.slice(1,-1).every(Boolean)&&histogramMatches(s.sketch,report.cumulative);feedback(done?'The cumulative totals reproduce each bar area. Continue to quartile ranks.':'Check each running total, including all groups to its left.',false,false,'Own the running totals');if(done){s.practiceStage='quartiles';s.qIndex=0;s.scan=0;s.rankAnswer='';controls();render();}return;}if(s.practiceStage==='quartiles'){if(s.readError){feedback(`The ruler currently reads ${fmt(histogramCumulativeAt(data,s.scan),1)} pupils; revise it to the ${['Q1','median','Q3'][s.qIndex]} rank.`,false,true,'Compare the read-off');return;}feedback(s.rankChecked[s.qIndex]?`Place the ruler at ${['Q1','median','Q3'][s.qIndex]} and record the estimate.`:`Calculate ${['Q1','median','Q3'][s.qIndex]} as ${data.total} × ${(s.qIndex+1)}/4 before recording.`,false,false,'Read across, then down');return;}if(s.practiceStage==='iqr'){const value=histogramNumber(s.practiceIqr),answer=s.quartiles[2]-s.quartiles[0];feedback(s.practiceIqrChecked&&value!==null&&Math.abs(value-answer)<.11?'The fresh report is complete: bars, cumulative totals, quartiles and IQR all agree.':`Use Q3 − Q1 for the middle-half range (about ${fmt(answer,1)} min).`,s.practiceIqrChecked&&value!==null&&Math.abs(value-answer)<.11,false,'Calculate the middle-half range');return;}if(s.practiceStage==='done'){feedback('The fresh report is complete: bars, cumulative totals, quartiles and IQR all agree.',true);table(['Frequencies','Total','Median / min'],s.records.map(record=>{const d=histogramDistribution(record.bounds,record.counts);return[record.counts.join(', '),d.total,histNumberText(histogramQuantile(d,.5))];}),true);return;}return;}
    if(step<3){const ok=s.tested&&histogramMatches(s.counts,s.targets),first=s.counts.findIndex((f,i)=>f!==s.targets[i]);if(ok){feedback(step===1?'The 10-minute and 20-minute groups both have area 20. The wider bar is half as high.':step===0?'The second bar contains four full grid cells; the first contains two. Each cell represents 5 pupils.':'The two 20-pupil groups have equal areas, even though their widths and heights differ.',true);return;}if(s.tested&&first!==-1){feedback(`The ${histInterval(first)} min bar represents ${s.counts[first]} pupils; its given frequency is ${s.targets[first]}. Revise its area.`,false,true,'Compare the areas');return;}feedback(step===1?'Both bars start at the same height. Does the wider bar contain the same area?':'The bar responds immediately. Check when its area matches the given frequency.',false,false,'Build and inspect');return;}
    if(step===3){const ok=s.tested&&histogramMatches(s.sketch,report.cumulative),first=s.sketch.findIndex((f,i)=>f!==report.cumulative[i]);if(ok){feedback('The cumulative rises are 10, 20, 20 and 10 pupils: exactly the four bar areas. The last total is 60.',true);return;}if(s.tested){feedback(`At ${s.bounds[first]} min your sketch reaches ${s.sketch[first]} pupils. Compare it with the report line and the areas to the left.`,false,true,'A group count is not a running total');return;}feedback('Move each cross vertically. Its height includes every group already passed; the final 60 is fixed.',false,false,'Construct the totals');return;}
    if(step===4){const names=['Q1','median','Q3'],rank=data.total*(s.qIndex+1)/4;if(s.readError){feedback(`Your ruler is at ${fmt(histogramCumulativeAt(data,s.scan),1)} pupils. The ${names[s.qIndex]} rank is ${rank}. Use the graph to revise the position.`,false,true,'Compare the read-off');return;}if(!histAllRead()){feedback(`Record ${names[s.qIndex]} at cumulative frequency ${rank}. The ruler currently reads ${fmt(s.scan,1)} min.`,false,false,'Read across, then down');return;}if(!s.iqrChecked){feedback('All three estimates are recorded. Enter the distance from Q1 to Q3, in minutes.',false,false,'Calculate the middle-half range');return;}const value=histogramNumber(s.iqr),answer=s.quartiles[2]-s.quartiles[0];if(value===null){feedback('Use a finite number or fraction for the range. A denominator cannot be zero.',false,true,'Check the range entry');return;}if(Math.abs(value-answer)>.11){feedback(`Your bracket starts at Q1 but ends at ${fmt(s.quartiles[0]+value,1)} min. It must reach your Q3 estimate.`,false,true,'Compare the bracket');return;}feedback(`Q1 ≈ ${fmt(s.quartiles[0],1)} min and Q3 ≈ ${fmt(s.quartiles[2],1)} min. Their difference is about ${fmt(answer,1)} min. Grouped data do not give exact individual times.`,true);return;}
    feedback(data.total?`There are now ${data.total} pupils. The median estimate is ${fmt(histogramQuantile(data,.5),1)} min.`:'With no pupils, the cumulative graph is flat and quartiles are undefined. Add frequency to a bar.',false,false,'Explore and compare');table(['Frequencies','Total','Median / min'],s.records.map(record=>{const d=histogramDistribution(record.bounds,record.counts);return[record.counts.join(', '),d.total,histNumberText(histogramQuantile(d,.5))];}),true);const saved=s.comparison===null?null:s.records[s.comparison];comparisonNote(saved?comparisonDescription({frequencies:saved.counts.join(', ')},{frequencies:s.counts.join(', ')})+` Both plots use the same axes; saved counts are not normalised. Saved boundaries: ${saved.bounds.join(', ')} min; current boundaries: ${s.bounds.join(', ')} min.`:'');}
  function render(){clear();head(s.practice?'Fresh grouped report':lesson[step].title,s.practice?'Build a new unequal-width report, then own its densities, running totals, quartile ranks and IQR.':lesson[step].intro);const data=histData(),L=histLayout(),saved=s.comparison===null||s.practice?null:s.records[s.comparison],savedData=saved?histogramDistribution(saved.bounds,saved.counts):null;histGrid(L);const activeLeft=L.x(s.bounds[s.selected]),activeRight=L.x(s.bounds[s.selected+1]);if(step>=3||s.practice)el('rect',{x:activeLeft,y:L.top,width:activeRight-activeLeft,height:L.bottom-L.top,class:'hist-interval-highlight'});const editable=s.practice?s.practiceStage==='bars':step===0||step===1?true:step===2;for(let i=0;i<data.frequencies.length;i++)histBar(i,data,L,editable&&(!s.practice||s.practiceStage==='bars')&&(step<2?i===1:true));if(savedData)for(let i=0;i<savedData.frequencies.length;i++)histBar(i,savedData,L,false,true);histQuantityLabels(data,L);if(step>=3||s.practice)histCumulative(data,L,savedData);if(step<3&&!s.practice)text(L.left,L.bottom+77,'Journey time / min','small');updateHistWork();histogramFeedback();endDraw();}
  function restoreView(){controls();}
