  function controls(){const c=$('controls');c.replaceChildren();if(step!==6)return;const label=document.createElement('label');label.textContent='View ';const view=document.createElement('select');view.id='mathView';view.setAttribute('aria-label','Model view');for(const [value,name] of [['length','Length'],['face','Square'],['solid','Solid']]){const option=document.createElement('option');option.value=value;option.textContent=name;view.appendChild(option);}view.value=s.view;view.onchange=()=>{s.view=view.value;controls();render();};label.appendChild(view);c.appendChild(label);if(s.view==='solid')button(s.separate?'Join layers':'Separate layers',()=>{s.separate=!s.separate;controls();render();if(!reduced.matches)svg.querySelectorAll('[data-layer]').forEach(node=>node.animate([{transform:`translateY(${Number(node.dataset.layer)*(s.separate?10:-10)}px)`},{transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.2,.7,.25,1)'}));},{class:'choice','aria-pressed':s.separate});button('Record reading',()=>{const k=s.k,h=s.stretch?s.height:k;rememberReading([k,h,k*k,k*k*h]);controls();render();},{'data-lab-action':'record-reading'});button('New target',()=>{s.stretch=false;s.view='solid';const ks=[1.5,4,5,.5],n=(s.target?.index??-1)+1,k=ks[n%ks.length];s.target={kind:n%2?'volume':'area',value:n%2?k**3:k*k,index:n};s.targetAnswer='';s.targetTested=false;controls();render();},{'data-lab-action':'new-target'});if(s.records.length)button('Clear readings',()=>{s.records=[];s.comparison=null;controls();render();},{'data-lab-action':'clear-readings'});setupTargetWork();}
  function restoreView(){if(step===6)controls();setupMathWork();}
  function setupMathWork(){if(step===6){$('working').hidden=true;setHelp([]);if(s.target)setupTargetWork();return;}if(step===0)workSetup('Length scale factor',workRow('new length ÷ reference length',workOutput('lengthWork')));if(step===1)workSetup('Area factor',workRow('two scaled directions',workOutput('areaWork')));if(step===2)workSetup('Volume factor',workRow('unit cubes in one layer',workOutput('layerWork'))+workRow('cubes per layer × layers',workOutput('volumeWork')));if(step===3||step===4){const expression=step===3?`k = √(${term('target-factor',9)}) = `:'k = ';workSetup('Your prediction',workRow('length scale factor',`${expression}<input id="scaleAnswer" type="number" min="0.1" max="5" step="0.1" inputmode="decimal" aria-label="Predicted length scale factor">`),step===4?'A scale factor has no units; the edge length is a different quantity.':'Resizing changes the actual square. The prediction is checked only when you test.',true);$('scaleAnswer').value=s.answer;$('scaleAnswer').oninput=e=>{s.answer=e.target.value;s.tested=false;render();};workAction('Test prediction',()=>{if(!validNumber(s.answer)||Number(s.answer)<=0){feedback('Enter a positive scale factor before testing.',false,true);return;}s.tested=true;render();});}if(step===5)workSetup('Corresponding edge ratios',workRow('width',workOutput('widthWork'))+workRow('height',workOutput('heightWork'))+workRow('depth',workOutput('depthWork')));workingExplanation(step===4?'Predict a common length scale factor, not the new edge length.':'Compare corresponding lengths. Count the two directions in a face and the three directions in a solid.');setHelp(step===3||step===4?[()=>({text:step===4&&validNumber(s.answer)&&Math.abs(Number(s.answer)-s.k*2)<.01?'Your prediction matches an edge length. Compare that edge with the 2-unit original.':step===4?'The original cube is not one cubic unit. Inspect its edge and volume before comparing.':'The face grows in two perpendicular directions. Count rows as well as columns.',keys:step===4?['reference-edge','reference-volume','new-edge']:['edge','area-count']}),{text:step===4?'Compare new volume with original volume. Reverse the three-direction relationship to get the common edge ratio.':'A square root reverses an area factor. The model should agree with your chosen factor.'},{example:true,text:step===4?'Another case: a 3-unit cube has volume 27. A new volume of 729 is 27 times as large; its edge ratio is ∛27 = 3 and its edge is 9 units.':'Another case: an area factor of 16 means the common length factor is √16 = 4.'}]:step===0?[{text:'Use the fixed grey line as your reference. Only the blue endpoint moves.',keys:['reference','length']}]:step===1?[{text:'Each small square has the same area as the reference. Count both rows.',keys:['reference-area','area-count']}]:step===2?[{text:'Count the cubes in one layer, then the number of layers.',keys:['layer-edge','layers']}]:step===5?[{text:'Compare all three edge ratios, not the overall height of the drawing.',keys:['width','height','depth']}]:[]);}
  function updateMathWork(){if(step===0)workFormula('lengthWork',`${term('length',fmt(s.k))} ÷ ${term('reference',1)} = ${result('scale-factor',fmt(s.k),'The length scale factor compares new length with the original.')}`);if(step===1)workFormula('areaWork',`${term('edge',2)} × ${term('edge',2)} = ${s.tiles.size===4?result('area-factor',4,'Two doubled directions give an area factor of four.'):'…'}`);if(step===2){workFormula('layerWork',`${term('layer-edge',2)} × ${term('layer-edge',2)} = ${result('layer-area',4,'There are four unit cubes in each layer.')}`);workFormula('volumeWork',`${term('layer-area',4)} × ${term('layers',s.layers)} = ${result('volume-factor',s.layers*4,'Multiply the cubes per layer by the layer count.')}`);}if(step===3||step===4){const expected=step===3?3:2,correct=validNumber(s.answer)&&Math.abs(Number(s.answer)-expected)<.01,modelOK=Math.abs(s.k-expected)<.01,ok=s.tested&&correct&&modelOK;$('scaleAnswer').className=s.tested?(correct?'good':'bad'):'';workState(s.tested?(ok?'good':'bad'):'needed');$('workNote').textContent=step===4?'A scale factor has no units; an edge length does.':'Your predicted factor stays separate from the square.';const measurement=step===4?`Edge ${fmt(2*s.k)} units; volume ${fmt(8*s.k**3,2)} unit³. Target: 64 unit³.`:`Area ${fmt(s.k*s.k,2)} unit². Target: 9 unit².`;feedback(ok?step===4?'The edge factor is 2: an edge of 4 units gives a volume of 64 unit³.':'A length factor of 3 gives an area factor of 9.':s.tested?measurement+' Revise the prediction or shape, then test again.':'Enter a factor and resize the shape. Test when both are ready.',ok,s.tested&&!ok);}if(step===5)for(const [id,value] of [['width',2],['height',s.height],['depth',2]])workFormula(id+'Work',`${term(id,fmt(value))} ÷ ${term('reference',1)} = ${result(id+'-ratio',fmt(value),'This ratio compares corresponding edges.')}`);}
  function renderVolumeTransfer(){const xx=mobile?W*.49:W*.53,baseY=H-58,edge=2*s.k,unit=Math.min(mobile?28:42,(W-xx-18)/(1.38*Math.max(edge,2)),(baseY-75)/(1.28*Math.max(edge,2))),rx=mobile?16:W*.14;sourceLabel('target-volume',W/2,25,'Target volume: 64 unit³','This is the volume to produce, not a length scale factor.','accent','middle');cube(rx,baseY,2,2,2,unit,false);sourceLabel('reference-edge',rx+unit,baseY+26,'Edge: 2 units','Every original edge is two units long.','small','middle');sourceLabel('reference-volume',rx+unit,baseY-2.56*unit-15,'Volume: 8 unit³','The original volume is 2 × 2 × 2 = 8 cubic units.','small','middle');cube(xx,baseY,edge,edge,edge,unit);handle('scale',xx+edge*unit,baseY-edge*unit,{label:'Common length scale factor',min:.5,max:3,value:s.k,increment:.1,set:scaleSet,fromPoint:p=>(p.x-xx)/(2*unit)});sourceLabel('new-edge',xx+edge*unit/2,baseY+26,`Edge: ${fmt(edge)} units`,'This is a physical edge length. Compare it with the original edge to find a ratio.','small','middle');if(s.tested)sourceLabel('new-volume',xx+edge*unit*.6,baseY-1.28*edge*unit-15,`${fmt(edge**3,2)} unit³`,'The measured volume uses all three new edge lengths.','accent','middle');updateMathWork();endDraw();}
  return {lesson,state:s,syncScene:applyScene,reset,enter,render,controls,sceneHeight,restoreView,snapshotExtras(){return null;},restoreExtras(){},stopModel(){stopConnections();}};
});
